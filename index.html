    kromatografi: { data: ['Du har en vattenlösning med peptider av mycket olika storlek.', 'De aktiva ämnena är små peptider; det mesta av giftet är stora enzymer.', 'Metoden måste vara skonsam så att peptiderna inte förstörs.'],
      fraga: 'Du väljer storleksexklusion. Vad kommer ut ur kolonnen först?',
      val: ['De stora molekylerna — de ryms inte i kornens porer och går rakt förbi', 'De små molekylerna — de rör sig snabbast', 'De mest laddade molekylerna', 'De mest opolära molekylerna'], ratt: 0,
      varforFel: [null,
        'Det är den intuitiva gissningen, och den är fel — vilket är precis därför frågan ställs. Man tänker sig små molekyler som smidiga och snabba. Men i en gelfiltrationskolonn är det inte hastigheten som skiljer dem åt, utan <i>vägen</i>: de små kommer in i kornens porer och måste slingra sig igenom varje korn de passerar, medan de stora inte får plats och sköljs rakt förbi. De små får alltså den längsta vägen och kommer ut sist.',
        'Laddning spelar ingen roll i gelfiltration — det är hela tanken med metoden. Kornen är gjorda för att vara så kemiskt ointresserade som möjligt, så att ingenting fastnar och allt skiljs enbart efter storlek. Vill du separera efter laddning väljer du jonbyte i stället.',
        'Polaritet spelar heller ingen roll här, av samma skäl: gelen är inte till för att binda något. Det är i omvänd fas och normalfas som polariteten avgör ordningen. En gelfiltrationskolonn är i princip bara ett sorteringsnät av porer.'],
      varfor: 'Det här är lätt att tänka tvärtom om. Kornen är porösa: <b>små</b> molekyler kommer in i porerna och får en lång, slingrande väg genom kolonnen, medan <b>stora</b> molekyler inte ryms och sköljs rakt igenom. Därför kommer de stora ut först och de små sist. Tre egenskaper gör metoden till förstahandsvalet just här. Den är <b>skonsam</b> — ingenting binder till gelen, det finns inget hårt lösningsmedel och inget extremt pH, så peptiderna överlever. Den skiljer på <b>exakt den axel</b> där ditt problem ligger: giftet består till största delen av stora enzym, och det du vill ha är små peptider. Och den kostar dig ingenting i information, eftersom du ändå testar varje fraktion i blodtrycksmodellen. Nackdelen är att kapaciteten är låg och topparna breda, så den används sällan ensam. <b>I dag</b> följer man upp med omvänd fas för att skilja de små peptiderna från varandra — det var så den aktiva nonapeptiden till slut kunde renas fram ur en blandning av flera närbesläktade.' },
    struktur: { data: ['Den aktiva molekylen är en peptid med nio aminosyror.', 'Den är ovanligt rik på prolin och slutar på prolin-prolin.', 'Den börjar med en ringsluten glutaminsyra (pyroglutamat).'],
      fraga: 'Hur bestämmer man strukturen hos en liten peptid?',
      val: ['Genom att sekvensera den, en aminosyra i taget från änden', 'Genom röntgenkristallografi', 'Genom att mäta smältpunkten', 'Genom att jämföra UV-spektrum med kända peptider'], ratt: 0,
      varforFel: [null,
        'Röntgenkristallografi kräver en kristall, och små flexibla peptider kristalliserar ytterst motvilligt — de har ingen bestämd form i lösning att frysa fast. Metoden är dessutom ett stort arbete att ta till när svaret ändå är en lista i en bestämd ordning. Den var oumbärlig för penicillinet, där frågan var hur atomerna satt ihop i en oväntad ring; här är byggstenarna redan kända.',
        'Smältpunkt var länge ett sätt att känna igen ett redan känt, rent kristallint ämne — man jämförde med en tabell. Den säger ingenting om vilka byggstenar som ingår eller i vilken ordning, och en peptid av det här slaget har sällan någon skarp smältpunkt alls.',
        'UV-spektrum hos en peptid domineras av peptidbindningarna själva och av de få aromatiska sidokedjorna. Alla peptider ser därför ungefär likadana ut i UV. Metoden duger utmärkt för att <i>upptäcka</i> var peptiderna kommer ut ur kolonnen, men inte för att tala om vilken peptid det är.'],
      varfor: 'För peptider är sekvensering den naturliga vägen, och den skiljer sig i grunden från hur man bestämmer en okänd liten molekyl. Här är byggstenarna redan kända — det finns bara tjugo vanliga aminosyror — så frågan är inte <i>vilka atomer</i> utan <i>i vilken ordning</i>. Man klyver av en aminosyra i taget från änden och identifierar den, metoden kallas Edmannedbrytning, eller använder masspektrometri och läser av skillnaden i massa mellan fragmenten: varje steg i trappan motsvarar en aminosyra. Två detaljer i just den här peptiden förtjänar uppmärksamhet. Att kedjan börjar med en ringsluten glutaminsyra, pyroglutamat, betyder att det inte finns någon fri aminoände att börja nedbrytningen i — ett verkligt praktiskt problem, som måste lösas innan sekvenseringen kan starta. Och att den slutar på <b>prolin–prolin</b> är den upplysning hela fortsättningen hänger på: det är den änden som sätter sig i enzymets aktiva säte, och det är den delen som till slut byggs in i läkemedlet.' },
    utveckling: { data: ['Peptiden sänker blodtrycket kraftigt — men bara när den injiceras.', 'Ges den som tablett händer ingenting: tarmens enzymer klyver peptidbindningar.', 'Enzymet den hämmar har en zinkjon i sitt aktiva säte, och peptidens prolin-prolin-ände tycks vara det som binder in.'],
      fraga: 'Hur tar du det här vidare till ett läkemedel som går att svälja?',
      val: ['Bygger en liten helsyntetisk molekyl med peptidens verksamma del som förebild', 'Renar fram peptiden ur ormgift i stor skala', 'Ger peptiden i högre dos', 'Ger peptiden som tablett tillsammans med en enzymhämmare'], ratt: 0,
      varforFel: [null,
        'Det gjordes faktiskt, och peptiden användes en tid som injektionsläkemedel. Men det löser inte problemet. Högt blodtryck är en sjukdom man har i decennier och behandlar varje dag; ett läkemedel som måste injiceras duger inte. Och råvaran är ormgift — att skala upp den till miljontals patienter är varken möjligt eller rimligt.',
        'Dosen är inte problemet. Peptiden klyvs av tarmens enzym innan den hinner tas upp, och tiodubbla mängden blir tiodubbelt så mycket nedbrutet material. Där nedbrytningen är fullständig hjälper ingen dosökning — man måste ändra molekylen, inte mängden.',
        'Tanken finns på riktigt och används i andra sammanhang, men den fungerar dåligt här. Tarmen har inte ett enzym utan många, med olika specificitet, och de finns dessutom både i tarminnehållet och i tarmväggen. Att blockera dem alla vore både opraktiskt och farligt — du behöver dem för att smälta maten. Dessutom återstår att peptiden är för stor och för polär för att tas upp även om den överlever.'],
      varfor: 'Man behöver inte behålla peptiden, bara de delar som gör jobbet. Det var ett nytt sätt att tänka 1970-talet. Enzymet hade då ingen känd struktur, men man resonerade sig fram från ett <i>besläktat</i> enzym vars aktiva säte var känt: det har en zinkjon som griper tag i en bindning och ett fack som rymmer resten av substratet. Peptidens prolin-prolin-ände visade var molekylen skulle sitta. Så byggdes den minsta molekyl som kunde göra båda sakerna samtidigt: något prolinlikt som passar i sätet, och en grupp som binder zinkjonen hårt. Den första varianten hade en karboxylgrupp och var för svag; bytet till en <b>tiolgrupp (–SH)</b>, som binder zink mycket starkare, gav ett tusenfalt kraftigare ämne. Resultatet blev captopril, som inte innehåller en enda aminosyra från ormen — bara idén. Det brukar räknas som det första läkemedlet som medvetet ritades utifrån ett enzyms aktiva säte, och blev förebild för allt som senare kallas rationell läkemedelsdesign. Tiolgruppen hade sitt pris: den gav en del patienter hudutslag och smakrubbningar, och nästa generations ACE-hämmare — enalapril och de andra — löste det genom att binda zink på ett annat sätt.' }
  },
  slutsats: 'Du har just följt upptäckten av <b>captopril</b>, med utgångspunkt i giftet från <i>Bothrops jararaca</i>.',
  sub: 'captopril'
},
{
  id: 'streptomycin', titel: 'Jakten på ett medel mot tuberkulos', ar: 1943, plats: 'Ett jordbrukslaboratorium i New Jersey',
  ingress: 'Tuberkulos är en av världens vanligaste dödsorsaker, och det finns ingen behandling alls. Du arbetar i Selman Waksmans laboratorium, där ni byggt upp något nytt: ett systematiskt program som odlar fram jordbakterier i tusental och testar varje enskilt isolat.',
  steg: {
    val: { data: ['Ni odlar fram tiotusentals isolat ur jordprover, de flesta trådformiga jordbakterier som luktar jord.', 'De flesta isolat hämmar ingenting alls. En del hämmar ofarliga testbakterier men är själva giftiga.', 'Tuberkulosbakterien växer så långsamt att ett enda test tar tre till fyra veckor innan det går att avläsa.', 'Ett isolat från en höns strupe, och ett från gödslad jord, ger båda hämning av tuberkulosbakterien.'],
      fraga: 'Testet mot tuberkulosbakterien tar veckor. Hur lägger du upp screeningen?',
      val: ['Grovsållar först mot en snabbväxande bakterie, och testar bara de aktiva isolaten mot tuberkulos', 'Testar varje isolat direkt mot tuberkulosbakterien och väntar ut de fyra veckorna', 'Hoppar över bioassayen och går på hur isolaten luktar', 'Testar bara isolat som liknar dem som redan gett antibiotika'], ratt: 0,
      varforFel: [null,
        'Det är det vetenskapligt renaste alternativet, och just därför frestande: du testar mot exakt den bakterie du vill döda, utan omvägar. Men räkna på det. Tiotusentals isolat, fyra veckor per avläsning, och plattor som måste hållas i gång hela tiden — programmet skulle ta decennier och sluka hela labbets utrymme. Ett bioassay som inte går att köra i tusental är inget bioassay i ett screeningprogram, hur rätt fråga det än ställer.',
        'Doften av jord kommer från geosmin, som <i>Streptomyces</i> mycket riktigt bildar — så lukten säger att du har rätt sorts bakterie framför dig. Men nästan alla dina isolat är den sorten, och de allra flesta av dem bildar ingenting användbart. Lukten skiljer inte de aktiva från de overksamma, och det är det enda du behöver hjälp med.',
        'Det låter förnuftigt och är till hälften det — det är därför man medvetet letar bland <i>Streptomyces</i> och inte slumpmässigt bland allt som växer. Men dras urvalet för hårt åt det redan kända hittar du bara mer av samma sak. Det är precis den fällan de senare screeningprogrammen gick i: på 1960-talet dök streptomycin och dess släktingar upp om och om igen, medan det nya blev allt svårare att hitta.'],
      varfor: 'Ett bioassay måste gå att upprepa i tusental — annars går programmet inte att driva. Lösningen är att sålla i två steg: ett snabbt och billigt test först, och det långsamma, dyra testet bara på det lilla fåtal som klarat sig igenom. Du odlar varje isolat i en strimma på en platta, låter en snabbväxande testbakterie växa tvärs över, och läser av nästa dag om strimman har en klar zon omkring sig. De isolat som ger zon — kanske ett av hundra — får sedan gå vidare till det fyra veckor långa tuberkulostestet. Priset är att du missar ett ämne som skulle ha träffat bara tuberkulosbakterien och inget annat, och det är ett verkligt pris; vinsten är att programmet blir möjligt över huvud taget. Samma tvåstegsprincip styr all läkemedelsscreening än i dag, bara med robotar i stället för plattor. Här gav den två isolat av samma art: ett ur en hönas strupe och ett ur gödslad jord. Det var första gången någon hittat ett läkemedel genom att <b>leta systematiskt</b> i stället för att vänta på en lycklig slump — hela skillnaden mot mögelfläcken i London femton år tidigare.' },
    extraktion: { data: ['Odlingsvätskan är aktiv. Du vill få över ämnet i ett organiskt lösningsmedel.', 'Det följer inte med vare sig etylacetat eller butanol.', 'Ämnet visar sig vara starkt <b>basiskt</b>: det bär guanidingrupper, som är bland de mest basiska grupper som finns i naturen.', 'Du höjer pH ända till 11 för att få basen oladdad. Den stannar ändå i vattnet.'],
      fraga: 'Varför hjälper inte pH-knepet här?',
      val: ['Guanidingrupperna är så starkt basiska att de förblir laddade även vid högt pH', 'Ämnet är en syra, inte en bas', 'Etylacetat är för opolärt för alla baser', 'Ämnet har brutits ner av det höga pH-värdet'], ratt: 0,
      varforFel: [null,
        'Vore det en syra skulle du ha sänkt pH i stället, och då hade knepet fungerat. Men du har redan konstaterat motsatsen: ämnet är basiskt. Och lägg märke till att felsvaret inte ens hjälper dig — det förklarar inte varför ett högt pH misslyckas, det byter bara ut premissen.',
        'Baser extraheras rutinmässigt till etylacetat, och till och med till hexan, så fort de är oladdade — det är standardmetoden för alkaloider ur växter. Lösningsmedlet är alltså inte problemet. Problemet är att just den här basen vägrar bli oladdad.',
        'Ett rimligt bekymmer, och något man alltid ska ha i tanken vid ytterlighets-pH. Men här är det inte förklaringen: aktiviteten finns kvar i vattenfasen, oförändrad. Hade ämnet brutits ner skulle aktiviteten ha försvunnit helt, inte bara stannat kvar på fel ställe.'],
      varfor: 'pH-knepet bygger helt på att man kan göra ämnet oladdat, och det går inte alltid. En vanlig amin har ett pKa kring 9–10 och är oladdad vid pH 11. En <b>guanidingrupp</b> — samma grupp som sitter i aminosyran arginin — har ett pKa runt 12–13, och din molekyl har två av dem. De är alltså protonerade och positivt laddade i praktiskt taget hela det pH-intervall man kan arbeta i; för att få dem oladdade skulle du behöva ett pH som förstör molekylen långt innan. Lägg märke till vad den här vetskapen är värd: misslyckandet har just talat om för dig att ämnet är mycket polärt, permanent positivt laddat och därmed säkert vattenlösligt — tre upplysningar som styr både nästa steg (jonbyte, och då en katjonbytare) och sista steget (ingen tablett). I labbet 1943 fångades ämnet i stället upp på aktivt kol och eluerades därifrån med sur alkohol. Mönstret är detsamma som för vankomycin: när fördelning mellan faser inte biter byter man princip och låter ämnet binda till något fast.' },
    kromatografi: { data: ['Ämnet är starkt basiskt och bär flera positiva laddningar i lösning.', 'Du bestämmer dig för jonbyte.'],
      fraga: 'Vilken sorts jonbytare binder ditt positivt laddade ämne?',
      val: ['En katjonbytare, som själv bär negativa laddningar', 'En anjonbytare, som själv bär positiva laddningar', 'Det spelar ingen roll, båda binder laddade ämnen', 'Ingen av dem — jonbyte fungerar bara för sura ämnen'], ratt: 0,
      varforFel: [null,
        'Här blir det precis tvärtom mot avsikten. En anjonbytare bär själv positiva grupper, och eftersom lika laddningar stöter bort varandra skulle ditt positivt laddade ämne sköljas rakt igenom kolonnen. Namnet är det som förvirrar: en anjonbytare heter så efter vad den <i>binder</i> — anjoner — inte efter sin egen laddning. Tänk alltid på vad kolonnen ska fånga, så blir valet rätt.',
        'Båda binder laddade ämnen, men inte samma laddning — och det är hela poängen. Vore laddningens tecken likgiltigt skulle jonbyte inte separera någonting: allt laddat skulle fastna och allt oladdat passera. Att du kan välja vilken halva av provet som binder är det som gör metoden användbar.',
        'Jonbyte fungerar för allt som bär laddning, sura såväl som basiska ämnen — bara med olika sorters kolonn. Sura ämnen är negativa och fastnar på en anjonbytare; basiska är positiva och fastnar på en katjonbytare. Vankomycinberättelsen i den här modulen använder samma metod åt andra hållet.'],
      varfor: 'Jonbyte bygger på att motsatta laddningar dras till varandra. Ett positivt laddat ämne binder till en kolonn som bär negativa grupper: en <b>katjonbytare</b> (den byter alltså till sig katjoner). En anjonbytare bär positiva grupper och skulle stöta bort ditt ämne. Den enklaste minnesregeln är att läsa namnet som "det den fångar", inte "det den är". Elueringen sker genom att höja salthalten — saltets egna joner konkurrerar om bindningsplatserna och knuffar av ditt ämne — eller genom att ändra pH så att laddningen försvinner, vilket här inte går eftersom guanidingrupperna aldrig släpper sin proton. Alltså: saltgradient. Och lägg märke till kedjan genom berättelsen: samma laddning som omöjliggjorde extraktionen är nu det enda greppet du har om molekylen. Det är samma mönster som i vankomycinfallet, och det är inte en slump utan regel — en molekyls mest besvärliga egenskap är nästan alltid också den mest användbara.' },
    struktur: { data: ['Massan är 581. Molekylen innehåller mycket kväve och syre men inga aromatiska ringar alls.', 'Hydrolys ger inga aminosyror och ingen lång kolkedja.', 'I stället får du tre ringformade enheter som alla ser ut som sockerarter.', 'Två av ringarna bär guanidingrupper, en bär en aminogrupp, och en har en aldehydgrupp.'],
      fraga: 'Vad är det för sorts molekyl?',
      val: ['En aminoglykosid — sockerringar där OH-grupper bytts mot amino- och guanidingrupper', 'En polyketid, byggd av acetatenheter', 'En icke-ribosomal peptid', 'En terpen, byggd av isoprenenheter'], ratt: 0,
      varforFel: [null,
        'En polyketid känns igen på en kolkedja med syre på varannan eller var tredje position, ofta med aromatiska ringar eller en stor laktonring som resultat — erytromycin och tetracyklin i den här modulen är exempel. Du har inga aromatiska ringar alls och ingen lång kolkedja, utan ringar som är fulla av syre och kväve på <i>varje</i> kol. Det är sockrens signatur, inte polyketidernas.',
        'En peptid ger aminosyror vid hydrolys — det är själva definitionen av testet. Din hydrolys gav inga. Molekylen innehåller mycket kväve, vilket kan föra tankarna åt det hållet, men kvävet sitter som amino- och guanidingrupper direkt på sockerringarna, inte i amidbindningar mellan byggstenar.',
        'Terpener byggs av isoprenenheter om fem kol och är som regel fettlösliga kolväten med få syreatomer — raka motsatsen till det du har framför dig. En molekyl som vägrar lämna vattenfasen vid varje pH är ungefär det minst terpenlika som finns.'],
      varfor: 'Byggstenarna avgör saken, och det är så man alltid börjar: vilka bitar faller ut när molekylen bryts isär? Inga aminosyror utesluter peptider. Ingen kedja av tvåkolsenheter utesluter polyketider. Inga femkolsenheter utesluter terpener. Kvar blir socker — tre ringar som alla ser ut som sockerarter — och socker där hydroxylgrupper ersatts av kvävegrupper kallas <b>aminoglykosider</b>. Namnet beskriver alltså exakt det du ser: amino, glykosid. Det förklarar på en gång allt det molekylen gjort tidigare i berättelsen: varför den är så vattenlöslig (syre och kväve överallt), varför den är permanent laddad (guanidin), och varför den aldrig gick att extrahera. Och det pekar framåt. En starkt positivt laddad molekyl söker sig till det som är negativt laddat, och det mest negativt laddade i en bakteriecell är dess RNA: streptomycin binder till den lilla subenheten av ribosomen och får den att läsa av koden fel, så att bakterien tillverkar oanvändbara proteiner. Samma laddning som styrde hela reningen styr alltså också verkningsmekanismen.' },
    utveckling: { data: ['Ämnet botar tuberkulos hos marsvin, och sedan hos människa. Det är första gången någonsin.', 'Men i de första studierna blir många patienter bättre i några månader och sedan sämre igen.', 'Odlingar från dem visar bakterier som växer obehindrat i ämnet.', 'Dessutom får en del patienter bestående hörselnedsättning och yrsel.'],
      fraga: 'Bakterierna blir resistenta under pågående behandling. Vad är lösningen?',
      val: ['Ge flera läkemedel med olika angreppspunkt samtidigt', 'Ge en högre dos av samma ämne', 'Behandla under kortare tid', 'Byta till ett annat enskilt läkemedel när resistens uppstår'], ratt: 0,
      varforFel: [null,
        'Högre dos hjälper mot bakterier som är <i>måttligt</i> okänsliga, men inte mot dem som bär en mutation i själva målstrukturen — för dem binder läkemedlet inte alls, och tio gånger ingenting är fortfarande ingenting. Här är dosökning dessutom särskilt dålig idé: ämnet skadar hörsel- och balansnerven, och den skadan är bestående. Du skulle döva patienten utan att bota infektionen.',
        'Tvärtemot vad som behövs. Tuberkulosbakterien delar sig ungefär en gång om dygnet och går in i vilande tillstånd där inget läkemedel biter; kortare behandling lämnar just de vilande kvar att starta om infektionen, nu med de mest motståndskraftiga bakterierna först. Det är därför behandlingen än i dag pågår i sex månader eller längre, och varför avbruten behandling är en av de viktigaste orsakerna till resistent tuberkulos.',
        'Det är precis vad man gjorde i början, och det misslyckades på ett lärorikt sätt. Byter du när resistensen redan är ett faktum möter nästa läkemedel en infektion som nu nästan enbart består av motståndskraftiga bakterier — och samma sak upprepas, ett läkemedel i taget, tills inga återstår. Läkemedlen måste ges <i>samtidigt</i>, medan de fortfarande kan täcka upp för varandra.'],
      varfor: 'I en infektion finns miljardtals bakterier, och några bär redan av en slump en mutation som gör dem okänsliga — innan behandlingen ens börjat. Ger du ett enda medel dödar du alla utom dem, och lämnar hela utrymmet åt just dem. Det är naturligt urval i snabbspolning, och förloppet syns tydligt i siffrorna: patienterna blir bättre i några månader och sedan sämre igen. Ger du däremot två eller tre medel med <i>olika</i> angreppspunkter måste en och samma bakterie råka bära mutationer mot alla samtidigt. Är chansen en på miljonen för var och en blir den en på en miljard miljarder för tre, och så många bakterier finns inte i en patient. Det är därför tuberkulos än i dag behandlas med tre till fyra läkemedel samtidigt i många månader. Två andra saker i den här berättelsen är värda att minnas. Biverkningen — bestående hörselnedsättning och yrsel — sitter kvar och beror på att hårcellerna i innerörat är ovanligt känsliga för aminoglykosider; det är en av orsakerna till att streptomycin i dag används sparsamt. Och prövningen som visade att medlet fungerade genomfördes 1948 genom att slumpa patienterna mellan behandling och ingen behandling. Det brukar räknas som den första moderna randomiserade kliniska prövningen — alltså fick världen två saker ur den här historien: ett läkemedel och ett sätt att veta om läkemedel fungerar.' }
  },
  slutsats: 'Du har just följt upptäckten av <b>streptomycin</b> ur <i>Streptomyces griseus</i>.',
  sub: 'streptomycin'
},
{
  id: 'ivermektin', titel: 'Jordprovet från golfbanan', ar: 1974, plats: 'Ett forskningsinstitut i Tokyo',
  ingress: 'Du är Satoshi Ōmura och har för vana att ha med dig små plastpåsar vart du än går. Ser du intressant jord tar du ett prov. Du odlar fram jordbakterier ur proverna och skickar dem till ett laboratorium i USA, som testar dem åt dig.',
  steg: {
    val: { data: ['Du samlar jord överallt: skogsbryn, åkerkanter, en golfbana nära Itō söder om Tokyo.', 'Ur proverna odlar du fram tusentals isolat av trådformiga jordbakterier.', 'Samarbetslaboratoriet testar inte på plattor. De ger extrakten till <b>möss som infekterats med parasitmask</b> och räknar maskar efteråt.', 'Av tusentals prover ger ett enda tydlig effekt: mössen blir av med sina maskar.'],
      fraga: 'Varför testa i levande möss i stället för på en odlingsplatta?',
      val: ['Parasitmaskar går inte att odla på en platta — testet måste innehålla både parasiten och en värd', 'Möss är billigare än agarplattor', 'För att direkt mäta biverkningar', 'För att maskar bara växer vid kroppstemperatur'], ratt: 0,
      varforFel: [null,
        'Tvärtom, med mycket bred marginal. En agarplatta kostar några ören och kan hanteras i tusental av en person; ett djurförsök kostar hundratals gånger mer, tar veckor och kräver personal, utrymme och etiskt tillstånd. Det är just därför man annars gör allt för att undvika det — och därför valet att ändå göra det här måste ha ett tvingande skäl.',
        'Det är en verklig bonus, och ett ämne som dödar musen faller självklart bort direkt. Men biverkningar var inte skälet att välja upplägget — man hade inget val. Hade parasiten gått att odla fritt skulle man ha sållat på plattor först och tagit djurförsöken sedan, precis som i tuberkulosprogrammet.',
        'Temperaturen är inget hinder: ett värmeskåp håller 37 °C utan problem, och mängder av organismer odlas just så. Det som saknas är inte värmen utan värden — parasitmasken behöver tarmvävnad, värdens signalämnen och hela dess miljö för att leva och fortplanta sig.'],
      varfor: 'Bioassayen måste mäta det du faktiskt är ute efter. En parasitmask i tarmen lever i ett samspel med sin värd och går inte att odla fritt i en skål, så ett plattest är helt enkelt omöjligt — du har ingenting att lägga på plattan. Alltså ger man extrakten till infekterade möss, blandade i fodret, och räknar maskar efteråt. Priset är högt: testet är dyrt, långsamt, kräver djurförsök och går inte att köra i tiotusental. Men det har en oväntad fördel som visade sig avgörande. Ett ämne som fungerar i en levande mus har redan, utan att du behövt fråga, bevisat att det <b>tas upp från tarmen</b>, att det <b>når fram till parasiten</b>, att det <b>inte bryts ner på vägen</b> och att det <b>inte dödar musen</b>. I ett plattest hade du fått veta bara att ämnet är giftigt för något i en skål, och de fyra frågorna hade återstått — det är precis där de flesta läkemedelskandidater faller. Ett enda prov av tusentals gav napp: jord från en golfbana nära Itō söder om Tokyo. Bakterien som växte ur den har trots idogt letande aldrig återfunnits någon annanstans i världen.' },
    extraktion: { data: ['Du odlar bakterien i fermentor och får en grumlig, gulaktig vätska.', 'Du skakar den med ett organiskt lösningsmedel i en skiljetratt.', 'Nästan all aktivitet följer med det organiska skiktet.', 'Att ändra pH gör ingen skillnad alls.'],
      fraga: 'Vad säger fördelningen mellan faserna om molekylen?',
      val: ['Den är fettlöslig och oladdad', 'Den är en syra', 'Den är en bas', 'Den är mycket vattenlöslig'], ratt: 0,
      varforFel: [null,
        'En syra skulle byta skikt med pH: oladdad och fettlöslig i surt, laddad och vattenlöslig i basiskt. Det var precis så penicillinet renades, och det var hela nyckeln där. Ditt ämne rör sig inte alls när du ändrar pH, vilket betyder att det inte har någon sur grupp som spelar roll för lösligheten.',
        'En bas gör samma sak som en syra fast omvänt — laddad i surt, oladdad i basiskt — och skulle också flytta sig när du ändrar pH. Att ingenting händer är den avgörande upplysningen, och den utesluter båda. Jämför med streptomycinberättelsen, där basiciteten tvärtom styrde allt.',
        'Då hade aktiviteten stannat kvar i vattenfasen, som den gjorde för vankomycin och för ormgiftets peptider. Din aktivitet följde nästan helt med det organiska skiktet, vilket är ett direkt mått på motsatsen. Skiljetratten har just svarat på frågan åt dig.'],
      varfor: 'Skiljetratten är inte bara ett reningssteg utan också en mätning — den enklaste polaritetsmätning som finns. Går ämnet över i det organiska skiktet är det tillräckligt opolärt för det; stannar det i vattnet är det inte det. Att pH inte spelar någon roll betyder dessutom att molekylen varken är en syra eller en bas: den har inga grupper som kan laddas upp eller av. Fettlöslig och oladdad. Den upplysningen är värd mer än den ser ut att vara, för den avgör tre saker på en gång. Den säger vilken kolonn du ska välja härnäst (kiselgel, inte jonbyte). Den förutsäger vad strukturbestämningen kommer att visa — en molekyl utan laddningsbara grupper har sannolikt inget kväve alls, vilket utesluter peptider och alkaloider redan innan du mätt något. Och den säger något om hur läkemedlet kommer att bete sig i kroppen: fettlösliga ämnen tas upp från tarmen, lagras i fettväv och verkar länge. Det är därför ivermektin kan ges som en enda dos en eller två gånger om året.' },
    kromatografi: { data: ['Ämnet är fettlösligt och oladdat.', 'Du vill separera det från andra fettlösliga ämnen i extraktet.'],
      fraga: 'Vilken kolonn väljer du, och hur eluerar du?',
      val: ['Kiselgel i normalfas, och eluerar med allt polärare lösningsmedel', 'Jonbyte, och eluerar med salt', 'Gelfiltration i vatten', 'Katjonbytare, och eluerar genom att sänka pH'], ratt: 0,
      varforFel: [null,
        'Jonbyte kräver att ämnet bär laddning, och du har just visat att det inte gör det — pH påverkade ingenting. På en jonbytare skulle ditt ämne rinna rakt igenom tillsammans med allt annat oladdat i extraktet, och det är merparten. Ingen separation.',
        'Gelfiltration skiljer bara på storlek, och framför allt: ditt ämne är fettlösligt och löser sig dåligt i vatten, som är den mobilfas gelfiltration normalt körs i. Du skulle få ett ämne som faller ut eller fastnar ospecifikt. Metoden hör hemma i vattenlösningar, typiskt för peptider och proteiner.',
        'Dubbelt fel, och på ett lärorikt sätt. En katjonbytare binder positivt laddade ämnen, och ditt är oladdat. Dessutom är sänkt pH fel elueringsriktning även om ämnet hade varit en bas: sänkt pH gör en bas <i>mer</i> laddad och får den att binda hårdare, inte släppa.'],
      varfor: 'Kiselgel är en polär stationärfas, så polära ämnen binder hårdast och sitter kvar längst medan opolära kommer ut först. Därför börjar man med ett opolärt lösningsmedel, till exempel hexan, och ökar polariteten stegvis genom att blanda in mer och mer etylacetat eller metanol — ämnena släpper då i tur och ordning efter hur polära de är. Det kallas gradienteluering, och tanken är densamma som att långsamt höja temperaturen tills varje sak smälter i sin tur. Valet följer direkt ur förra steget: oladdat utesluter jonbyte, fettlösligt utesluter vattenbaserad gelfiltration, och kvar står polariteten som den enda axel du har att separera längs. Observera att du fortfarande inte vet vad ämnet är — du samlar fraktioner, skickar dem till musförsöket och ser vilken som tar bort maskarna. Hela reningen styrs av aktiviteten, inte av kemin. <b>I dag</b> skulle man följa upp med omvänd fas och direkt koppla kolonnen till en masspektrometer, så att man ser både aktivitet och massa i samma körning.' },
    struktur: { data: ['Massan är hög: över 850.', 'NMR visar en mycket stor ring, sluten med en esterbindning, och flera mindre ringar som sitter ihop med den.', 'Kolkedjan är uppbyggd av enheter om två och tre kol, med metylgrupper som sticker ut med jämna mellanrum.', 'Två sockerenheter hänger i ena änden.', 'Molekylen innehåller inget kväve alls.'],
      fraga: 'Hur har bakterien byggt den här molekylen?',
      val: ['Som en polyketid: ett PKS-enzym har fogat ihop acetat- och propionatenheter', 'Som en icke-ribosomal peptid (NRPS)', 'Som en ribosomal peptid', 'Som en aminoglykosid, av sockerenheter'], ratt: 0,
      varforFel: [null,
        'En peptid — ribosomal eller inte — består av aminosyror, och varje aminosyra bär ett kväve. Din molekyl innehåller <i>inget kväve alls</i>. Det enda fyndet avgör frågan på en gång och gör alla peptidalternativ omöjliga, hur stor och komplicerad molekylen än är.',
        'Samma invändning, och dessutom en till: en ribosomal peptid är genkodad och består av vanliga aminosyror i rad. Här finns varken kväve eller någon kedja av aminosyror. Lägg märke till hur mycket arbete ett enda negativt fynd kan göra — "inget kväve" stryker två av fyra alternativ direkt.',
        'Två sockerenheter finns mycket riktigt, men de hänger i ena änden som utsmyckning. En aminoglykosid består helt och hållet av sockerringar, och de bär dessutom kväve i form av amino- och guanidingrupper — jämför streptomycin i den här modulen. Här är kärnan en stor kolring, och det är kärnan som bestämmer klassen.'],
      varfor: 'Inget kväve betyder inga aminosyror, alltså ingen peptid — ett enda fynd som stryker halva alternativlistan. Kvar är frågan vilken sorts kolkedja det är, och där ligger svaret i mönstret: enheter om två och tre kol med metylgrupper som sticker ut med jämna mellanrum. Det är signaturen för ett <b>polyketidsyntas</b>, ett löpande band av enzymmoduler som bygger kedjan genom att lägga till en acetatenhet (två kol) eller en propionatenhet (tre kol, vilket ger den utstickande metylgruppen) i taget. Varje modul bestämmer dessutom hur långt det nytillkomna syret ska reduceras, vilket är förklaringen till att samma kedja kan ha en ketogrupp här, en hydroxylgrupp där och en dubbelbindning på tredje stället. Till sist sluter ett avslutande enzym kedjan till en ring med en esterbindning — en <b>makrolakton</b>. Samma maskineri, med andra moduler, bygger erytromycin, amfotericin B, rifamycin och rapamycin: när du väl känner igen mönstret känner du igen en stor del av alla läkemedel från jordbakterier. Verkningsmekanismen visade sig passa ihop med fettlösligheten: molekylen öppnar kloridkanaler som bara ryggradslösa djur har, och parasiten förlamas.' },
    utveckling: { data: ['Ämnet dödar parasiter i mycket låg dos och är anmärkningsvärt ofarligt för däggdjur.', 'Men det finns en dubbelbindning i molekylen som gör den kemiskt känsligare och preparatet mer toxiskt.', 'Dubbelbindningen går att hydrera — ett enkelt kemiskt ingrepp på den färdiga naturprodukten.', 'Resten av molekylen är alldeles för komplicerad för att byggas från grunden.'],
      fraga: 'Hur tar du ämnet vidare?',
      val: ['Semisyntes: odla fram naturprodukten och hydrera den ena dubbelbindningen', 'Använda naturprodukten precis som den är', 'Bygga en helt syntetisk kopia', 'Tillverka ämnet rekombinant i jäst'], ratt: 0,
      varforFel: [null,
        'Det vore det enklaste, och naturprodukten fungerar — den togs också fram som veterinärmedel. Men när ett ingrepp är så litet som att mätta en enda dubbelbindning, och vinsten är ett ämne med bredare säkerhetsmarginal, är det svårt att försvara att låta bli. Det här är ett läkemedel som skulle ges till hundratals miljoner friska människor i massbehandling; då väger varje procent säkerhetsmarginal tungt.',
        'Molekylen har en makrolaktonring, flera sammanvuxna ringsystem, två socker och ett tjugotal stereocentrum. En totalsyntes har genomförts som vetenskapligt mästerprov, men den har många steg och ett försvinnande litet utbyte. Att göra det industriellt, till ett pris som gör massbehandling i världens fattigaste länder möjlig, är helt otänkbart. Jäsning kostar nästan ingenting i jämförelse.',
        'Rekombinant tillverkning fungerar för proteiner, som en enda gen kodar för — insulin i den här modulen är exemplet. En polyketid byggs däremot av ett helt kluster av stora enzym som måste samarbeta i rätt ordning, och att flytta ett sådant kluster till jäst och få det att fungera är svårt än i dag. Och det finns ingen anledning: <i>Streptomyces avermitilis</i> gör redan jobbet utmärkt.'],
      varfor: 'Det här är semisyntes i sin renaste form: låt bakterien göra det svåra, och gör själv bara det lilla sista. Avvägningen är alltid densamma — behåll den komplicerade kärnan som vore orimlig att bygga, ändra bara det som behöver ändras. Här räckte det med att mätta en enda dubbelbindning med väte, ett rutiningrepp i vilket organiskt labb som helst, och resultatet fick både bättre effekt och bredare marginal mellan verksam och skadlig dos. Namnet avslöjar det: ivermektin är <i>dihydro</i>avermektin. Att ämnet är så ofarligt för oss beror på att kloridkanalen det öppnar bara finns hos ryggradslösa djur, och på att blod–hjärnbarriären aktivt pumpar ut molekylen ur hjärnan — hos vissa hundraser med en mutation i just den pumpen är ivermektin tvärtom farligt. Ōmura och William Campbell fick Nobelpriset 2015, och läkemedlet delas sedan 1987 ut gratis i de program som i dag har flodblindhet nära utrotning. Historien är alltså också ett exempel på något annat: ett läkemedel för en sjukdom hos dem som inte kan betala blev av med sitt prisproblem genom att tillverkningen var så billig.' }
  },
  slutsats: 'Du har just följt upptäckten av <b>ivermektin</b> ur <i>Streptomyces avermitilis</i>.',
  sub: 'ivermektin'
},
{
  id: 'zikonotid', titel: 'Snäckan som jagar fisk', ar: 1979, plats: 'Ett marinbiologiskt laboratorium på Filippinerna',
  ingress: 'Du växte upp vid Filippinernas kust, där vackra kägelsnäckor ligger i sanden och barn varnas för att plocka upp dem. Nu är du forskare, och du har sett något du inte kan förklara.',
  steg: {
    val: { data: ['Snäckan kryper långsammare än nästan allt annat i havet.', 'Ändå lever den på fisk — och fisken simmar hundra gånger fortare än snäckan.', 'På film syns hur snäckan skjuter ut en harpunliknande tand och träffar fisken. Fisken slutar röra sig nästan omedelbart.', 'Fiskare som stuckit sig på en kägelsnäcka beskriver domningar och i svåra fall andningsförlamning.'],
      fraga: 'Vad måste gälla för giftet, om bytet ska stanna så snabbt?',
      val: ['Det måste träffa nervsystemet direkt och verka på sekunder', 'Det måste vara mycket surt och fräta sönder vävnad', 'Det måste vara ett långsamt verkande cellgift', 'Det måste först brytas ner i fiskens mage'], ratt: 0,
      varforFel: [null,
        'Frätskador tar tid och gör inte en fisk orörlig — den skulle simma undan, skadad men i högsta grad rörlig. Dessutom bygger hela snäckans jaktmetod på det motsatta: bytet måste sluta röra sig <i>innan</i> det hinner fly, eftersom snäckan själv rör sig långsamt. Ospecifik vävnadsskada duger inte till det.',
        'Ett cellgift dödar celler som delar sig, över timmar och dygn. Fisken skulle simma i väg och må dåligt nästa vecka, vilket inte hjälper en snäcka som ska äta i dag. Tidsförloppet är den viktigaste upplysningen i hela observationen: sekunder utesluter allt som kräver nedbrytning, upptag eller celldelning.',
        'Giftet sprutas in genom en harpunliknande tand direkt i fisken; det äts inte. Och ett ämne som måste passera magsäck och tarm skulle verka om tiotals minuter i bästa fall. Att det går på sekunder betyder att ämnet redan är verksamt i den form det sprutas in.'],
      varfor: 'Observationen i sig berättar vad slags gift det är, innan du gjort en enda mätning. En förlamning som slår in på sekunder kan inte bero på nedbrytning av vävnad, inte på något som först måste tas upp och fördelas, och inte på celldöd — allt det tar tid. Kvar finns bara en möjlighet: ett ämne som griper direkt in i nervernas signalering, där förloppen mäts i millisekunder. Två saker gör det här till en bra utgångspunkt för läkemedelsforskning. För det första är ämnen som styr nervsignaler precis vad man vill ha när man letar efter smärtlindring — smärta <i>är</i> en nervsignal. För det andra måste ett gift som ska stoppa ett byte på sekunder vara ytterst träffsäkert; evolutionen har gjort finslipningen åt dig, under miljontals år av urval där varje missriktad molekyl innebar en förlorad måltid. Kägelsnäckor är långsamma och jagar snabb fisk, och den obalansen är skälet till att deras gifter är några av de mest selektiva ämnen som finns i naturen.' },
    extraktion: { data: ['Du dissekerar ut giftkörteln och gångarna ur snäckan och mal ner dem i kall buffert.', 'Varje snäcka ger några mikroliter gift.', 'Giftet är en vattenlösning som innehåller <b>hundratals</b> olika små peptider — inte en handfull.', 'Värme och organiska lösningsmedel förstör aktiviteten.'],
      fraga: 'Hur hanterar du ett gift som består av hundratals peptider?',
      val: ['Arbetar kallt i vattenlösning och separerar dem, med bioassay på varje fraktion', 'Skakar med etylacetat för att få bort det mesta', 'Kokar giftet för att fälla ut de stora proteinerna', 'Hydrolyserar giftet för att få ut aminosyrorna'], ratt: 0,
      varforFel: [null,
        'Allt du vill ha stannar i vattenfasen, och du har just fått veta att organiska lösningsmedel förstör aktiviteten. Du skulle alltså lägga ned arbete på att flytta bort ingenting, och skada det lilla du har medan du gör det. Kom ihåg hur dyrbart materialet är: varje snäcka ger några mikroliter.',
        'Kokning fäller mycket riktigt ut stora proteiner — men den förstör också dina små peptider, eller åtminstone deras form. Och just här finns en extra fälla: de här peptiderna håller ihop med svavelbryggor, och värme i kombination med fria tioler får bryggorna att paras om till fel partner. Du får tillbaka samma aminosyror i samma ordning, men en annan molekyl, utan verkan.',
        'Hydrolys bryter isär precis det du letar efter. Du skulle få en lösning av fria aminosyror, identisk med vad vilket protein som helst ger, och all information om vilka peptider som fanns och vad de gjorde vore borta. Hydrolys är ett analyssteg man gör på en <i>renad</i> peptid för att se vad den innehåller, aldrig ett reningssteg.'],
      varfor: 'Peptider är polära och laddade och stannar i vattenfasen; värme och organiska lösningsmedel förstör dem. Det finns ingen genväg: giftet måste separeras som det är, kallt, i buffert, med bioassay på varje enskild fraktion. Det är mödosamt, och materialet räcker knappt — varje snäcka ger några mikroliter, så en enda körning kan kosta dussintals djur. Men lägg märke till att svårigheten i det här fallet är av ett helt nytt slag, som ingen av mikrobberättelserna haft. Där letade du efter <i>ett</i> aktivt ämne i en soppa av skräp. Här är nästan allt i provet aktivt: över hundra olika peptider, var och en med sitt eget mål i nervsystemet, var och en värd ett eget forskningsprojekt. Frågan är inte "vilken fraktion gör något?" utan "vilken fraktion gör just det jag vill ha?" — och det avgörs helt av hur bioassayen är ställd. Den grupp som gjorde arbetet testade genom att ge fraktioner till möss och se vad som hände, och kunde på så sätt skilja de peptider som förlamar från dem som gör något annat. Ur ett och samma gift har den vägen gett upphov till en hel verktygslåda av ämnen som nervforskare använder än i dag.' },
    kromatografi: { data: ['Peptiderna i giftet är nästan alla lika stora — mellan 10 och 30 aminosyror.', 'Du provar gelfiltration. Allt kommer ut i ungefär samma fraktioner.', 'Du behöver skilja på molekyler som liknar varandra till storleken men skiljer sig i vilka aminosyror de innehåller.'],
      fraga: 'Vilken metod skiljer peptider som är lika stora men olika till sin karaktär?',
      val: ['Omvänd fas (C18) — separerar efter hur opolär peptiden är', 'Gelfiltration med mindre porer', 'Normalfas på kiselgel med hexan', 'Vätske–vätskeextraktion med etylacetat'], ratt: 0,
      varforFel: [null,
        'Finare porer gör gelfiltrationen känsligare för <i>små</i> storleksskillnader, men dina peptider skiljer sig knappt i storlek alls — de ligger mellan 10 och 30 aminosyror och de intressanta är praktiskt taget lika långa. Du förfinar en metod längs en axel där det inte finns någon skillnad att mäta. Byt axel i stället.',
        'Kiselgel med hexan är gjort för fettlösliga ämnen, och en peptid med laddade sidokedjor löser sig inte i hexan över huvud taget — provet skulle falla ut på kolonnens topp. Dessutom binder laddade grupper hårt till kiselgelens egna sura ytgrupper. Fel verktyg för fel sorts molekyl.',
        'Peptiderna stannar i vattenfasen, det visade redan förra steget, och etylacetat skadar dem dessutom. Ett försök som redan svarat nej ger samma svar en gång till. Lägg märke till att samma felsvar dykt upp i varje djurberättelse i modulen — vätske–vätskeextraktion är nästan aldrig vägen fram för peptider.'],
      varfor: 'Gelfiltration skiljer bara på storlek, så peptider av samma längd följs åt oavsett hur olika de är i övrigt. <b>Omvänd fas</b> separerar i stället efter polaritet, och är precis tvärtom mot kiselgel: stationärfasen är opolär (långa C18-kedjor bundna till kiselpartiklar) och mobilfasen är polär (vatten med gradvis mer acetonitril). Peptider med många opolära sidokedjor — leucin, fenylalanin, tryptofan — binder hårdast och kommer ut sist, medan de med många laddade sidokedjor kommer ut tidigt. Eftersom varje peptid har sin alldeles egna uppsättning aminosyror får var och en sin egen retentionstid, och två peptider som skiljer sig på en enda position hamnar i olika fraktioner. Det är skälet till att omvänd fas är standardmetoden för peptider, och till att den här sortens arbete över huvud taget blev möjligt först på 1970-talet när C18-kolonnerna kom — i penicillinets tid hade ett gift med hundra närbesläktade peptider varit hopplöst. En praktisk detalj: man tillsätter ofta en liten mängd stark syra i mobilfasen, så att alla peptider har samma laddningstillstånd och topparna blir skarpa.' },
    struktur: { data: ['Den aktiva peptiden är 25 aminosyror lång.', 'Sekvenseringen går trögt: kedjan verkar sitta ihop med sig själv.', 'Aminosyraanalysen visar sex cysteiner.', 'Reducerar du provet först, så att svavelbryggor bryts, går sekvenseringen utmärkt — men peptiden tappar då sin verkan.'],
      fraga: 'Vad behöver du bestämma utöver aminosyrornas ordning?',
      val: ['Vilka cysteiner som sitter ihop parvis med svavelbryggor', 'Molekylens smältpunkt', 'Hur många väteatomer peptiden innehåller', 'Vilken bakterie som tillverkat peptiden'], ratt: 0,
      varforFel: [null,
        'Smältpunkt användes förr för att känna igen ett redan känt, rent kristallint ämne. En liten peptid i vattenlösning har ingen användbar smältpunkt, och även om den hade det skulle den inte säga något om hur kedjan är knuten. Frågan här är form, inte identitet.',
        'Antalet väteatomer följer av sekvensen och ger ingen ny upplysning — med ett undantag som är värt att notera: varje disulfidbrygga som bildas kostar två väten, så en exakt massa avslöjar <i>hur många</i> bryggor som finns. Men det visste du redan av att räkna cysteinerna. Det du saknar är vilka som sitter ihop med vilka, och det syns inte i massan alls.',
        'Ingen bakterie har tillverkat den — snäckan gör den själv, och den är genkodad på vanligt ribosomalt vis. Det är en viktig skillnad mot mikrobberättelserna i modulen: NRPS- och PKS-enzym bygger ämnen som inget gen direkt kodar för, medan den här peptiden läses rakt av från snäckans eget DNA och sedan knyts ihop.'],
      varfor: 'Sex cysteiner bildar tre disulfidbryggor, och sex cysteiner kan paras ihop på femton olika sätt — bara ett av dem är det rätta. Bryggorna knyter peptiden till en hård, kompakt knut, och det är knutens form som avgör vad den binder till. Därför tappade peptiden sin verkan när du reducerade den: sekvensen var kvar, men formen var borta. Det är en lärdom som skiljer peptider från små molekyler. För en liten molekyl <i>är</i> strukturen i praktiken svaret; för en peptid är sekvensen bara halva svaret, och hopvikningen den andra halvan. Det får två mycket konkreta följder. Vid strukturbestämningen måste man klyva peptiden med enzym till bitar <i>utan</i> att reducera bryggorna, och sedan se vilka bitar som fortfarande sitter ihop — då vet man vilken cystein som är knuten till vilken. Och vid tillverkningen räcker det inte att syntetisera rätt kedja: man måste få den att vika sig och oxidera till rätt knut av femton möjliga, och det steget är det svåraste i hela produktionen. Just den här knuten, med tre bryggor som låser varandra, kallas cystinknut och gör peptiden anmärkningsvärt tålig — den tål både värme och många enzym, vilket är ovanligt för en peptid.' },
    utveckling: { data: ['Peptiden blockerar en jonkanal som finns på nervändar i ryggmärgen, och lindrar smärta i djurmodell.', 'Peptider klyvs av tarmens enzymer, så tabletter är uteslutna.', 'Peptiden är stor och polär och passerar inte blod–hjärnbarriären från blodet.', 'Målet sitter i ryggmärgen, innanför barriären.'],
      fraga: 'Hur får du ämnet dit det ska verka?',
      val: ['Ger det med pump direkt i ryggmärgsvätskan, innanför barriären', 'Ger en mycket hög dos i blodet', 'Ger det som nässpray', 'Ger det som tablett tillsammans med enzymhämmare'], ratt: 0,
      varforFel: [null,
        'Barriären är inte en fråga om mängd utan om vad som släpps igenom. Att tiodubbla dosen i blodet ger tio gånger mer peptid på <i>fel</i> sida om barriären, och kanalen den blockerar finns också på nerver ute i kroppen och i hjärtat — du skulle få alla biverkningar och ingen smärtlindring. Just det här ämnet har dessutom ett smalt fönster mellan verksam och besvärande dos.',
        'Nässpray fungerar för små molekyler och för en del peptider som ska ut i blodet, men inte här. En peptid på 25 aminosyror tas upp dåligt genom nässlemhinnan, och den lilla del som kommer in hamnar i blodet — alltså återigen utanför barriären. Vägen förbi barriären via näshålan finns beskriven men är osäker och räcker inte för ett läkemedel som måste doseras exakt.',
        'Två skilda hinder, och enzymhämmaren tar bara det ena. Även en peptid som mirakulöst överlevde tarmen vore för stor och för polär för att passera tarmväggen, och sedan återstår ändå blod–hjärnbarriären. När tre hinder ligger på rad efter varandra lönar det sig inte att lösa ett.'],
      varfor: 'Två hinder, samma slutsats: peptider blir varken tabletter eller CNS-läkemedel via blodet. Når molekylen inte fram får man i stället placera den på rätt sida om barriären — här med en liten dosa under huden som via en tunn kateter ger ämnet <b>intratekalt</b>, direkt i ryggmärgsvätskan, några mikrogram om dygnet. Det är ett ingrepp som bara försvaras av att patienterna är de som ingenting annat hjälpt. Lägg märke till hur hela berättelsens kedja hänger ihop: att peptiden är polär och laddad styrde extraktionen, styrde valet av kolonn, och styr nu administrationssättet — det är samma egenskap varje gång. Själva läkemedlet tillverkas syntetiskt, aminosyra för aminosyra, och viks därefter ihop till rätt knut; man odlar inga snäckor. Och poängen med alltihop ligger i vad ämnet <i>inte</i> gör: det binder en kalciumkanal som bara sitter på de nervändar som förmedlar smärta, verkar alltså inte alls som morfin, och ger varken tolerans eller beroende. Priset är ett smalt dosfönster och biverkningar från centrala nervsystemet. Från en fiskätande snäcka på ett korallrev till ett godkänt läkemedel tog det tjugofem år.' }
  },
  slutsats: 'Du har just följt upptäckten av <b>zikonotid</b>, ur giftet från kägelsnäckan <i>Conus magus</i>.',
  sub: 'zikonotid'
},
{
  id: 'exenatid', titel: 'Ödlan som äter sällan', ar: 1992, plats: 'Ett veteransjukhus i Bronx, New York',
  ingress: 'Du är läkare och forskare, och du är intresserad av hormoner som styr insulinfrisättningen. Du har läst något som fastnat: vissa ormgifter orsakar svullnad och skador i bukspottkörteln. Alltså finns det ämnen i gifter som påverkar just det organ du studerar.',
  steg: {
    val: { data: ['Du går igenom gifter från en rad djur och letar efter ämnen som påverkar bukspottkörteln.', 'Gilaödlan är en stor, långsam ödla i Arizonaöknen med giftkörtlar i underkäken.', 'Den äter sällan — ibland bara några gånger per år — men då mycket på en gång.', 'I giftet hittar du ämnen som får bukspottkörtelceller att frisätta insulin.'],
      fraga: 'Varför är just den här observationen intressant för diabetesbehandling?',
      val: ['Den visar att giftet innehåller något som påverkar insulinfrisättningen — precis det man vill kunna styra', 'Den visar att ödlan inte kan få diabetes', 'Den visar att giftet är ofarligt för människa', 'Den visar att ödlans insulin liknar människans'], ratt: 0,
      varforFel: [null,
        'Vad ödlan själv kan drabbas av är ovidkommande, och observationen handlar inte om ödlans egen ämnesomsättning utan om vad dess gift gör i ett <i>annat</i> djur. Det är den riktningen som är intressant: giftet är gjort för att påverka någon annans kropp.',
        'Observationen pekar åt rakt motsatt håll — giftet orsakar skador på bukspottkörteln, alltså är det allt annat än ofarligt. Men giftighet i hög dos utesluter inte användbarhet i låg. Nästan varje läkemedel i den här modulen kommer från ett ämne som organismen gjorde för att skada någon.',
        'Ödlans eget insulin är inte inblandat här. Det som är intressant är ett ämne i <i>giftet</i>, alltså något ödlan sprutar in i ett annat djur. Att det senare visade sig likna ett mänskligt hormon är en av berättelsens poänger, men det var inte något observationen kunde avslöja.'],
      varfor: 'Letar man efter ett ämne som styr insulinfrisättning är ett gift som bevisligen påverkar bukspottkörteln en färdig ledtråd — någon har redan visat var man ska titta, man behöver bara ta det på allvar. Gifter är dessutom ovanligt tacksamma att leta i. De har finslipats av evolutionen för att träffa bestämda mål i kroppen, snabbt, i låg dos och utan att slösa energi på att påverka något annat. Det är precis de egenskaper man vill ha i ett läkemedel: selektivitet, potens och snabb effekt. Skillnaden mot ett jordprov är slående — där letar du bland tiotusentals isolat efter något som råkar göra något nyttigt, här vet du på förhand att varje ämne i provet gör något bestämt i ett nervsystem eller i ett organ. Det avgörande praktiska greppet i just det här fallet var dock mätmetoden: läkaren som gjorde arbetet hade tillgång till en teknik som kunde mäta mycket små mängder av en viss sorts peptid, och kunde därför leta efter <i>hormonlika</i> ämnen i giftet i stället för att bara mäta "effekt". Bioassayen bestämmer vad du kan hitta, en gång till.' },
    extraktion: { data: ['Giftet mjölkas ur ödlans körtlar och är redan en vattenlösning.', 'Det innehåller en blandning av peptider och enzymer.', 'Aktiviteten mäts som insulinfrisättning från odlade bukspottkörtelceller.'],
      fraga: 'Vad är rätt arbetssätt för ett peptidgift?',
      val: ['Hålla allt kallt och i vattenlösning, och låta separationen göra jobbet', 'Extrahera med etylacetat vid lågt pH', 'Torka in giftet och extrahera med hexan', 'Koka giftet för att fälla ut det oönskade'], ratt: 0,
      varforFel: [null,
        'Det är penicillinmetoden, och den bygger på att ämnet är en syra som kan göras oladdad. En peptid med 39 aminosyror har laddade sidokedjor åt båda hållen och blir aldrig oladdad som helhet — och lågt pH riskerar dessutom att veckla ut den. Du skulle lägga ned arbete på att flytta bort allt utom det du vill ha.',
        'Indunstning koncentrerar men renar inte, och hexan är ungefär det minst lämpliga lösningsmedel som finns för en peptid: det löser fett, din molekyl är allt annat än fett. Du skulle sitta med ett intorkat skikt där peptiden ligger kvar, möjligen förstörd av torkningen.',
        'Kokning fäller ut stora proteiner och används faktiskt ibland för att rensa bort dem när målmolekylen är ovanligt värmetålig. Men du vet inte om din är det, och du har mycket lite material — att chansa med värme på ett oersättligt prov är dålig hushållning. Gelfiltration gör samma jobb utan risk.'],
      varfor: 'Peptider stannar i vattenfasen, och värme och organiska lösningsmedel får dem att förlora sin form och därmed sin verkan. Det finns inget extraktionssteg att göra här — materialet är redan i lösning, färdigt att arbeta med. Det är det återkommande mönstret i hela djurspåret: där mikrobberättelserna börjar med en grumlig odlingsvätska som måste bearbetas hårt, börjar djurberättelserna med ett färdigt, koncentrerat prov som framför allt ska <i>skyddas</i>. Arbetet sker kallt, i buffert med rätt pH, gärna med hämmare mot de enzym som finns i själva giftet och som annars skulle bryta ner peptiderna i provröret. Och materialet är dyrbart: en gilaödla är inte en fermentor, så varje steg måste planeras i förväg i stället för att provas sig fram. Allt tyngdpunkt ligger alltså på separationen och på att mäta aktiviteten noggrant i varje fraktion.' },
    kromatografi: { data: ['Giftet innehåller både stora enzymer och små peptider.', 'Den aktiva substansen är en liten peptid.', 'Du behöver först grovsortera, och sedan finsortera bland de små peptiderna.'],
      fraga: 'Vilken ordning är rimlig?',
      val: ['Först gelfiltration för att skilja stort från smått, sedan omvänd fas för att skilja de små peptiderna åt', 'Först omvänd fas, sedan jonbyte, aldrig gelfiltration', 'Bara gelfiltration — storlek räcker för att få ett rent ämne', 'Bara normalfas på kiselgel'], ratt: 0,
      varforFel: [null,
        'Ordningen är ineffektiv och "aldrig" är fel. Startar du med en analytisk omvänd fas-kolonn lastar du på den allt det stora materialet som ändå ska bort — kolonnen överbelastas, topparna breddas och den slits i förtid. Gelfiltration är billig, skonsam och tar bort merparten av massan i ett enda steg. Man sparar den dyra, högupplösande metoden till sist, när provet är litet och nästan rent.',
        'Storlek räcker nästan aldrig. När de stora enzymerna är borta har du kvar ett tjugotal peptider som alla ligger inom samma storleksintervall, och gelfiltration kan inte skilja dem åt — de kommer ut i samma fraktion. Ett renhetskrav på ett läkemedel kräver dessutom att du kan visa att bara <i>ett</i> ämne finns kvar, och det klarar ingen enskild metod.',
        'Normalfas på kiselgel kräver organiska lösningsmedel och fungerar för fettlösliga ämnen. En peptid löser sig inte i dem, och dess laddade sidokedjor binder dessutom hårt till kiselgelens egna sura ytgrupper. Det är rätt metod i svamp- och bakteriespåret, fel metod här.'],
      varfor: 'Man går nästan alltid från grovt till fint, och skälet är praktiskt: varje separationsmetod har en kapacitetsgräns, och de metoder som ger bäst upplösning tål minst material. Gelfiltration tar snabbt och skonsamt bort allt som har fel storlek — här de stora enzymerna, som utgör största delen av giftet. Men de små peptiderna som blir kvar är ungefär lika stora och går inte att skilja åt på den axeln, så nästa steg måste separera längs en annan: omvänd fas, efter polaritet. Mellan varje steg mäter du aktiviteten på nytt, och det är den mätningen, inte kemin, som talar om vilken fraktion du ska gå vidare med. Tänk på hela reningen som att smalna av ett sökområde: varje metod får bort en sorts orenhet och kostar dig lite av det du vill ha. Därför väljer man så få steg som möjligt, i den ordning som kastar bort mest i början — och därför är en renad peptid ur ett djurgift ofta resultatet av tre, fyra steg, inte tjugo.' },
    struktur: { data: ['Peptiden är 39 aminosyror lång och byggd av helt vanliga L-aminosyror.', 'Du jämför sekvensen med kända mänskliga hormoner.', 'Ungefär hälften av positionerna är identiska med människans tarmhormon GLP-1, som också frisätter insulin.', 'Men i position 2 sitter glycin, där människans GLP-1 har alanin.', 'Människans GLP-1 bryts ner i blodet inom ett par minuter av enzymet DPP-4, som klyver just efter position 2.'],
      fraga: 'Vad betyder skillnaden i position 2?',
      val: ['DPP-4 känner inte igen glycin där, så ödlans peptid klyvs inte och verkar mycket längre', 'Peptiden binder en helt annan receptor än GLP-1', 'Peptiden blir fettlöslig och kan tas som tablett', 'Peptiden blir giftig för människa'], ratt: 0,
      varforFel: [null,
        'Tvärtom — och det är själva förutsättningen för att fyndet ska vara användbart. Hälften av positionerna är identiska med GLP-1, och peptiden binder samma receptor och ger samma svar: insulin frisätts när blodsockret är högt. Vore receptorn en annan hade likheten varit en kuriositet. Det är <i>samma</i> verkan plus en ändrad hållbarhet som gör den till ett läkemedel.',
        'En enda aminosyra av 39 ändrar inte molekylens karaktär i stort. Peptiden är fortfarande stor, polär och full av laddade sidokedjor, och den klyvs fortfarande av tarmens enzym. Skillnaden gäller en enda sak: ett bestämt enzym i blodet får inget grepp om just den positionen. Exenatid måste injiceras.',
        'Giftigheten hos ödlans bett kommer från andra ämnen i giftet. Den här peptiden gör i människa samma sak som vårt eget tarmhormon gör — den frisätter insulin när blodsockret är högt — bara under längre tid. Att den kommer från ett gift säger ingenting om vad just den molekylen gör.'],
      varfor: 'Att en peptid ur ett djurgift liknar ett mänskligt hormon är i sig anmärkningsvärt, men det användbara ligger i den <i>lilla skillnaden</i>. Vårt eget GLP-1 frisätts från tarmen när vi äter och får bukspottkörteln att utsöndra insulin — men bara när blodsockret är högt, vilket är en elegant inbyggd säkerhetsspärr. Problemet är hållbarheten: enzymet DPP-4 cirkulerar i blodet och klipper av de två första aminosyrorna, varpå hormonet är verkningslöst. Halveringstiden är ett par minuter, vilket gör GLP-1 obrukbart som läkemedel. Enzymet är dock kräset: det kräver alanin eller prolin i position 2. Ödlans peptid har <b>glycin</b> där, och då får enzymet inget grepp alls. Resultatet är samma verkan på samma receptor, men i timmar i stället för minuter. Lägg märke till vilken sorts upptäckt det här är — ingen kemi behövde göras. Evolutionen hade redan löst stabilitetsproblemet i en ödla, och arbetet bestod i att lägga märke till det. Varför en ödla som äter några gånger om året bär på en långverkande insulinfrisättare är inte helt klarlagt, men att kunna styra ämnesomsättningen i ett byte, eller sin egen, efter ett sällsynt stort mål är en rimlig gissning.' },
    utveckling: { data: ['Peptiden finns i mycket små mängder i ödlans saliv.', 'Den består av 39 vanliga aminosyror i en rak kedja.', 'Kemisk peptidsyntes klarar utan svårighet kedjor av den längden.', 'Som peptid måste den ändå injiceras — tarmens enzymer klyver den.'],
      fraga: 'Hur tillverkar du läkemedlet?',
      val: ['Syntetiserar peptiden kemiskt — en exakt kopia av ödlans', 'Odlar gilaödlor och mjölkar dem', 'Extraherar peptiden ur ödlor i stor skala', 'Ändrar molekylen kemiskt så att den kan tas som tablett'], ratt: 0,
      varforFel: [null,
        'Räkna på det: peptiden finns i mikrogrammängder i saliven hos en fridlyst ödla som äter några gånger om året och knappast låter sig mjölkas ofta. Läkemedlet ska räcka till hundratusentals patienter, varje dag, i åratal. Det är samma sorts återvändsgränd som att utvinna ett hormon ur slaktavfall — och till skillnad från insulinberättelsen finns här ingen industri med miljontals djur att hämta ur.',
        'Samma hinder, och ett till: att utvinna ur djur innebär alltid en risk för att något annat följer med — andra giftkomponenter, smittämnen, främmande proteiner som kan ge immunreaktion. När molekylen går att bygga ren från grunden finns ingen anledning att ta den risken.',
        'Det är ett riktigt och viktigt mål, men inte lösningen på frågan som ställs här, som gäller <i>tillverkningen</i>. Och en peptid på 39 aminosyror går inte att göra tablettvänlig med en enkel ändring: tarmens enzym klyver den och tarmväggen släpper inte igenom den. Att det över huvud taget blivit möjligt för senare GLP-1-läkemedel krävde en helt annan sorts lösning — se nedan.'],
      varfor: 'Att utvinna peptiden ur ödlor vore ogenomförbart: mängden är försvinnande liten. Men en rak kedja av 39 vanliga L-aminosyror utan en enda svavelbrygga går utmärkt att bygga kemiskt, en aminosyra i taget, på fast bärare i en automatisk syntesapparat. Läkemedlet är alltså en syntetisk kopia av en naturprodukt — identisk med ödlans, men tillverkad i en maskin. Jämför med zikonotid i samma spår: där är kedjan kortare, men tre svavelbryggor måste knytas rätt, och det gör tillverkningen betydligt svårare. En rak kedja är en gåva. Peptid förblir den, så injektion är enda vägen in, och de första preparaten gavs två gånger om dygnet. Det som hänt sedan dess hör till de mest lärorika fortsättningarna i hela modulen: genom att hänga på en fettsyra som får molekylen att binda till blodets albumin och därmed cirkulera i dagar har senare GLP-1-läkemedel kunnat ges <i>en gång i veckan</i>, och ett av dem finns numera till och med som tablett, tillsammans med ett hjälpämne som skyddar peptiden och öppnar magsäckens vägg på glänt — fast med så dåligt upptag att nästan allt går förlorat. Hela den läkemedelsgruppen, som i dag används av miljontals människor mot både diabetes och fetma, går tillbaka på en observation om vad ett ödlegift gjorde med en bukspottkörtel.' }
  },
  slutsats: 'Du har just följt upptäckten av <b>exenatid</b>, ur giftet från gilaödlan <i>Heloderma suspectum</i>.',
  sub: 'exenatid'
},
{
  id: 'lovastatin', titel: 'Mögel som stänger av kolesterolet', ar: 1973, plats: 'Ett läkemedelsföretag i Tokyo',
  ingress: 'Hjärtinfarkt är den vanligaste dödsorsaken i västvärlden, och högt kolesterol är en av de starkaste riskfaktorerna. Du har läst om Fleming och tänkt en tanke: om mögelsvampar kan tillverka ämnen som dödar bakterier, kanske de också tillverkar ämnen som stör andra organismers ämnesomsättning.',
  steg: {
    val: { data: ['Kolesterol byggs i kroppen i ett tjugotal steg. Det långsammaste och styrande steget katalyseras av enzymet HMG-CoA-reduktas.', 'Många svampar och jästsvampar behöver själva steroler för sina cellmembran.', 'Du resonerar att en mögelsvamp skulle kunna bilda ett ämne som blockerar sterolsyntesen hos konkurrenter.', 'Du bygger ett test där du mäter om ett extrakt hämmar det renade enzymet — inte om det dödar någon organism.'],
      fraga: 'Vad vinner du på att testa mot ett renat enzym i stället för mot levande celler?',
      val: ['Du ser direkt om ämnet träffar exakt det steg du är intresserad av', 'Testet blir billigare än att odla celler', 'Du slipper arbeta sterilt', 'Du kan testa fler ämnen samtidigt än med celler'], ratt: 0,
      varforFel: [null,
        'Det stämmer ofta i praktiken, och är ett verkligt skäl att använda enzymtester i stora program. Men billigt är inte det som gör testet <i>rätt</i> här. Ett billigt test som mäter fel sak är värdelöst hur många gånger du än kör det. Det avgörande är att svaret du får — "hämmas det här enzymet?" — är exakt den fråga du vill ha besvarad.',
        'Du slipper det mesta av sterilarbetet, och det är bekvämt. Men bekvämlighet styr inte valet av bioassay. Lägg dessutom märke till att du ändå måste odla svamparna sterilt för att få fram extrakten — det är bara avläsningen som blir enklare.',
        'Kapacitet är en fördel, men inte den avgörande, och den var inte särskilt stor på 1970-talet — testen kördes för hand, rör för rör. Det var tvärtom ett enormt arbete: omkring 6000 odlingar testades innan två av dem gav utslag. Poängen är att varje utslag betydde något bestämt.'],
      varfor: 'Ett test mot levande celler svarar bara "något hände" — och något händer av tusen olika skäl, varav de flesta bara betyder att extraktet är giftigt. Ett test mot ett <b>renat enzym</b> svarar på en mycket snävare fråga: hämmas just det här steget? Därmed kan du leta riktat efter en bestämd verkningsmekanism i stället för att hoppas på tur, och det är en stor sak — jämför med alla tidigare berättelser i modulen, där man letat efter "något som dödar bakterier" och sedan fått ta reda på hur det verkar i efterhand. Här är ordningen omvänd: mekanismen bestäms först, molekylen söks sedan. Priset är att du bara kan hitta det du redan tänkt på, och att ett ämne som hämmar ett enzym i provrör inte alls behöver fungera i en cell eller i en människa — det kan vara för polärt för att komma in, brytas ner, eller hämma tjugo andra enzym på köpet. Resonemanget som bar upp hela projektet var ekologiskt: svampar behöver själva steroler i sina cellmembran, alltså borde någon svamp ha kommit på att slå ut sterolsyntesen hos sina konkurrenter. Efter omkring 6000 odlingar fanns två aktiva — och den första av dem kom ur en <i>Penicillium</i>-art, samma släkte som gav penicillinet.' },
    extraktion: { data: ['Du odlar svampen och extraherar materialet.', 'Ämnet går över i organiskt lösningsmedel vid lågt pH, men stannar i vattnet vid högt.', 'Det beter sig alltså som en syra — men NMR visar ingen fri karboxylsyra.', 'I stället finns en sluten ring med en esterbindning: en <b>lakton</b>.'],
      fraga: 'Hur kan ett ämne utan fri syragrupp ändå bete sig som en syra vid högt pH?',
      val: ['Laktonringen öppnas i basisk lösning till en fri hydroxisyra', 'Mätningen måste vara fel', 'Esterbindningar är alltid sura', 'Ämnet binder hydroxidjoner och blir negativt laddat'], ratt: 0,
      varforFel: [null,
        'Det är alltid värt att misstänka, men här stämmer mätningarna med varandra: NMR visar laktonen i det prov du löst i neutralt eller surt, och beteendet i skiljetratten visar en syra vid högt pH. Motsägelsen är skenbar och löses av att molekylen helt enkelt <i>ändrar sig</i> med pH. När två goda mätningar säger emot varandra är det oftare din modell av molekylen som är för enkel än mätningarna som är fel.',
        'En ester är inte sur i sig — den saknar en proton att avge. Det som händer är något annat: esterbindningen <i>klyvs</i> av hydroxidjoner, och då bildas en karboxylsyra som inte fanns förut. Skillnaden mellan "är sur" och "blir sur genom att brytas" är central här, för den ena är en jämvikt du kan styra, den andra en kemisk förändring.',
        'Molekylen är neutral och har ingenting att binda en hydroxidjon med på det sättet. Hydroxidjonen är inte en passagerare utan en reaktant: den angriper esterbindningens karbonylkol och klyver ringen. Resultatet är en ny molekyl — en öppen hydroxisyra — inte den gamla med något hängande på sig.'],
      varfor: 'En lakton är en inre ester, och estrar hydrolyseras av bas. Höjer du pH öppnas ringen och du får en fri karboxylsyra, som är laddad och stannar i vattnet. Sänker du pH igen sluts ringen och ämnet går tillbaka till det organiska skiktet. Molekylen finns alltså i två former som du kan växla mellan med pH, och det är bra att veta rent praktiskt vid extraktionen. Men den verkliga poängen kommer långt senare och är värd att hålla fast vid genom hela berättelsen: det är den <b>öppna</b> formen som hämmar enzymet, eftersom det är den som liknar enzymets eget substrat. Den slutna laktonen är alltså en <i>prodrug</i> — ett läkemedel som i sig är overksamt och blir verksamt först när kroppen öppnar ringen, vilket sker i levern, som råkar vara precis det organ där enzymet sitter. Lovastatin och simvastatin ges som slutna laktoner; senare statiner som atorvastatin ges i stället direkt i den öppna formen. Lägg också märke till ett metodproblem det här skapar: ska du mäta aktiviteten måste du veta vilken form som finns i röret, och svaret beror på vilket pH du just arbetat vid.' },
    kromatografi: { data: ['Efter kromatografi har du ett extrakt som är aktivt och nästan rent.', 'Analys visar fortfarande spår av närbesläktade ämnen från odlingen.', 'Ämnet är fast i rumstemperatur och löser sig olika bra i olika lösningsmedel vid olika temperatur.'],
      fraga: 'Hur får du det sista steget från nästan rent till rent?',
      val: ['Kristalliserar ämnet ur ett lämpligt lösningsmedel', 'Kör ytterligare en gelfiltrering', 'Extraherar en gång till med etylacetat', 'Höjer temperaturen tills orenheterna bryts ner'], ratt: 0,
      varforFel: [null,
        'Gelfiltration skiljer på storlek, och orenheterna här är närbesläktade ämnen från samma odling — alltså molekyler av nästan exakt samma storlek, byggda av samma enzym med små variationer. De kommer ut i samma fraktion som ditt ämne. Metoden har inget att ta fasta på.',
        'Extraktion skiljer på fördelning mellan två faser, och närbesläktade ämnen från samma odling fördelar sig nästan likadant. Du skulle göra om ett steg som redan gjort sitt jobb, och förlora material varje gång. När kromatografi inte längre räcker är det sällan ett tidigare steg som löser resten.',
        'Att förstöra orenheterna med värme förutsätter att de är känsligare än ditt ämne, och det vet du inte — närbesläktade ämnen har ofta nästan samma stabilitet. Mest troligt bryter du ner en del av allt, inklusive produkten, och får en ny uppsättning nedbrytningsprodukter att rena bort. Värme är den sista utvägen, inte den första.'],
      varfor: 'Kristallisation är ofta det sista och mest effektiva reningssteget, och den fungerar på en princip ingen kromatografi har: molekylerna ordnar sig i ett gitter, och i det gittret finns bara plats för exakt rätt molekyl. Allt som avviker, även med en enda metylgrupp, passar inte in och blir kvar i moderluten. Därför kan kristallisation ta ett prov från 97 % till 99,9 % när en kolonn till bara skulle ge någon tiondels procent. Du får dessutom tre saker på köpet. Ett fast ämne som går att väga, lagra och transportera. En möjlighet att mäta smältpunkt, som förr var det vanligaste renhetsmåttet — en ren kristall smälter skarpt, en oren smälter över ett intervall. Och, om kristallerna blir tillräckligt välordnade, möjligheten till röntgenkristallografi, alltså hela strukturen. Priset är att en del av produkten alltid stannar kvar i moderluten, och att ämnen som vägrar kristallisera — oljor, de flesta peptider — inte kan renas så här alls.' },
    struktur: { data: ['Massan är 404. Molekylen innehåller inget kväve.', 'NMR visar två hopsmälta sexringar med flera metylgrupper, en kort esterkedja och den slutna laktonringen.', 'Kolkedjan är uppbyggd av enheter om två kol.', 'En del av molekylen liknar påfallande HMG-CoA, enzymets eget substrat.'],
      fraga: 'Hur har svampen byggt molekylen?',
      val: ['Som en polyketid: acetatenheter fogade ihop av ett PKS-enzym', 'Som en icke-ribosomal peptid', 'Som en terpen av isoprenenheter', 'Som en aminoglykosid'], ratt: 0,
      varforFel: [null,
        'En peptid kräver aminosyror, och varje aminosyra bär ett kväve. Din molekyl innehåller inget kväve alls. Det enda fyndet stryker alternativet utan vidare utredning — precis som i ivermektinberättelsen.',
        'Det är det mest förrädiska felsvaret här, och det är värt att stanna vid. Molekylen ska ju hämma kolesterolsyntesen, och kolesterol <i>är</i> en terpen, byggd av isoprenenheter om fem kol. Man förväntar sig därför något sterollikt. Men hämmaren behöver inte vara byggd som slutprodukten — den ska likna enzymets <i>substrat</i>, och det substratet (HMG-CoA) är ingen terpen. Svampen har dessutom bara sin polyketidmaskin att bygga med. Räkna kolen: enheter om två, inte fem.',
        'Aminoglykosider består av sockerringar med kvävegrupper — jämför streptomycin. Din molekyl har varken socker eller kväve, utan två hopsmälta kolringar med metylgrupper, vilket är ungefär motsatsen.'],
      varfor: 'Inget kväve utesluter alla peptider. Enheter om två kol är signaturen för ett <b>polyketidsyntas</b>; fem kol hade betytt terpen. Men det verkligt intressanta fyndet är det sista: en del av molekylen liknar påfallande HMG-CoA, alltså enzymets eget substrat. Det är ingen slump utan själva förklaringen till att ämnet verkar. Enzymet känner igen sitt substrat på formen, och en molekyl som efterliknar formen tillräckligt väl tar substratets plats i det aktiva sätet och blockerar det. Det kallas en substratanalog, och det är en av de vanligaste principerna bakom enzymhämmare över huvud taget — captopril i den här modulen bygger på samma tanke, fast byggd av kemister i stället för av en svamp. Två saker gör den här hämningen ovanligt effektiv. Den öppna hydroxisyran liknar inte bara substratet utan det instabila mellansteget i reaktionen, och binder därför ännu hårdare än substratet gör. Och enzymet står för det <i>hastighetsbestämmande</i> steget i en lång kedja: bromsar du det långsammaste steget bromsar du hela kedjan, medan ett ingrepp i ett snabbt steg hade kunnat kringgås. Att leta efter ämnen som hämmar just det steget var alltså ett medvetet val, inte en slump.' },
    utveckling: { data: ['Ämnet sänker kolesterolet kraftigt och tolereras väl.', 'Det går att odla fram i stor skala ur svampen.', 'Man vill ha ett ämne som är ännu mer potent, så att dosen kan sänkas.', 'Att byta ut en metylgrupp i esterkedjan visar sig fördubbla effekten.'],
      fraga: 'Hur får du fram det mer potenta ämnet?',
      val: ['Semisyntes: odla fram naturprodukten och ändra esterkedjan kemiskt', 'Helsyntes från grunden', 'Rekombinant tillverkning i jäst', 'Högre dos av naturprodukten'], ratt: 0,
      varforFel: [null,
        'Molekylen har två hopsmälta ringar, en laktonring och åtta stereocentrum som alla måste bli rätt. En totalsyntes är genomförbar — och har gjorts — men den har många steg och lågt utbyte, och skulle göra läkemedlet flera tiopotenser dyrare. Att bygga från grunden lönar sig bara när naturprodukten är svår att få tag i, och det är den inte: svampen gör den i fermentor.',
        'Rekombinant tillverkning passar för proteiner, som kodas av en enda gen. En polyketid byggs av ett helt kluster av stora enzym som måste samverka, och även om man i dag kan flytta sådana kluster mellan organismer är det ett forskningsprojekt i sig. Dessutom löser det inte problemet som ställs: du vill ha en molekyl som <i>inte</i> finns i naturen.',
        'Högre dos ger mer av samma sak, inklusive mer av de biverkningar som är dosberoende — muskelbesvären, som är statinernas mest kända problem, hänger ihop med dosen. Poängen med ett mer potent ämne är just att kunna ge mindre. Och till skillnad från resistensfallet i streptomycinberättelsen finns här ingen motståndare som anpassar sig; här är det kroppens tolerans som sätter taket.'],
      varfor: 'Det svåra — det ringsystem med alla stereocentrum som skulle kosta ett tjugotal syntessteg — låter man svampen göra i en fermentor. Den lilla förändringen gör man själv: esterkedjan sitter ytterst och är lätt att komma åt, så den klyvs av och ersätts med en något större. Det är samma avvägning som i ivermektinberättelsen, och det är semisyntesens hela idé: ändra bara det som behöver ändras, och bara där molekylen är lätt att arbeta med. Resultatet blev simvastatin, ungefär dubbelt så potent som utgångsämnet och under lång tid ett av världens mest sålda läkemedel. Skillnaden mellan de två molekylerna är en enda metylgrupp — det syns tydligt om du jämför strukturerna på faktakorten. Två eftertankar. Den första statinen som hittades kom aldrig till användning: utvecklingen stoppades efter oroande fynd i djurförsök, och det dröjde innan en annan svamp gav en nära släkting som tog sig hela vägen. Och statinernas historia är ett tydligt exempel på att ett läkemedel mot en kronisk sjukdom ställer helt andra krav än ett mot en infektion — ämnet ska tas varje dag i decennier av i övrigt friska människor, vilket gör även små biverkningar och små kostnadsskillnader till stora frågor.' }
  },
  slutsats: 'Du har just följt upptäckten av <b>statinerna</b> — här lovastatin ur <i>Aspergillus terreus</i>.',
  sub: 'lovastatin'
},
{
  id: 'sirolimus', titel: 'Jordprovet från Påskön', ar: 1972, plats: 'Ett laboratorium i Montreal',
  ingress: 'En expedition har varit på Påskön i Stilla havet för att dokumentera öns natur innan en ny flygplats byggs. Med hem kommer jordprover, och ur ett av dem odlas en trådformig jordbakterie fram.',
  steg: {
    val: { data: ['Isolatet testas i ett program som letar efter nya svampmedel.', 'Det hämmar candidasvamp kraftigt. Ett lyckat fynd.', 'Men i de tidiga djurförsöken visar det sig också dämpa immunförsvaret — i det sammanhanget en oönskad biverkan.', 'Programmet läggs ner av företagsekonomiska skäl och projektet avslutas. En av forskarna sparar ändå undan ett prov i frysen.'],
      fraga: 'Varför var just den oönskade effekten värd att komma ihåg?',
      val: ['En effekt som är fel i ett sammanhang kan vara själva poängen i ett annat', 'Immunhämning betyder alltid att ämnet är giftigt', 'Effekten visade att ämnet var orent', 'Det var den enda effekt som gick att mäta'], ratt: 0,
      varforFel: [null,
        'Immunhämning är en verkan, inte en giftverkan. Skillnaden är avgörande: ett giftigt ämne skadar celler urskillningslöst, medan det här ämnet griper in i en bestämd signalväg och stänger av en bestämd funktion. Att stänga av immunförsvaret är livsfarligt för den som har en infektion och livräddande för den som just fått ett nytt organ. Det är sammanhanget som avgör, inte molekylen.',
