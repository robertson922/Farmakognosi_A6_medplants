        'Orenhet är alltid värd att misstänka när ett extrakt gör flera saker, och man utesluter den genom att rena vidare och se om effekterna följs åt. Här gjorde de det: samma rena molekyl hämmade både svamp och immunförsvar. Det är inte ovanligt — en molekyl kan binda besläktade proteiner i helt olika organismer.',
        'Tvärtom: effekten var den <i>oplanerade</i>, den som ingen letade efter och som därför var obekväm. Programmets egentliga mätning gällde svamphämning, och den fungerade utmärkt. Immunhämningen upptäcktes som en bieffekt i djurförsök.'],
      varfor: 'Det här är ciklosporinets historia spegelvänd, och de två är värda att läsa bredvid varandra. Där räddades ett ämne som <i>föll igenom</i> sitt test av att någon testade det i något annat. Här avfärdades ett ämne som <i>klarade</i> sitt test, på grund av en bieffekt — och samma bieffekt blev senare hela dess användning. Lärdomen är densamma åt båda hållen: ett screeningresultat är inte ett omdöme om molekylen, bara ett svar på den fråga som ställdes. När svampmedelsprogrammet lades ner tog en av forskarna med sig prov hem och behöll dem i en frys i över tio år, tills immunhämmande ämnen plötsligt var intressanta igen — och jordprovet som allt började med hade samlats in av en expedition till Påskön innan ön fick flygplats. Att ämnet har med sig öns polynesiska namn, Rapa Nui, in i molekylnamnet är ovanligt: naturproduktsnamn brukar komma från organismen, inte från platsen.' },
    extraktion: { data: ['Du odlar bakterien i fermentor och extraherar odlingen med organiskt lösningsmedel. Aktiviteten följer med.', 'Ämnet påverkas inte av pH — det är oladdat.', 'Men lösningen tappar aktivitet när den står framme i ljus, och snabbare om den värms.', 'Även syre i luften tycks bryta ner ämnet.'],
      fraga: 'Hur arbetar du med ett fettlösligt men instabilt ämne?',
      val: ['Kallt, mörkt och med så lite syre som möjligt — och så fort som möjligt', 'Vid högt pH, som stabiliserar estrar', 'I vatten i stället för organiskt lösningsmedel', 'Genom att värma lösningen så att nedbrytningen går klart direkt'], ratt: 0,
      varforFel: [null,
        'Högt pH stabiliserar inte estrar — det gör precis tvärtom. Bas klyver esterbindningar, vilket du såg i statinberättelsen där laktonringen öppnades vid högt pH. Din molekyl har en stor laktonring som håller ihop hela strukturen, och att höja pH är ungefär det snabbaste sättet att förstöra den.',
        'Ämnet är fettlösligt och löser sig knappt i vatten, så du skulle inte ha något att arbeta med. Och vatten löser inte något av problemen: ljus, syre och värme verkar lika gärna i vattenlösning. Lösningsmedlet är inte orsaken till nedbrytningen.',
        'Det här är en sammanblandning värd att reda ut. Nedbrytningen "går inte klart" och lämnar något stabilt kvar — den fortsätter tills ingenting av din molekyl återstår. Att påskynda en nedbrytning man vill undvika är alltid fel väg. (Att medvetet bryta ner ett ämne för att studera nedbrytningsprodukterna är däremot ett riktigt försök, men det gör man på ett renat prov, inte på allt man har.)'],
      varfor: 'Instabilitet är ett av de vanligaste skälen till att naturproduktsprojekt misslyckas — det var precis det som sänkte Fleming i tolv år, och det avgör hur mycket arbete du har råd att lägga på molekylen. Lösningen är praktisk snarare än kemisk: arbeta kallt, skydda från ljus (gärna i brun glasflaska eller med folie), minimera kontakten med luftens syre, och låt så lite tid som möjligt gå mellan stegen. Tre dubbelbindningar i rad, som den här molekylen har, är särskilt utsatta — ett sådant system tar upp ljus och reagerar gärna med syre. Men den djupare lärdomen är strategisk: varje reningssteg kostar dig både utbyte och nedbrytning, så för ett instabilt ämne måste hela reningsgången planeras med <i>färre</i> steg än du egentligen skulle vilja ha. Man accepterar ett något orenare mellanprov hellre än ytterligare ett dygn i kolonnen. Instabiliteten följer dessutom med in i det färdiga läkemedlet: ett ämne som bryts ner av ljus och syre ställer krav på förpackning, hållbarhetstid och förvaring, och det är ett av skälen till att just den här molekylen fungerar så bra i en helt annan beredningsform — se sista steget.' },
    kromatografi: { data: ['Ämnet är stort, fettlösligt och oladdat.', 'Extraktet innehåller andra fettlösliga ämnen från odlingen.', 'Du behöver en metod som fungerar för ett oladdat ämne i organiskt lösningsmedel.'],
      fraga: 'Vilken separationstyp passar?',
      val: ['Normalfas på kiselgel, eluerad med allt polärare mobilfas', 'Katjonbytare, eluerad med salt', 'Gelfiltration i vattenbuffert', 'Anjonbytare, eluerad genom att höja pH'], ratt: 0,
      varforFel: [null,
        'En katjonbytare binder positivt laddade ämnen, och ditt ämne är oladdat — det visade pH-försöket i förra steget. Det skulle rinna rakt igenom utan att hejdas. Jonbyte är rätt metod för streptomycin och vankomycin i den här modulen, och fel här, av exakt den anledningen.',
        'Gelfiltration körs i vattenbuffert, och ett fettlösligt ämne löser sig knappt i vatten — det skulle fällas ut eller fastna ospecifikt på gelen. Metoden hör hemma i peptidberättelserna, där provet redan är en vattenlösning.',
        'Dubbelt fel. En anjonbytare binder negativt laddade ämnen, och ditt är oladdat. Dessutom är höjt pH här särskilt olämpligt: molekylen hålls ihop av en stor laktonring, och bas öppnar laktoner. Du skulle förstöra ämnet på kolonnen.'],
      varfor: 'Oladdat utesluter jonbyte — det finns ingen laddning att binda med. Gelfiltration i vattenbuffert passar illa för ett fettlösligt ämne. Kvar blir normalfas på kiselgel, där polära ämnen binder hårdast och opolära kommer ut först, och där man eluerar genom att göra mobilfasen stegvis polärare. Metoden valdes alltså inte för att den är bäst i någon allmän mening, utan för att de andra föll bort — och det är så valet nästan alltid går till: molekylens egenskaper stryker alternativ tills ett återstår. Här tillkommer dessutom instabiliteten som ett villkor. Kiselgel är svagt surt och kan bryta ner känsliga ämnen om de får stå länge på kolonnen, så körningen ska gå fort, kallt och helst skyddat från ljus. Det är en av anledningarna till att man för den här sortens ämnen gärna tar till en kolonn med pump — kortare tid på kolonnen betyder mindre nedbrytning. Som alltid testas varje fraktion i bioassayen innan du går vidare; det är aktiviteten, inte kemin, som vägleder.' },
    struktur: { data: ['Massan är över 900. Molekylen innehåller <b>en</b> kväveatom.', 'NMR visar en mycket stor ring sluten med en esterbindning, och en del av kedjan med tre dubbelbindningar i rad.', 'Större delen av kolskelettet är uppbyggt av enheter om två och tre kol, med metylgrupper med jämna mellanrum.', 'Men en del av ringen visar sig vara pipekolinsyra — en cyklisk aminosyra, besläktad med lysin.'],
      fraga: 'Hur kan molekylen vara både polyketid och innehålla en aminosyra?',
      val: ['Den är en hybrid: ett PKS-enzym bygger kedjan och ett NRPS-liknande steg fogar in aminosyran', 'Aminosyran har hamnat där av misstag under upparbetningen', 'Det måste vara två olika ämnen i provet', 'Kväveatomen kommer från lösningsmedlet'], ratt: 0,
      varforFel: [null,
        'Pipekolinsyran sitter <i>i</i> ringen, kovalent inbyggd i kolskelettet — den hänger inte löst med. Upparbetning kan förorena ett prov, men den kan inte foga in en byggsten mitt i en makrocyklisk struktur. NMR visar dessutom hur den sitter ihop med sina grannar.',
        'Rimlig misstanke, och precis det man ska pröva först: en NMR som visar två uppsättningar signaler betyder ofta två ämnen. Men här hänger signalerna ihop — de kopplar till varandra — och massan stämmer med en enda molekyl som innehåller allt. Dessutom kristalliserar provet som ett ämne och aktiviteten följer det genom varje reningssteg.',
        'Lösningsmedel bygger inte in sig i molekyler. Och pipekolinsyra är ingen slumpmässig kväveatom utan en bestämd, ringsluten aminosyra besläktad med lysin — något som bara kan komma från organismens eget biosyntetiska maskineri.'],
      varfor: 'Bakterier bygger inte alltid renodlat, och det är en viktig insikt för hela ämnet. Många av de mest komplicerade naturprodukterna är <b>hybrider</b>, där ett polyketidsyntas och ett peptidsyntetas sitter i samma produktionslinje: kedjan förlängs med acetat- och propionatenheter en stund, sedan fogas en aminosyra in av en NRPS-modul, sedan fortsätter polyketiddelen, och till sist sluts alltsammans till en ring. Enheterna om två och tre kol med regelbundna metylgrenar avslöjar PKS-delen; pipekolinsyran avslöjar NRPS-delen. Att bara se efter "är det peptid eller polyketid?" räcker alltså inte — ibland är svaret båda. Takrolimus i den här modulen är byggd på samma sätt, och de två molekylerna delar just den delen av strukturen: pipekolinsyran med sin intilliggande del är det som binder till samma bärarprotein i cellen. Där slutar likheten. Takrolimus-komplexet blockerar kalcineurin, precis som ciklosporin gör på sitt sätt, medan sirolimus-komplexet i stället binder ett helt annat protein, som sedan fick sitt namn efter molekylen: mTOR, cellens centrala tillväxtreglerare. Två nästan likadana halvor, två helt olika verkningsmekanismer — ett av de tydligaste exemplen på att det är formen i detalj, inte den stora likheten, som avgör vad en molekyl gör.' },
    utveckling: { data: ['Ämnet förhindrar avstötning efter transplantation och hämmar dessutom celldelning i kärlväggar.', 'Det tas upp dåligt och ojämnt från tarmen.', 'Ett problem i sjukvården är att kranskärl som vidgats med ballong ofta växer igen på nytt inifrån.', 'Ämnet går att binda till ytan på ett litet metallnät som placeras i kärlet.'],
      fraga: 'Vilken väg vidare utnyttjar ämnets egenskaper bäst vid det problemet?',
      val: ['Att ändra beredningen: klä en stent med ämnet så att det frisätts lokalt i kärlet', 'Att ge en mycket högre dos i tablettform', 'Att bygga en helt syntetisk kopia', 'Att tillverka ämnet rekombinant'], ratt: 0,
      varforFel: [null,
        'Dosökning löser inte ett ojämnt upptag — den gör variationen större i absoluta tal, vilket är precis fel när marginalen mellan verksam och skadlig dos är liten. Och den löser inte problemet som ställts: att ge ett immunhämmande ämne i hög dos till hela kroppen, för att skydda några centimeter kärlvägg, innebär att patienten blir infektionskänslig för att slippa en förträngning. Nyttan står inte i proportion till priset.',
        'Molekylen är en stor hybridring med ett stort antal stereocentrum, och en totalsyntes vore ett mästarprov utan industriell framtid. Men framför allt: den löser inget av problemen. En syntetisk kopia är samma molekyl, med samma dåliga upptag och samma instabilitet. Syntes är svaret när du vill ha en <i>annan</i> molekyl, inte en likadan.',
        'Rekombinant tillverkning gäller proteiner, som en enda gen kodar för. Det här är en polyketid–peptid-hybrid byggd av ett helt kluster av stora enzym. Och återigen: det är ett svar på frågan "hur tillverkar man ämnet?", medan frågan här är "hur får man ämnet att verka på rätt ställe?".'],
      varfor: 'Ibland är lösningen varken en ny molekyl eller en kemisk modifiering, utan ett nytt sätt att få ämnet dit det ska. Lägg märke till hur väl molekylens egenskaper passar just den lösningen. Den är <b>fettlöslig</b>, alltså stannar den kvar i kärlväggens celler i stället för att sköljas bort av blodet. Den är <b>potent</b>, alltså räcker några mikrogram. Den hämmar <b>celldelning</b>, vilket är exakt vad som gör att kärlet växer igen. Och att den tas upp dåligt från tarmen spelar ingen roll längre, eftersom den inte ska passera någon tarm. En egenskap som var ett problem i en beredningsform är betydelselös i en annan. Genom att klä ett litet metallnät — en stent — med ämnet får man hög koncentration exakt där kärlet riskerar att växa igen och nästan ingen effekt i resten av kroppen. Det är lokal behandling i ordets mest bokstavliga mening, och det förändrade hur kranskärlssjukdom behandlas. Samma molekyl används också som tablett efter njurtransplantation, och har dessutom blivit ett av de mest studerade ämnena inom åldrandeforskningen, eftersom det protein den hämmar visat sig styra sambandet mellan näringstillgång och livslängd i allt från jäst till möss. Från ett jordprov på en avlägsen ö i Stilla havet, via ett nedlagt projekt och tio år i en frys.' }
  },
  slutsats: 'Du har just följt upptäckten av <b>sirolimus (rapamycin)</b> ur <i>Streptomyces hygroscopicus</i>.',
  sub: 'sirolimus'
},
{
  id: 'amfotericinB', titel: 'Svampen som dödar patienterna', ar: 1955, plats: 'Ett laboratorium i New Jersey',
  ingress: 'På sjukhusen dör patienter med nedsatt immunförsvar av svampinfektioner i blod och inre organ. Mot bakterier finns nu penicillin och streptomycin. Mot invasiv svampinfektion finns ingenting alls.',
  steg: {
    val: { data: ['Svampceller liknar våra egna celler mycket mer än bakterieceller gör: båda är eukaryota, med cellkärna och liknande maskineri.', 'Det mesta som dödar en svampcell dödar därför också en mänsklig cell.', 'Du söker en skillnad att utnyttja. Svampars cellmembran innehåller <b>ergosterol</b>; våra innehåller kolesterol.', 'Ni screenar jordbakterier mot jästsvamp, och ett isolat från ett jordprov från Orinocofloden i Venezuela ger kraftig effekt.'],
      fraga: 'Varför är svampmedel svårare att hitta än antibakteriella medel?',
      val: ['Svampceller liknar våra egna, så det finns färre skillnader att rikta sig mot', 'Svampar växer för långsamt för att testas', 'Svampar bildar inga egna sekundärmetaboliter', 'Svampinfektioner är för ovanliga för att forska på'], ratt: 0,
      varforFel: [null,
        'Jästsvampar som <i>Candida</i> växer snabbt och lätt på vanliga medier — betydligt snabbare än tuberkulosbakterien i streptomycinberättelsen, där det ändå gick att driva ett screeningprogram. Odlingshastigheten är alltså inget egentligt hinder. Det som är svårt ligger inte i att testa, utan i vad man kan hoppas hitta.',
        'Svampar är tvärtom bland de rikaste källorna till sekundärmetaboliter som finns — penicillin, ciklosporin, statinerna och mykofenolsyra i den här modulen kommer alla från svamp. Men frågan gäller något annat: att hitta ämnen som <i>dödar</i> svamp utan att skada oss.',
        'Svåra svampinfektioner var länge ovanliga, och det är sant att det påverkade intresset. Men de har blivit allt vanligare just därför att sjukvården blivit bättre: människor som lever med cancerbehandling, transplanterade organ eller svårt nedsatt immunförsvar drabbas, och för dem är infektionerna ofta livshotande. Svårigheten att hitta medel är biologisk, inte en fråga om efterfrågan.'],
      varfor: 'Hela principen för selektiv toxicitet är att hitta en <b>skillnad</b> mellan angriparen och värden, och sedan rikta sig mot just den. Mot bakterier finns gott om skillnader att välja bland: de har en cellvägg som vi saknar helt (penicillin), en annan sorts ribosom (streptomycin, tetracyklin, erytromycin) och ett annat RNA-polymeras (rifampicin). Varje sådan skillnad är en möjlig angreppspunkt, och det är därför antibakteriella medel finns i tiotal. Svampar är däremot eukaryoter precis som vi. De har cellkärna, mitokondrier, samma sorts ribosomer och i stort sett samma ämnesomsättning. Det som dödar en svampcell dödar därför ofta en mänsklig cell också. Den tydligaste skillnaden som återstår är sterolen i cellmembranet: svampar använder <b>ergosterol</b> där vi använder kolesterol. Och den skillnaden är liten — de två molekylerna skiljer sig på ett par dubbelbindningar och en metylgrupp. Att bygga ett läkemedel på en så knapp skillnad ger med nödvändighet ett smalt fönster mellan verksam och skadlig dos, och det är hela förklaringen till biverkningarna som dyker upp i sista steget. Lägg märke till att problemet är biologiskt och inte går att arbeta bort: det sitter i släktskapet.' },
    extraktion: { data: ['Du försöker extrahera odlingen med etylacetat. Nästan ingenting följer med.', 'Du provar vatten. Inte heller det löser ämnet.', 'Du provar att ändra pH åt båda hållen. Molekylen visar sig vara <b>amfotär</b>: den har både en sur och en basisk grupp.', 'Till sist får du ämnet i lösning i metanol och i dimetylsulfoxid.'],
      fraga: 'Vad säger det om molekylen att den varken löser sig i vatten eller i etylacetat?',
      val: ['Den har både en kraftigt opolär och en kraftigt polär del, och passar därför ingenstans riktigt', 'Den är en mycket stor jon', 'Den är inte en enda molekyl utan ett salt', 'Den måste ha brutits ner under odlingen'], ratt: 0,
      varforFel: [null,
        'En stor jon skulle lösa sig utmärkt i vatten — det är just vad laddning gör, den omger sig med vattenmolekyler. Jämför vankomycin och streptomycin i modulen: båda är stora och laddade, och båda vägrar lämna vattenfasen. Din molekyl löser sig inte ens i vatten, vilket pekar åt motsatt håll.',
        'Ett salt skulle vara lättlösligt i vatten, inte svårlösligt. Och amfotär betyder inte salt: det betyder att en och samma molekyl bär både en sur och en basisk grupp. Den kan alltså ha både en positiv och en negativ laddning samtidigt, inom sig själv, utan att vara ett salt av två olika joner.',
        'Nedbrytning skulle ha visat sig som förlorad aktivitet, och aktiviteten finns kvar — i det du till slut får löst i metanol. Att ett ämne är svårlösligt är dessutom en egenskap hos molekylen, inte ett tecken på att något gått sönder. Här är svårlösligheten ett fynd, inte ett misslyckande.'],
      varfor: 'Normalt gäller <i>lika löser lika</i>: ett ämne är antingen tillräckligt opolärt för organiska lösningsmedel eller tillräckligt polärt för vatten, och de flesta molekyler placerar sig någonstans på den skalan. Den här molekylen är <b>båda delarna på en gång</b>, men inte blandat — utan uppdelat på var sin sida. På ena sidan en lång, styv, helt opolär kolkedja; på den andra en rad hydroxylgrupper. Ett vattenmolekylskikt kan ordna sig kring den polära sidan men inte kring den opolära, och ett organiskt lösningsmedel precis tvärtom, så ingen av dem klarar hela molekylen. Därför trivs den varken i vatten eller i etylacetat, och därför heter den <b>amfo</b>-tericin: amfotär, åt båda hållen. Den dubbelnaturen är inte en olycklig egenhet utan själva poängen med molekylen, och det är värt att hålla fast vid resten av berättelsen. En molekyl med en fettlöslig och en vattenlöslig sida gör exakt vad tvål gör och vad membranens egna lipider gör: den ställer sig i gränsskiktet. Flera sådana molekyler kan tillsammans borra sig in i ett cellmembran med fettsidan ut mot membranets svansar och OH-sidan inåt, så att det bildas en kanal rakt igenom. Samma egenskap som gör ämnet besvärligt i labbet gör det verksamt i kroppen — och, som sista steget visar, besvärligt att ge till patienter.' },
    kromatografi: { data: ['Ämnet löser sig knappt i vatten och knappt i etylacetat — bara i metanol och i dimetylsulfoxid.', 'Det är amfotärt: det bär både en sur och en basisk grupp.', 'Det bryts ner av ljus och syre.', 'Året är 1955.'],
      fraga: 'Vad är det största praktiska hindret när du ska rena ämnet?',
      val: ['Att det knappt löser sig i något — det begränsar både vilka system du kan köra och hur mycket du kan ha på kolonnen',
            'Att molekylen är för stor för alla kolonntyper',
            'Att molekylen saknar laddning och därför inte fastnar någonstans',
            'Att ämnet är färglöst och omöjligt att följa genom kolonnen'], ratt: 0,
      varforFel: [null,
        'Storleken är inget hinder: 924 g/mol är stort för en liten molekyl men långt under vad en kolonn klarar. Vankomycin är ännu större och renas utan problem.',
        'Tvärtom — molekylen är amfotär och <i>har</i> både sur och basisk grupp. Problemet är inte brist på laddning utan att den varken trivs i vatten eller i organiskt lösningsmedel.',
        'Ämnet är faktiskt starkt gulfärgat, och UV-spektrumet är dessutom mycket karakteristiskt. Att följa det genom kolonnen är det minsta problemet.'],
      varfor: 'Löslighet är en förutsättning för all kromatografi: ämnet måste vara löst i mobilfasen för att röra sig genom kolonnen. Ett ämne som bara går att lösa i metanol eller DMSO låser dig till ett fåtal system, och du kan bara arbeta med små mängder åt gången. I praktiken renades ämnet därför mycket med fällning och fraktionerad utfällning snarare än kolonner. <b>Lägg märke till</b> att det är samma egenskap som senare tvingar fram liposomberedningen: en molekyl som inte vill lösa sig någonstans är svår att hantera både i labbet och i en infusionspåse.' },
    struktur: { data: ['Massan är 924. Molekylen innehåller en kväveatom.', 'NMR bekräftar sju konjugerade dubbelbindningar i rad på ena sidan av molekylen.', 'På motsatta sidan sitter en lång rad hydroxylgrupper.', 'Hela kedjan är sluten till en stor ring med en esterbindning, och ett aminosocker hänger på.', 'Kolkedjan är byggd av enheter om två kol.'],
      fraga: 'Vad är det för ämnesklass?',
      val: ['En polyenmakrolid: en polyketid sluten till en stor lakton, med ett konjugerat polyensystem', 'En icke-ribosomal peptid', 'En aminoglykosid', 'En terpen'], ratt: 0,
      varforFel: [null,
        'En peptid med 924 i massa skulle ge åtta eller nio aminosyror vid hydrolys och innehålla lika många kväveatomer. Din molekyl har <i>en enda</i> kväveatom, och den sitter i aminosockret som hänger på ringen. En enda kväveatom utesluter varje form av peptid.',
        'Aminosockret finns där, och det är lätt att fastna för. Men en aminoglykosid består helt och hållet av sockerringar kopplade till varandra — jämför streptomycin, som är tre sådana ringar och ingenting annat. Här är sockret en enda enhet som hänger på en stor kolring. Det är kärnan som bestämmer klassen.',
        'Terpener byggs av isoprenenheter om fem kol. Din kolkedja är byggd av enheter om två kol, vilket är acetatens signatur, och det är just den skillnaden man letar efter när man ska skilja de två biosyntesvägarna åt. Ironiskt nog är molekylens <i>måltavla</i> — ergosterol — däremot en terpen.'],
      varfor: 'Tre fynd, tre delar av namnet. Enheter om två kol ger <b>polyketid</b>; en stor ring sluten med en esterbindning ger <b>makrolid</b>; de sju konjugerade dubbelbindningarna ger <b>polyen</b>. Alltså en polyenmakrolid, och namnet beskriver molekylen exakt. Men det viktiga är vad geometrin medför. Sju dubbelbindningar i rad kan inte vrida sig: konjugeringen låser den delen av ringen i ett plant, styvt, helt opolärt band. På motsatta sidan av ringen sitter hydroxylgrupperna. Molekylen är därför inte bara "delvis polär" utan har sina två naturer prydligt åtskilda i rummet, som en planka målad vit på ena sidan. Åtta sådana plankor kan ställas i en ring inuti ett cellmembran med fettsidan utåt mot membranets fettsvansar och OH-sidan inåt — och då har man ett rör fodrat med hydroxylgrupper, alltså en vattenkanal rakt genom membranet. Kalium läcker ut och cellen dör. Den här sortens por bildas bara där molekylen kan packa sig rätt, och det går bäst i ett membran som innehåller ergosterol — det är hela grunden för den selektivitet som finns. Lägg märke till att mekanismen följer direkt ur formen: har du en gång förstått varför ämnet inte ville lösa sig i vare sig vatten eller etylacetat, så vet du också varför det dödar svampceller.' },
    utveckling: { data: ['Ämnet botar livshotande svampinfektioner — det finns inget alternativ.', 'Men det skadar njurarna, och infusionen ger frossa, feber och illamående. Smeknamnet på kliniken blir ”amphoterrible”.', 'Selektiviteten går inte att förbättra kemiskt: skillnaden mellan ergosterol och kolesterol är liten, och molekylen behöver sin form för att fungera alls.', 'Ämnet går däremot att kapsla in i små fettblåsor, liposomer.'],
      fraga: 'Hur minskar du biverkningarna när molekylen inte går att förbättra?',
      val: ['Ändrar beredningen: kapsla in ämnet i liposomer så att mindre når patientens egna celler', 'Ger en högre dos mer sällan', 'Ger ämnet som tablett i stället', 'Kombinerar med kolesterol för att skydda kroppens celler'], ratt: 0,
      varforFel: [null,
        'Att ge samma mängd i färre och större doser ändrar ingenting i grunden — biverkningarna hänger ihop med hur hög koncentrationen blir, och höga toppar är precis det som ger frossa, feber och njurpåverkan. Glesare dosering med högre toppar gör alltså problemet värre, inte bättre. Här vill man tvärtom ha en jämn, låg koncentration under lång tid.',
        'Molekylen löser sig knappt i något, är stor och amfotär — den tas inte upp från tarmen alls. Det är faktiskt så den används vid svampinfektion i munnen och tarmen: som lösning som verkar lokalt och inte tas upp. Men patienten i den här berättelsen har en svampinfektion i blodet och de inre organen, och dit når ingenting från tarmen.',
        'Tanken är logisk — mätta kroppens egna bindningsställen så att läkemedlet lämnar dem i fred. I praktiken fungerar den inte: kolesterolet i patientens cellmembran sitter där det sitter och går inte att "mätta bort" med tillfört kolesterol, och det du tillför hamnar inte där det behövs. Men notera att den riktiga lösningen är släkt med tanken: liposomerna innehåller just lipider som binder molekylen tills den når sitt mål.'],
      varfor: 'När molekylen inte kan göras mer selektiv kan man i stället styra <b>var</b> den hamnar. Det är en av de viktigaste insikterna i hela modulen, för den gäller långt bortom det här fallet. Inkapslad i små fettblåsor — liposomer — hålls ämnet kvar i blodbanan, frisätts långsamt och i låg koncentration, och tas i högre grad upp där svampceller finns än av njurens celler. Resultatet är betydligt skonsammare: samma molekyl, ny förpackning. Lägg märke till att det är molekylens egna egenskaper som gör beredningen möjlig — att den är amfotär och binder gärna till lipider är precis det som får den att sitta kvar i liposomens membran i stället för att läcka ut. Egenskapen som gjorde den omöjlig att extrahera, omöjlig att kromatografera och giftig att ge, är alltså också det som gör att den går att förpacka. Priset är kostnaden: en liposomberedning är flera gånger dyrare än den ursprungliga. Och molekylen har en annan ovanlig förtjänst som förtjänar att nämnas: trots sjuttio år av användning har resistens mot den förblivit sällsynt, eftersom en svamp inte kan göra sig av med sin ergosterol utan att samtidigt förstöra sitt eget membran. Att angripa något som angriparen inte kan vara utan är det säkraste skydd mot resistens man kan få.' }
  },
  slutsats: 'Du har just följt upptäckten av <b>amfotericin B</b> ur <i>Streptomyces nodosus</i>.',
  sub: 'amfotericinB'
},
{
  id: 'doxorubicin', titel: 'Den röda odlingen', ar: 1963, plats: 'Ett läkemedelsföretag i Milano',
  ingress: 'Ni letar efter ämnen som dödar cancerceller, och ni odlar fram jordbakterier ur prover från hela Italien — bland annat från jorden kring ett medeltida slott i Apulien. Ett av isolaten färgar hela odlingen klarröd.',
  steg: {
    val: { data: ['Isolatet färgar odlingsvätskan intensivt röd.', 'Extraktet dödar odlade cancerceller i låg koncentration.', 'Det dödar också friska celler, men vid högre koncentration.', 'Den röda färgen följer med aktiviteten genom de första reningsstegen.'],
      fraga: 'Vilken praktisk fördel ger den röda färgen i det fortsatta arbetet?',
      val: ['Du kan följa ämnet med ögat genom varje reningssteg', 'Färgen visar att ämnet är ofarligt', 'Färgade ämnen är alltid lättare att kristallisera', 'Färgen gör att ämnet kan mätas utan UV-detektor'], ratt: 0,
      varforFel: [null,
        'Färg säger ingenting om giftighet åt något håll. Här är det tvärtom redan känt att ämnet dödar även friska celler, bara vid något högre koncentration — och den färgade delen av molekylen, kinonsystemet, visar sig senare vara direkt inblandad i den allvarligaste biverkningen. Om något är färgen en varning snarare än ett lugnande besked.',
        'Det finns inget sådant samband. Kristallisation beror på molekylens form och på hur väl den packar sig i ett gitter, inte på om den absorberar synligt ljus. Många färgade ämnen är oljor som vägrar kristallisera.',
        'Det är nästan rätt och ändå fel på ett sätt som är värt att reda ut. Att se med ögat är inte en mätning — du ser <i>var</i> ämnet är, inte <i>hur mycket</i>. För att mäta mängd behöver du fortfarande en spektrofotometer, och att ämnet är färgat betyder bara att du kan använda synligt ljus i stället för UV. Den stora vinsten är att du kan följa ämnet i kolonnen, inte att du slipper instrument.'],
      varfor: 'Ett färgat ämne är en gåva vid rening, och särskilt 1963. Du ser bandet vandra nedför kolonnen och vet precis när det kommer ut, vilka fraktioner som ska samlas och om bandet börjat dela sig i två — alltsammans utan att vänta de dygn som bioassayen tar. Varje sådan iakttagelse sparar en arbetsvecka. Det ersätter inte testningen: färgen kan komma från besläktade men inaktiva ämnen, och i det här fallet finns flera röda släktingar i samma odling, så ett vackert rött band kan mycket väl vara fel molekyl. Men färgen talar om <i>var</i> man ska leta. Lägg också märke till den andra observationen, som är en varning: extraktet dödar både cancerceller och friska celler, bara vid olika koncentration. Det är en avgörande skillnad mot antibiotikaberättelserna. Där kunde man utnyttja att bakterier är i grunden annorlunda än vi; en cancercell är en av kroppens egna celler, med samma maskineri som alla andra. Det enda man kan utnyttja är att den delar sig oftare — och det gör även benmärg, tarmslemhinna och hårsäckar. Det smala fönstret mellan verkan och skada är därför inbyggt i problemet från första dagen, precis som med svampmedlet i den här modulen.' },
    extraktion: { data: ['Ämnet sitter kvar i vattenfasen när du skakar med etylacetat vid neutralt pH.', 'Molekylen bär ett aminosocker med en aminogrupp.', 'Du höjer pH till omkring 8–9 och skakar igen.', 'Nu följer ämnet med det organiska skiktet.'],
      fraga: 'Varför fungerar pH-knepet här, när det inte fungerade för streptomycin?',
      val: ['En vanlig aminogrupp blir oladdad redan vid pH 8–9, till skillnad från en guanidingrupp', 'Doxorubicin är en syra och streptomycin en bas', 'Aminosockret gör molekylen fettlöslig oavsett pH', 'Den röda färgen gör molekylen opolär'], ratt: 0,
      varforFel: [null,
        'Båda är baser. Doxorubicin bär en aminogrupp på sitt socker, streptomycin bär guanidingrupper — alltså samma sorts funktion, bara olika starka. Vore doxorubicin en syra skulle du ha <i>sänkt</i> pH för att få över den, inte höjt. Att höjningen fungerade visar direkt att du har en bas framför dig.',
        'Om det vore sant skulle ämnet ha följt med etylacetatet redan vid neutralt pH, och det gjorde det inte. Aminosockret drar snarare åt motsatt håll: det är den polära, laddningsbara delen av molekylen. Det är först när dess aminogrupp blir oladdad som resten av molekylen — de fyra platta ringarna — kan göra sig gällande.',
        'Färg beror på att molekylen har ett konjugerat system som absorberar synligt ljus, och det har ingenting med polaritet att göra. Vattenlösliga färgämnen finns i mängd. Färgen är ett praktiskt hjälpmedel i den här berättelsen, inte en förklaring till något kemiskt beteende.'],
      varfor: 'Båda är baser, men <b>styrkan</b> avgör, och det är hela poängen med att ställa de två berättelserna bredvid varandra. En vanlig alifatisk amin har ett pKa runt 8–9. Höjer du pH till omkring 9 är ungefär hälften av molekylerna oladdade, och de oladdade följer med det organiska skiktet — skakar du flera gånger får du över praktiskt taget allt, eftersom jämvikten hela tiden fyller på. En guanidingrupp har däremot ett pKa omkring 12–13 och förblir protonerad i allt vatten du rimligen kan arbeta i. Samma knep, helt olika utfall, och skillnaden står att läsa direkt i strukturen om man vet vad man ska titta efter. Det är värt att dra ut den allmänna slutsatsen: frågan "är ämnet surt eller basiskt?" räcker inte, man måste veta <i>hur</i> surt eller basiskt. pKa är det tal som talar om vid vilket pH molekylen byter skepnad, och nästan allt arbete med extraktion av syror och baser handlar om att placera sitt arbets-pH ett par enheter på rätt sida om det. Här finns dessutom en gräns uppåt: ämnet har ett kinonsystem och ett socker, och starkt basiskt vatten bryter ner båda — så du håller dig vid pH 8–9 och går inte högre än du måste.' },
    kromatografi: { data: ['Odlingen innehåller flera närbesläktade röda ämnen som skiljer sig på enstaka grupper.', 'De har nästan samma storlek och nästan samma laddning.', 'Året är 1963. HPLC finns inte ännu; du har kiselgel, aluminiumoxid och lösningsmedel.', 'Ämnena är klarröda, så du ser banden vandra nedför kolonnen med blotta ögat.'],
      fraga: 'Hur skiljer du åt ämnen som liknar varandra så mycket, med 1963 års utrustning?',
      val: ['Upprepad kolonnkromatografi där du följer de färgade banden, och kristallisation som sista steg',
            'Omvänd fas i ett HPLC-system',
            'Gelfiltration',
            'Jonbyte med saltgradient'], ratt: 0,
      varforFel: [null,
        'HPLC med C18-kolonner kom på 1970-talet. I dag skiljer en sådan kolonn de här ämnena åt på några minuter — men 1963 fanns varken kolonnmaterialet eller pumparna.',
        'Gelfiltration skiljer på storlek, och ämnena är i praktiken lika stora: de skiljer sig på en enda hydroxylgrupp, alltså 16 av 543 i molekylvikt. Kolonnen skulle inte märka skillnaden.',
        'Jonbyte skiljer på laddning. Alla de röda ämnena bär samma aminosocker med samma aminogrupp, så de har samma laddning och binder lika hårt. Ingen separation.'],
      varfor: 'Med 1963 års utrustning återstår tålamod: kolonn efter kolonn på kiselgel eller aluminiumoxid, med den stora fördelen att ämnena är färgade — du <i>ser</i> banden skilja sig åt, ser när två band börjar glida isär och kan samla rätt fraktion utan att vänta på bioassayen. Varje körning flyttar dig en liten bit, och en molekyl som skiljer sig från sin granne på en enda hydroxylgrupp kan kräva att samma kolonn körs om och om igen, med lite olika lösningsmedelsblandning varje gång, tills banden till slut separerar. Sista steget är kristallisation, som tar bort det lilla som finns kvar — och som här fungerar särskilt bra, eftersom en ensam hydroxylgrupp i övrigt likadana molekyler ändå räcker för att den ena ska passa in i kristallgittret och den andra inte. Det är så man renade på den tiden: få metoder, mycket tålamod och ett skarpt öga. <b>I dag</b> hade en enda körning på omvänd fas gjort hela jobbet på en timme, och en masspektrometer hade talat om vilken topp som var vilken.' },
    struktur: { data: ['Massan är 543. Molekylen innehåller en kväveatom, i aminosockret.', 'NMR visar fyra hopsmälta, platta ringar.', 'Två av ringarna bildar ett kinonsystem — det är det som ger den röda färgen.', 'Kolskelettet är byggt av enheter om två kol, veckade och slutna till de aromatiska ringarna.', 'Ett besläktat ämne ur samma odling är identiskt så när som på <b>en</b> hydroxylgrupp.'],
      fraga: 'Hur har bakterien byggt det platta fyrringade skelettet?',
      val: ['Som en aromatisk polyketid: en PKS-typ II har byggt en lång kedja som veckats och slutits till ringar', 'Som en icke-ribosomal peptid', 'Som en terpen', 'Som en aminoglykosid'], ratt: 0,
      varforFel: [null,
        'En peptid på 543 i massa skulle innehålla fem eller sex aminosyror och lika många kväveatomer. Din molekyl har <i>en</i> kväveatom, och den sitter i aminosockret. En enda kväveatom utesluter alla peptidalternativ — samma resonemang som i amfotericinfallet.',
        'Terpener byggs av femkolsenheter, din kedja av tvåkolsenheter. Platta aromatiska ringsystem är dessutom ovanliga bland terpener men typiska för aromatiska polyketider, eftersom en polyketidkedja har syre på varannan kolatom och just det mönstret gör att kedjan lätt sluter sig till aromatiska ringar.',
        'Aminosockret finns, men det hänger på — hela resten av molekylen är ett fyrringat kolskelett. En aminoglykosid består enbart av sockerringar. Jämför streptomycin: tre sockerringar och inget annat.'],
      varfor: 'Enheter om två kol betyder polyketid. Att de bildar platta, aromatiska ringar i stället för en stor lakton är signaturen för polyketidsyntas av <b>typ II</b>: flera små, fristående enzym samarbetar om att bygga en lång kedja med en ketogrupp på varannan kol, och den kedjan viker sedan ihop sig och sluter sig själv till ringsystem. Jämför med makroliderna — erytromycin, amfotericin B, rifamycin — där ett jättelikt typ I-enzym med moduler på rad bygger en kedja som till sist sluts till en enda stor ring. Två olika sorters maskin, två helt olika sorters molekyl, och båda känns igen direkt på resultatet: platta aromatiska ringar mot stor flexibel lakton. Just plattheten är dessutom hela verkningsmekanismen här. Ett plant fyrringat system har exakt rätt form för att skjutas in mellan två baspar i DNA-spiralen — det kallas interkalering — och där stör det det enzym som ska klippa och foga ihop DNA under celldelningen. Och kinonsystemet, det som ger färgen, är inte bara dekoration: det kan ta upp och avge elektroner, vilket skapar reaktiva syreradikaler. Det bidrar till effekten mot cancercellerna, men är också en huvudmisstänkt bakom den hjärtskada som sätter gränsen för hur mycket en patient kan få i livet.' },
    utveckling: { data: ['Ämnet som skiljer sig på en hydroxylgrupp visar sig ha bredare effekt mot fler cancerformer.', 'Du vill få odlingen att producera just det ämnet i stället.', 'Bakteriestammen går att behandla med mutagen och sedan välja ut de varianter som producerar mest.', 'Molekylen är för komplicerad för att byggas syntetiskt i industriell skala.'],
      fraga: 'Hur får du fram det bättre ämnet i mängd?',
      val: ['Muterar produktionsstammen och väljer ut de varianter som bildar rätt ämne i störst mängd', 'Bygger ämnet helsyntetiskt', 'Tillverkar det rekombinant i jäst', 'Kapslar in det ursprungliga ämnet i liposomer'], ratt: 0,
      varforFel: [null,
        'Fyra sammansmälta ringar med flera stereocentrum och ett aminosocker som ska kopplas på med rätt konfiguration — en totalsyntes är möjlig men har många steg och lågt utbyte, och är omöjlig att försvara ekonomiskt när en bakterie kan göra samma sak i en tank. Observera också att skillnaden mellan de två ämnena är en enda hydroxylgrupp på en svåråtkomlig position, alltså inte något man enkelt lägger till i efterhand på den färdiga naturprodukten.',
        'Rekombinant tillverkning passar proteiner, som en enda gen kodar för. En aromatisk polyketid byggs av ett helt kluster av samverkande enzym plus efterbearbetande enzym som hydroxylerar och hänger på sockret. Att flytta hela det maskineriet till jäst är ett forskningsprojekt i sig — och onödigt, eftersom producenten redan finns och fungerar.',
        'Liposomer kom senare och löste ett annat problem: den dosberoende hjärtskadan. De ökar inte produktionen av rätt ämne, vilket är frågan här. Det är värt att hålla isär de två sorters lösningar som modulen tar upp — <i>tillverkningsproblem</i> löses i fermentorn, <i>fördelningsproblem i kroppen</i> löses i beredningen.'],
      varfor: 'Stamförbättring är ett eget hantverk inom farmakognosin och det mest underskattade steget i hela kedjan. Man utsätter producenten för något som ökar mutationsfrekvensen — UV-ljus eller en kemisk mutagen — odlar sedan tusentals avkommor var för sig och mäter vad var och en producerar. De bästa får gå vidare och behandlas igen, generation efter generation. Det är konstgjort urval, i princip detsamma som när man förädlar vete, och det kräver varken att man förstår biosyntesen eller att man kan ändra en enda gen avsiktligt. Metoden höjde penicillinutbytet flera tusen gånger under 1940-talet, och här gav den en variant av bakterien som bildade det ämne som skiljer sig med en hydroxylgrupp — doxorubicin — i stället för föregångaren daunorubicin. Att en så liten strukturskillnad ger bredare effekt mot fler cancerformer är ett av de tydligaste exemplen i modulen på hur lite som krävs. Fortsättningen följde två spår som båda är värda att känna till: hjärtskadan är kumulativ, så man håller reda på hur mycket en patient fått under hela sitt liv, och den kan minskas dels med ett skyddande läkemedel som ges samtidigt, dels genom att kapsla in molekylen i liposomer — samma grepp som för amfotericin B, av samma skäl: när molekylen inte kan förbättras får man styra var den hamnar.' }
  },
  slutsats: 'Du har just följt upptäckten av <b>doxorubicin</b> ur <i>Streptomyces peucetius</i>.',
  sub: 'doxorubicin'
},
{
  id: 'insulin', titel: 'Barnen på avdelningen', ar: 1921, plats: 'Ett universitetslaboratorium i Toronto',
  ingress: 'På barnavdelningen ligger barn med diabetes i koma. Sjukdomen är obotlig och dödar inom månader. Den enda behandlingen är svält, som skjuter upp slutet något. Du vet att bukspottkörteln är inblandad — tar man bort den på en hund får hunden diabetes.',
  steg: {
    val: { data: ['Flera forskare har redan försökt ge extrakt av bukspottkörtel till diabetiker. Nästan alla försök har misslyckats.', 'Bukspottkörteln har två uppgifter: den bildar matsmältningsenzymer som utsöndras till tarmen, och den innehåller små öar av hormonbildande celler.', 'Matsmältningsenzymerna klyver proteiner.', 'Det hormon du letar efter tros vara just ett protein.'],
      fraga: 'Varför har tidigare försök att ge körtelextrakt misslyckats?',
      val: ['Körtelns egna matsmältningsenzymer bryter ner hormonet under beredningen', 'Hormonet finns bara hos friska djur', 'Hormonet bildas först efter en måltid', 'Extraktet var för utspätt'], ratt: 0,
      varforFel: [null,
        'Hormonet hämtas från slaktade friska djur, så det finns gott om det i råvaran. Och om det bara funnes hos friska individer skulle fyndet ändå ha dugt — det är just vad man vill ge till den sjuke. Problemet uppstår efter slakten, i hanteringen, inte i djuret.',
        'Hormonet frisätts mycket riktigt när blodsockret stiger efter en måltid, men det finns lagrat i körtelns celler hela tiden, redo att släppas ut. Att slakta djuret just efter en måltid skulle möjligen ge marginellt mer — men det räddar ingenting om allt bryts ner i mortelskålen i nästa steg.',
        'Utspädning var ett verkligt praktiskt bekymmer, och extrakten behövde koncentreras. Men det förklarar inte varför försöken slog så helt fel: en utspädd lösning ger en svag men mätbar effekt, inte ingen effekt alls. Och här fanns dessutom ett värre problem: de orena extrakten orsakade svåra reaktioner och bölder, så att ge mer av samma var ingen väg framåt.'],
      varfor: 'Det här är hela nyckeln, och den är värd att dröja vid. Du maler ner en körtel som är full av proteinklyvande enzymer — det är den körtelns andra, större uppgift — tillsammans med ett hormon som själv är ett protein. Enzymerna gör precis det de är byggda för. Tidigare försök misslyckades alltså inte för att hormonet inte fanns, inte för att teorin var fel och inte för att försökspersonerna var fel valda, utan för att det man letade efter förstördes i det allra första arbetsmomentet. Det här är den sortens insikt som är värd mer än ett nytt försök: att förstå <i>varför</i> något har misslyckats talar om vad som måste ändras. Och det pekar direkt mot lösningen i nästa steg — antingen måste enzymerna stängas av, eller så måste hormonet hämtas från en körtel där de redan är borta. Den ursprungliga idén i Toronto var faktiskt den senare: att binda av körtelns utförsgång på en hund så att den enzymbildande delen vissnade bort, medan de hormonbildande öarna blev kvar. Det fungerade, men gav försvinnande lite material. Det var insikten om <i>principen</i> — skilj hormonet från enzymerna — som ledde vidare, inte den första tekniska lösningen.' },
    extraktion: { data: ['Du behöver få ut hormonet utan att enzymerna hinner bryta ner det.', 'Enzymer är proteiner och förlorar sin funktion i surt och i alkohol.', 'Det hormon du letar efter visar sig tåla det bättre.', 'Alkohol fäller dessutom ut många andra proteiner, som kan filtreras bort.'],
      fraga: 'Hur extraherar du hormonet ur körteln?',
      val: ['Maler körteln i sur alkohol, som slår ut enzymerna och fäller ut andra proteiner', 'Maler körteln i varmt vatten', 'Extraherar med hexan', 'Maler körteln i basisk lösning'], ratt: 0,
      varforFel: [null,
        'Varmt vatten är det sämsta tänkbara. Enzymer arbetar snabbast vid kroppstemperatur, så du skulle ge dem idealiska förhållanden att bryta ner ditt hormon i, och värmen skadar dessutom hormonet självt. Hela arbetet måste tvärtom ske kallt — i Toronto användes is i varje steg.',
        'Hexan löser fett. Ditt hormon är ett protein med laddade sidokedjor och löser sig inte alls i hexan; det skulle stanna kvar i körtelmassan medan du drog ut fettet. Hexanextraktion är däremot ett utmärkt <i>förbehandlingssteg</i> för att få bort fett ur vävnad innan man extraherar det man vill ha med något annat.',
        'Basisk lösning inaktiverar mycket riktigt en del enzym, men den skadar också hormonet — proteiner tål i allmänhet basiskt sämre än surt — och flera av körtelns proteaser arbetar bäst i just basiskt, eftersom det är den miljö de ska verka i nere i tarmen. Du skulle alltså sätta igång dem i stället för att stänga av dem.'],
      varfor: 'Sur alkohol gör två saker samtidigt, och det är därför den är så elegant. Den <b>inaktiverar</b> de proteinklyvande enzymerna innan de hinner förstöra hormonet — både surheten och alkoholen får dem att veckla ut sig och sluta fungera. Och den <b>fäller ut</b> en stor del av körtelns övriga proteiner, som kan filtreras bort, medan det lilla hormonet stannar kvar i lösningen. Ett extraktionssteg och ett reningssteg i samma handgrepp, och det var den avgörande tekniska förbättringen i hela projektet, gjord av biokemisten James Collip. Lägg märke till vad den bygger på: en skillnad i tålighet. Hormonet är ovanligt litet för ett protein och hålls ihop av svavelbryggor, vilket gör det mer motståndskraftigt mot sur alkohol än de stora, veka enzymerna. Man utnyttjar alltså inte en skillnad i löslighet, som i mikrobberättelserna, utan en skillnad i stabilitet — och det är ett genomgående drag i allt arbete med proteiner. Skillnaden mellan Collips preparat och de tidigare var inte liten: de första patienterna hade fått orena extrakt som gav bölder och feber utan att sänka blodsockret nämnvärt, och några veckor senare kunde samma pojke behandlas med gott resultat.' },
    kromatografi: { data: ['Kromatografi som vi känner den finns ännu inte 1921.', 'Proteiner har en laddning som varierar med pH.', 'Vid ett bestämt pH — den isoelektriska punkten — är proteinets nettoladdning noll.', 'Utan nettoladdning stöter proteinmolekylerna inte längre bort varandra.'],
      fraga: 'Hur renar du ett protein utan kolonn?',
      val: ['Justerar pH till proteinets isoelektriska punkt, så att det fälls ut och kan samlas upp', 'Kokar lösningen tills orenheterna avdunstar', 'Fryser lösningen och skrapar av isen', 'Skakar lösningen med etylacetat'], ratt: 0,
      varforFel: [null,
        'Orenheterna här är andra proteiner och salter, och de avdunstar inte — bara vattnet gör det. Du skulle koncentrera allt tillsammans, och på vägen förstöra hormonet med värmen. Indunstning är ett koncentreringssteg, aldrig ett reningssteg.',
        'Frysning koncentrerar faktiskt en lösning, eftersom det är rent vatten som fryser först, och principen används i liten skala. Men den skiljer inte ditt protein från andra proteiner — allt löst material blir kvar tillsammans i den ofrusna resten. Du får en starkare lösning av samma blandning.',
        'Proteiner följer aldrig med etylacetat; de är polära, laddade och stannar i vattenfasen, och organiska lösningsmedel får dem dessutom att förlora sin form. Det är samma slutsats som i ormgifts- och snäckberättelserna i den här modulen: fas-fördelning är inte proteinkemins verktyg.'],
      varfor: 'Ett protein hålls löst i vatten av två saker: att dess yta har polära grupper som vattnet kan ordna sig kring, och att alla molekylerna bär <i>samma</i> nettoladdning och därför stöter bort varandra. Ställer du pH vid den <b>isoelektriska punkten</b> — det pH där de positiva och negativa laddningarna tar ut varandra — försvinner avstötningen, molekylerna får klumpa ihop sig, och proteinet faller ut som ett fint grumligt fällning som går att centrifugera eller filtrera av. Och eftersom varje protein har sin egen isoelektriska punkt, som beror på vilka aminosyror det består av, stannar de andra proteinerna i lösningen. Du har alltså separerat efter en helt egen axel, utan kolonn, utan lösningsmedel och utan utrustning som inte fanns 1921. Metoden är inte en nödlösning från en annan tid: isoelektrisk fällning är fortfarande ett standardsteg tidigt i proteinrening, just för att den är billig, skonsam och klarar stora volymer. Och den hade en fortsättning som är värd att nämna — när hormonet senare visade sig gå att kristallisera, med hjälp av zink, fick man både ett renare preparat och ett sätt att göra det långverkande, eftersom kristallerna löser sig långsamt under huden.' },
    struktur: { data: ['Hormonet är ett protein, men ett ovanligt litet: 51 aminosyror.', 'Det består av <b>två</b> kedjor, en med 21 och en med 30 aminosyror.', 'Kedjorna hålls ihop av svavelbryggor mellan cysteiner.', 'Metoden att klyva av en aminosyra i taget från änden och identifiera den utvecklas under 1940- och 50-talen.'],
      fraga: 'Varför var just det här proteinet det första någon lyckades sekvensera?',
      val: ['Det är litet, går att få rent i stor mängd och var redan medicinskt viktigt', 'Det saknar svavelbryggor och är därför enkelt', 'Det består bara av tre olika aminosyror', 'Det kristalliserar inte och är därför lättare att analysera'], ratt: 0,
      varforFel: [null,
        'Tvärtom — det <i>har</i> svavelbryggor, och de var den svåraste delen av arbetet. Tre bryggor, varav två håller ihop de två kedjorna och en sitter inuti den kortare. De måste kartläggas för sig, med samma slags resonemang som för snäckans peptid i den här modulen: klyv utan att reducera, och se vilka bitar som fortfarande sitter ihop.',
        'Hormonet innehåller de flesta av de vanliga aminosyrorna. Att tro att ett protein skulle bestå av några få, upprepade byggstenar var dock en utbredd föreställning vid den tiden — många tänkte sig proteiner som regelbundna, nästan polymerlika strukturer. Det var just den föreställningen arbetet kom att vederlägga.',
        'Det kristalliserar mycket väl, i närvaro av zink, och det var en av anledningarna till att det gick att få så rent. Kristallisation är dessutom ett hjälpmedel vid analys, inte ett hinder — det är så man visar att man har ett enda rent ämne.'],
      varfor: 'Frederick Sanger valde insulin av praktiska skäl, och det är en lärdom i sig om hur vetenskap faktiskt går till. Det var litet för att vara ett protein — 51 aminosyror där de flesta har hundratals — och det gick att köpa rent, i grammängder, från vilken läkemedelsfirma som helst, just därför att det redan tillverkades som läkemedel. Läkemedelsproduktionen gjorde alltså grundforskningen möjlig, inte tvärtom. Arbetet tog tio år och gick ut på att klyva proteinet med olika enzym och syror till korta bitar, bestämma varje bits ände, och sedan pussla ihop den enda ordning som förklarar alla överlappande bitar — ungefär som att återställa en text ur flera olika sönderrivna kopior. Resultatet var mer omvälvande än bara en sekvens: det visade för första gången att ett protein har en <b>bestämd, exakt och alltid likadan</b> aminosyraordning, inte en ungefärlig sammansättning. Det var en förutsättning för hela tanken att en gen kodar för ett protein, och därmed för den molekylärbiologi som i sista steget av den här berättelsen gör det möjligt att låta en bakterie tillverka hormonet. Sanger fick Nobelpriset 1958 — och senare ett till, för att ha löst motsvarande problem för DNA.' },
    utveckling: { data: ['Hormonet utvinns ur bukspottkörtlar från slaktade grisar och nötkreatur. Det krävs omkring två ton körtlar för ett kilo.', 'Antalet diabetiker ökar snabbt, och tillgången är beroende av slakterierna.', 'Djurens hormon skiljer sig från människans på någon enstaka aminosyra, vilket kan ge antikroppar hos patienten.', 'I slutet av 1970-talet blir det möjligt att föra in en mänsklig gen i en bakterie och låta den tillverka proteinet.'],
      fraga: 'Hur löser du både tillgången och skillnaden mot människans hormon?',
      val: ['Rekombinant tillverkning: för in den mänskliga genen i bakterier eller jäst', 'Semisyntes från grishormonet', 'Helsyntes av proteinet i fabrik', 'Odla fler grisar'], ratt: 0,
      varforFel: [null,
        'Det gjordes faktiskt — grisinsulin skiljer sig från människans på en enda aminosyra i änden av den längre kedjan, och den gick att byta ut kemiskt. Metoden användes under en tid och löste skillnadsproblemet. Men den löser inte tillgångsproblemet: du behöver fortfarande två ton körtlar per kilo, och du har lagt till ett dyrt kemiskt steg ovanpå det.',
        'En kedja på 51 aminosyror går att bygga kemiskt, men till ett helt orimligt pris för ett läkemedel som miljontals människor behöver varje dag. Och svårigheten slutar inte där: de två kedjorna måste dessutom fogas ihop med svavelbryggorna i exakt rätt mönster, och gör man det på måfå blir utbytet försvinnande litet. Jämför exenatid i modulen — en enkel rak kedja, och därför en helt annan sak att syntetisera.',
        'Räkna på det: två ton bukspottkörtlar för ett kilo hormon betyder tiotusentals djur per ton råvara, och antalet diabetiker ökade snabbt. Tillgången var dessutom bunden till köttkonsumtionen — ett läkemedel som miljontals människor är beroende av kunde alltså inte styras av hur mycket kött som såldes. Och hur många grisar man än föder upp kvarstår skillnaden mot människans egen molekyl.'],
      varfor: 'Ett protein på 51 aminosyror går inte att syntetisera billigt, och djurkällan sätter både ett tak för mängden och en kvarstående skillnad mot människans egen molekyl, som hos en del patienter ger antikroppar. <b>Rekombinant tillverkning</b> löser båda problemen på en gång och är möjlig av ett skäl som är värt att hålla fast vid: ett protein är det enda som en gen direkt kodar för. Ingen av de andra molekylerna i den här modulen — ingen polyketid, ingen icke-ribosomal peptid, ingen aminoglykosid — kan tillverkas genom att flytta en enda gen, eftersom de byggs av långa rader samverkande enzym. En peptid eller ett protein är en gen. För in den mänskliga sekvensen i en bakterie eller en jästcell, och cellen gör exakt den molekyl människan själv gör, i obegränsad mängd, utan ett enda djur inblandat. Humaninsulin blev 1982 det <b>första rekombinanta läkemedlet</b> över huvud taget och öppnade vägen för alla proteinläkemedel som kommit sedan dess — tillväxthormon, koagulationsfaktorer, antikroppar, vacciner. Och sedan gick man vidare förbi naturens egen molekyl: genom att ändra någon enstaka aminosyra i sekvensen har man gjort varianter som tas upp snabbare eller långsammare från injektionsstället, så att en diabetiker i dag kan kombinera ett snabbverkande och ett långverkande insulin. Berättelsen börjar alltså i en sönderriven naturprodukt och slutar i molekyler som inte finns i något djur.' }
  },
  slutsats: 'Du har just följt upptäckten av <b>insulin</b>, ur bukspottkörtel från <i>Sus scrofa</i> och <i>Bos taurus</i>.',
  sub: 'insulin'
}

/* =====================================================================
   BERÄTTELSEN  –  what actually happens, told in the second person, stage by stage.
   This is the main text a student reads: the discovery itself, concretely, before any
   theory. Keep it plain and visual — what you see on the bench, what you try, what
   surprises you. Never name the drug or the species; that is the ending.
   ===================================================================== */
const BERATTELSER = {
  penG: {
    val: `<p>Du är Alexander Fleming. Efter sommaren kommer du tillbaka till ditt laboratorium på St Mary's Hospital i London. På bänken står en trave petriskålar där du odlat stafylokocker — gulaktiga kolonier som täcker hela agarytan.</p>
      <p>En av skålarna ser annorlunda ut. Mitt på den växer en luddig, blågrön mögelfläck. Den har hamnat där av misstag; sporer finns överallt i luften.</p>
      <p>Men det är inte mögelfläcken du fastnar för. Det är agarn <b>runt</b> den. Där växer inga bakterier alls. På resten av skålen ligger de tätt, ända fram till en bred, tom ring runt möglet.</p>
      <p>Du tittar närmare. Ringen är flera millimeter bred — betydligt bredare än själva mögelfläcken. Svampen kan alltså inte ha ätit upp bakterierna där den står. Något måste ha läckt ut ur den och spridit sig genom agarn.</p>`,
    extraktion: `<p>Du odlar mögelsvampen i flytande näringslösning i stället för på en platta — i allt från kolvar till mjölkflaskor och, så småningom, bäcken från sjukhusets avdelningar. Efter en vecka är vätskan gulaktig och luktar mögel.</p>
      <p>Du filtrerar bort svampmassan och droppar den klara vätskan på en ny platta med stafylokocker. Dagen efter finns en tydlig hämningszon. Ämnet finns alltså <b>löst i vätskan</b>, inte kvar i svampen — det utsöndras, precis som zonen i agarn antydde.</p>
      <p>Det är goda nyheter och dåliga nyheter på samma gång. Goda, för du slipper bråka med cellmassa. Dåliga, för koncentrationen är bedrövlig: vätskan är till nittionio komma någonting procent vatten, näringssalter, socker och allt annat svampen gjort sig av med. Ditt ämne är en droppe i en soppa, och det finns i milligram per liter.</p>
      <p>Du provar det självklara först: koka in vätskan så att det blir mindre volym att arbeta med. Aktiviteten försvinner. Du provar att torka in den. Aktiviteten försvinner igen.</p>
      <p>Två saker börjar klarna. Ämnet beter sig som en <b>syra</b> — det låter sig fällas ut och lösas igen beroende på surhet. Och det är <b>ömtåligt</b> på ett sätt som gör allt svårare: värme bryter ner det, och står lösningen sur för länge är verkan borta.</p>
      <p>Det här är inte ett sidoproblem. Det är <i>hela</i> problemet. Allt du gör härifrån måste ske kallt, snabbt, och med pH under kontroll.</p>`,
    kromatografi: `<p>Det är 1940, och du är inte längre Fleming. Du är Howard Florey och Ernst Chain i Oxford, och ni har tagit upp ett spår som legat obearbetat i tolv år.</p>
      <p>Utrustningen är det den är. Kiselgelkolonner är ovanliga, jonbytarresiner alldeles nya, och HPLC existerar inte ens som idé — den ligger trettio år fram i tiden. Vad ni har är skiljetrattar, lösningsmedel, is och förmågan att mäta pH.</p>
      <p>Men ni har två upplysningar som är värda mer än utrustning. Ämnet är en <b>syra</b>. Och en syra byter skepnad med pH: i surt är den oladdad och därmed fettlöslig, i basiskt laddad och därmed vattenlöslig.</p>
      <p>Det betyder att ni kan <i>flytta</i> ämnet. Surgör odlingsvätskan, skaka med ett organiskt lösningsmedel, och ämnet följer med upp. Orenheter som inte beter sig likadant blir kvar i vattnet. Höj sedan pH på det organiska skiktet och skaka mot rent vatten — ämnet går tillbaka, nu renare än förut.</p>
      <p>Varje växling kostar lite i utbyte och tar bort mycket skräp. Och varje steg är en kapplöpning: för länge i surt och ämnet är förstört.</p>
      <p>Mellan varje steg gör ni det enda som räknas — sätter en droppe på en platta med stafylokocker och väntar till nästa dag. Hämningszon betyder att ni är kvar på rätt spår. Ingen zon betyder att något gått förlorat på vägen.</p>`,
    struktur: `<p>Till sist har ni några milligram av ett gulvitt pulver, framställt genom frystorkning — den enda torkning ämnet tål.</p>
      <p>Massan visar att molekylen är liten: 334. Det är i sig förvånande. Något så litet som slår ut bakterier så effektivt antyder att det inte är ett grovt cellgift utan något som griper in i en bestämd process.</p>
      <p>Bryter ni isär molekylen får ni tre aminosyror: cystein, valin och α-aminoadipinsyra. Den sista förekommer inte ens i proteiner.</p>
      <p>Men de sitter inte som pärlor på ett snöre, som i en vanlig peptid. De är hopvikta och slutna till ringar — och en av ringarna är problemet.</p>
      <p>Den innehåller bara <b>fyra</b> atomer. Fyrledade ringar med en amidbindning i är så spända att flera av tidens främsta kemister helt enkelt inte tror att den kan finnas. Robert Robinson, Nobelpristagare och en av Storbritanniens ledande organiska kemister, är övertygad om att strukturen måste vara något annat.</p>
      <p>Striden pågår i flera år. Spänningen i den ringen visar sig sedan vara hela poängen: det är just därför molekylen är så reaktiv mot bakteriens enzym — och just därför den förstörs av magsyra.</p>
      <p>Frågan måste avgöras av en metod som inte lämnar utrymme för tolkning.</p>`,
    utveckling: `<p>Det är februari 1941, och ni har just behandlat er första patient: en polis med en infektion som spridit sig från en liten skråma i ansiktet.</p>
      <p>Han börjar tillfriskna inom ett dygn. Febern sjunker, varbildningen avtar. Det fungerar.</p>
      <p>Sedan tar medlet slut. Ni återvinner till och med ämnet ur hans urin och ger tillbaka det, men mängden räcker inte. Infektionen kommer tillbaka och han dör.</p>
      <p>Problemet är inte längre kemi. Det är <b>mängd</b>. Svampen utsöndrar försvinnande lite, och en enda patient förbrukar vad hela laboratoriet producerar på flera dagar.</p>
      <p>Tre vägar står öppna, och ni måste välja rätt.</p>
      <p>Att <b>bygga molekylen syntetiskt</b> vore elegant — men den har en fyrledad ring som ingen vet hur man gör, och flera stereocentrum. Kemisterna försöker i åratal och misslyckas.</p>
      <p>Att <b>odla mer</b> betyder att hitta bättre svampstammar och bättre odlingsbetingelser: ett industriellt problem snarare än ett kemiskt, och ett som faktiskt går att lösa.</p>
      <p>Och så det som inte går att lösa alls: ämnet <b>förstörs av magsyra</b>. Sväljer patienten det händer ingenting. Vilken väg ni än väljer måste det ges med spruta.</p>`
  },
  vankomycin: {
    val: `<p>Du arbetar på ett läkemedelsföretag i Indiana i början av 1950-talet. Penicillinet håller på att sluta fungera.</p>
      <p>Allt fler stafylokocker bildar ett enzym som klyver penicillinmolekylen, och patienter dör av infektioner som för några år sedan var enkla att behandla. Ni behöver något helt nytt.</p>
      <p>Den här gången finns ingen lycklig observation att utgå från. I stället gör ni det Waksmans laboratorium har visat fungerar: ni letar i jord. Företaget ber missionärer och resenärer skicka hem jordprover från hela världen, och ni odlar fram bakterier ur dem — tusentals isolat, år efter år.</p>
      <p>Varje isolat testas mot en stafylokock som bryter ner penicillin. De allra flesta ger ingenting. Ett jordprov från Borneo ger en tydlig hämningszon.</p>`,
    extraktion: `<p>Du odlar upp bakterien i stor sats och gör ett extrakt. Det dödar stafylokocker, så ämnet finns där.</p>
      <p>Du börjar som vanligt: häller extraktet i en skiljetratt tillsammans med etylacetat, skakar, och låter skikten lägga sig. Sedan testar du skikten var för sig.</p>
      <p>All aktivitet ligger kvar i vattnet. Du provar hexan i stället. Samma sak. Butanol. Samma sak.</p>
      <p>Du provar knepet med pH — surt åt ena hållet, basiskt åt det andra — som brukar flytta över syror och baser. Ingen skillnad. Ämnet stannar envist i vattenfasen hur du än gör.</p>`,
    kromatografi: `<p>Ditt ämne är uppenbarligen mycket polärt. Och när du mäter närmare visar det sig bära både sura och basiska grupper: det är <b>laddat</b>, vid vilket pH du än arbetar.</p>
      <p>Du provar först en vanlig kiselgelkolonn. Ämnet binder så hårt till kiselgelen att det knappt kommer ut igen, hur mycket lösningsmedel du än häller på.</p>
      <p>Du behöver en metod som inte utnyttjar polaritet, utan själva laddningen.</p>`,
    struktur: `<p>Du har ett vitt pulver som är verksamt i mycket låg koncentration. Massan visar 1449 — mer än fyra gånger penicillinets.</p>
      <p>Hydrolys ger sju aminosyror. Flera av dem är aromatiska och finns inte i några proteiner över huvud taget.</p>
      <p>Och de sitter inte i en rak kedja. Sidokedjorna är sammankopplade med varandra, så att molekylen blir ett styvt, skålformat nät snarare än ett snöre. Två sockerenheter hänger på utsidan.</p>
      <p>Det är en av de mest komplicerade strukturer någon försökt reda ut. Den blir inte helt löst förrän decennier senare.</p>`,
    utveckling: `<p>Ämnet biter på de resistenta stafylokockerna, och det går att odla fram i mängd. Du har ett läkemedel.</p>
      <p>Men du minns extraktionen. Molekylen vägrade lämna vattenfasen, hur du än bar dig åt.</p>
      <p>Tarmväggen är en fettbarriär. Ett ämne som inte ens går över i etylacetat lär inte ta sig igenom den heller.</p>`
  },
  ciklosporin: {
    val: `<p>Du arbetar på Sandoz i Basel. Företaget har en regel: alla anställda ska ta med sig jordprover hem från sina semesterresor. Ur ett av proven växer en långsam, blek mögelsvamp fram.</p>
      <p>Den testas som alla andra isolat — mot svamp, för det är ett nytt svampmedel ni letar efter.</p>
      <p>Resultatet är nedslående. Knappt någon effekt alls, bara en svag verkan mot ett par arter. Enligt programmets regler ska isolatet kastas.</p>
      <p>Men företaget driver samtidigt ett annat program, som letar efter ämnen som dämpar immunförsvaret. Någon skickar extraktet dit också, mest för ordningens skull.</p>`,
    extraktion: `<p>I immuntestet är extraktet mycket aktivt. Det hämmar T-cellernas aktivering kraftigt — och till skillnad från dåtidens immunhämmande cellgifter slår det inte ut benmärgen.</p>
      <p>Det där är ovanligt nog för att göra alla intresserade. Du odlar upp svampen i större mängd och gör ett extrakt.</p>
      <p>I skiljetratten skakar du extraktet med etylacetat och vatten, låter skikta, och testar skikten var för sig. Nästan all aktivitet finns i det organiska skiktet.</p>
      <p>Du provar att ändra pH, uppåt och nedåt. Ingenting händer: ämnet stannar i etylacetatet oavsett.</p>`,
    kromatografi: `<p>Du vet nu två saker om molekylen, och båda kommer från skiljetratten: den är <b>fettlöslig</b>, och den är <b>oladdad</b>.</p>
      <p>Det avgör vilken kolonn du ska välja. Du packar en kolonn, börjar med ett helt opolärt lösningsmedel och ökar sedan polariteten steg för steg medan du samlar fraktioner.</p>
      <p>Varje fraktion går till immuntestet innan du går vidare.</p>`,
    struktur: `<p>Massan visar 1202. Det är en stor molekyl. Hydrolys ger elva aminosyror.</p>
      <p>Två saker är genast konstiga. En av aminosyrorna är en <b>D-form</b> — spegelbilden av den vanliga. Och sju av de elva kvävena i amidbindningarna bär en metylgrupp i stället för ett väte.</p>
      <p>Dessutom hittar du varken en fri aminoände eller en fri karboxyände. Kedjan har inga ändar alls.</p>
      <p>Och en av byggstenarna är en aminosyra som ingen har sett i någon annan organism, någonsin.</p>`,
    utveckling: `<p>Ämnet är ett utmärkt immunhämmande medel, och transplantationskirurgerna väntar otåligt.</p>
      <p>Men molekylen väger 1202. Tumregeln säger att allt över ungefär 500 inte tas upp från tarmen, så du förbereder dig på att det här kommer att få ges som injektion.</p>
      <p>Så kommer resultaten från djurförsöken. Ämnet tas upp från tarmen.</p>
      <p>Det borde det inte göra.</p>`
  },
  captopril: {
    val: `<p>Du är läkare i sydöstra Brasilien på 1960-talet. Till sjukhuset kommer plantagearbetare som blivit bitna av jararaca, en groporm som är vanlig i området.</p>
      <p>De bitna har ett gemensamt drag som du inte kan släppa: blodtrycket faller dramatiskt. Det faller snabbt, det faller mycket mer än blodförlusten kan förklara, och det händer <b>alla</b> som blivit bitna.</p>
      <p>Ett gift som dödar genom blödning är en sak. Men det här ser ut som något annat: som om giftet griper direkt in i kroppens egen blodtrycksreglering.</p>
      <p>Och om det gör det — då finns det något i giftet som skulle kunna användas.</p>`,
    extraktion: `<p>Du samlar in gift från ormar och tar med det till labbet.</p>
      <p>Till skillnad från en mögelodling finns här inget material att lösa ut något ur: giftet är redan en klar vätska. Problemet är i stället att det innehåller hundratals olika peptider och proteiner, och bara ett fåtal gör det du är ute efter.</p>
      <p>Av gammal vana provar du ändå att skaka giftet med etylacetat. Ingenting följer med det organiska skiktet.</p>
      <p>Och när du värmer en provsats för att koncentrera den tappar den sin verkan helt.</p>`,
    kromatografi: `<p>Du ska skilja de små aktiva peptiderna från giftets stora enzymer, utan att förstöra något på vägen.</p>
      <p>Du packar en kolonn med porösa korn och låter giftet rinna igenom i kall buffert. Fraktionerna samlas upp i tur och ordning, och varje fraktion testas i en blodtrycksmodell.</p>
      <p>De första rören som kommer ut visar sig innehålla de stora proteinerna. Aktiviteten dyker upp långt senare i serien.</p>`,
    struktur: `<p>Du har renat fram den mest aktiva peptiden ur giftet. Den är kort — nio aminosyror.</p>
      <p>Du bestämmer ordningen genom att klyva av en aminosyra i taget från änden och identifiera varje avklippt byggsten för sig.</p>
      <p>Sekvensen är ovanlig. Den är full av prolin, och den slutar med två prolin efter varandra. I andra änden sitter en glutaminsyra som ringslutit sig.</p>`,
    utveckling: `<p>Peptiden fungerar. Injicerar du den faller blodtrycket, precis som hos de ormbitna.</p>
      <p>Men ger du den som tablett händer ingenting alls. Tarmens enzymer har till uppgift att klyva peptidbindningar, och din molekyl består av nio stycken.</p>
      <p>En blodtrycksmedicin som måste injiceras är nästan värdelös. Högt blodtryck behandlas i åratal, varje dag, av människor som mår bra.</p>
      <p>Men du vet nu två saker: enzymet du vill hämma har en <b>zinkjon</b> i sitt aktiva säte, och det verkar vara peptidens <b>prolin-prolin-ände</b> som fastnar där.</p>`
  },
  streptomycin: {
    val: `<p>Det är 1940-tal och tuberkulos dödar fler människor än något annat smittsamt. På sanatorierna finns ingen behandling att ge: man erbjuder frisk luft, vila och hopp.</p>
      <p>Du arbetar i Selman Waksmans laboratorium, där man gör något som ingen gjort förut i den skalan. Ni odlar fram jordbakterier ur jordprov efter jordprov — tiotusentals isolat — och testar vartenda ett för sig.</p>
      <p>Det är monotont arbete. De flesta isolat gör ingenting alls. En del dödar testbakterier men visar sig vara lika giftiga för djur.</p>
      <p>Och tuberkulosbakterien är en plåga att arbeta med: den växer så långsamt att du får vänta tre, fyra veckor på varje svar.</p>`,
    extraktion: `<p>Du har hittat ett isolat som hämmar tuberkulosbakterien, och odlat upp det i mängd. Nu ska ämnet ut ur odlingsvätskan.</p>
      <p>Du gör som du brukar: skiljetratt, etylacetat, skaka, låt skikta. All aktivitet stannar i vattnet.</p>
      <p>Du mäter och konstaterar att ämnet är starkt <b>basiskt</b> — det bär guanidingrupper, bland de mest basiska grupper som finns i naturen.</p>
      <p>Det borde vara goda nyheter: en bas blir ju oladdad om man höjer pH, och då brukar den följa med det organiska skiktet. Du höjer pH till 11 och skakar igen.</p>
      <p>Ämnet stannar i vattnet.</p>`,
    kromatografi: `<p>Ditt ämne är alltså laddat i praktiskt taget allt vatten du kan arbeta i, och det är positivt laddat.</p>
      <p>Det stänger dörren till de vanliga kolonnerna, men det öppnar en annan: om molekylen alltid bär en positiv laddning går den att fånga med just den egenskapen.</p>
      <p>Du packar en jonbytarkolonn — och måste välja rätt sort.</p>`,
    struktur: `<p>Du har ett vitt pulver med massan 581. Nu ska du ta reda på vad det är.</p>
      <p>UV-spektrum är nästan tomt: inga aromatiska ringar. Hydrolys ger inga aminosyror, och NMR visar ingen lång kolkedja med metylgrenar.</p>
      <p>Det du får ut i stället är tre ringformade enheter som alla ser ut som sockerarter — men med kvävegrupper där sockerarter brukar ha hydroxylgrupper.</p>
      <p>Två av ringarna bär guanidingrupper. Det förklarar varför ämnet vägrade lämna vattenfasen.</p>`,
    utveckling: `<p>Ämnet botar tuberkulos. Först hos marsvin, sedan hos människa. Det har aldrig hänt förut, och nyheten går över hela världen.</p>
      <p>Men i de första studierna händer något oroande. Patienterna blir bättre i några månader — och sedan sämre igen.</p>
      <p>Odlar du bakterier från dem växer de obehindrat i ämnet som nyss botade dem.</p>
      <p>Dessutom börjar rapporter komma in om patienter som fått bestående hörselnedsättning och yrsel.</p>`
  },
  ivermektin: {
    val: `<p>Du är Satoshi Ōmura, och du har alltid små plastpåsar i fickan. Ser du intressant jord tar du ett prov — i skogsbrynet, vid åkerkanten, på en golfbana söder om Tokyo.</p>
      <p>Hemma i labbet odlar du fram jordbakterier ur proverna. Tusentals isolat, år efter år.</p>
      <p>Proverna skickas till ett laboratorium i USA för testning. Men de testar inte på plattor. De ger extrakten till <b>möss som infekterats med parasitmask</b>, och räknar maskarna efteråt.</p>
      <p>Av tusentals prover ger ett enda full effekt: mössen blir av med sina maskar. Det kommer från golfbanan.</p>`,
    extraktion: `<p>Du odlar upp bakterien i fermentor. Resultatet är en grumlig, gulaktig vätska som luktar jord.</p>
      <p>Du häller den i en skiljetratt tillsammans med ett organiskt lösningsmedel, skakar, och låter skikten lägga sig.</p>
      <p>När du testar skikten var för sig finns nästan all aktivitet i det organiska. Du provar att ändra pH åt båda hållen och skakar om.</p>
      <p>Ingen skillnad alls. Ämnet bryr sig inte om pH.</p>`,
    kromatografi: `<p>Två upplysningar har du redan fått gratis ur skiljetratten: molekylen är <b>fettlöslig</b>, och den är <b>oladdad</b>.</p>
      <p>Men extraktet innehåller massor av andra fettlösliga ämnen — fetter, membranrester, pigment. De måste bort.</p>
      <p>Du packar en kolonn och börjar med ett helt opolärt lösningsmedel.</p>`,
    struktur: `<p>Massan är över 850. Det här är en stor molekyl.</p>
      <p>NMR visar en mycket stor ring, sluten med en esterbindning, och flera mindre ringar hopfogade med den. Två sockerenheter hänger i ena änden.</p>
      <p>Du tittar på kolkedjan. Den är uppbyggd av enheter om två och tre kol, och med jämna mellanrum sticker en metylgrupp ut.</p>
      <p>Och ingenstans i hela molekylen finns en enda kväveatom.</p>`,
    utveckling: `<p>Ämnet dödar parasiter i löjligt låg dos och verkar anmärkningsvärt ofarligt för däggdjur. Det är ett läkemedel, och det kommer att behövas i hundratals miljoner doser.</p>
      <p>Men det finns ett problem. En av dubbelbindningarna i molekylen gör den kemiskt känsligare, och preparatet mer toxiskt än det behöver vara.</p>
      <p>Den dubbelbindningen går att hydrera — ett enkelt ingrepp på den färdiga molekylen.</p>
      <p>Att bygga hela molekylen från grunden är däremot otänkbart. Den är alldeles för komplicerad.</p>`
  },
  zikonotid: {
    val: `<p>Du växte upp vid Filippinernas kust. Där ligger kägelsnäckor i sanden, vackert mönstrade, och barn får lära sig att inte plocka upp dem.</p>
      <p>Nu är du forskare, och du har sett något som inte går ihop.</p>
      <p>Snäckan kryper långsammare än nästan allt annat i havet. Ändå lever den på <b>fisk</b> — byten som simmar hundra gånger fortare än den själv.</p>
      <p>På film ser du hur det går till. Snäckan skjuter ut en harpunliknande tand och träffar fisken. Och fisken slutar röra sig nästan omedelbart — inte efter en stund, utan på sekunder.</p>`,
    extraktion: `<p>Du dissekerar fram giftkörteln och gångarna ur snäckan och mal ner dem i kall buffert. Varje snäcka ger några mikroliter.</p>
      <p>När du analyserar giftet visar det sig inte innehålla en handfull ämnen, utan <b>hundratals</b> olika små peptider.</p>
      <p>Det är inte en slump. Snäckan har en hel arsenal, där olika peptider slår mot olika delar av bytets nervsystem samtidigt.</p>
      <p>För dig betyder det att separationen blir hela arbetet. Och peptiderna tål varken värme eller organiska lösningsmedel.</p>`,
    kromatografi: `<p>Du börjar med gelfiltration, som skiljer på storlek. Resultatet är nedslående: nästan allt kommer ut i samma fraktioner.</p>
      <p>Det är logiskt när du tänker efter. Peptiderna i giftet är nästan alla mellan 10 och 30 aminosyror långa — de är lika stora.</p>
      <p>Men de är inte lika. De innehåller olika aminosyror, och därmed olika många opolära sidokedjor.</p>
      <p>Du behöver en metod som skiljer på något annat än storlek.</p>`,
    struktur: `<p>Du har renat fram den aktiva peptiden. Den är 25 aminosyror lång.</p>
      <p>Men sekvenseringen går trögt. Kedjan verkar sitta ihop med sig själv, och enzymerna kommer inte åt att klippa som de ska.</p>
      <p>Aminosyraanalysen förklarar varför: sex av de tjugofem är <b>cystein</b>.</p>
      <p>Du reducerar provet så att svavelbryggorna bryts. Nu går sekvenseringen utmärkt — men den reducerade peptiden har tappat all verkan.</p>`,
    utveckling: `<p>Peptiden blockerar en jonkanal på nervändar i ryggmärgen, och i djurmodell lindrar den svår smärta utan att ge tolerans eller beroende.</p>
      <p>Men nu möter du två hinder på en gång.</p>
      <p>Peptider klyvs av tarmens enzymer, så en tablett är utesluten. Och peptiden är stor och polär, så den tar sig inte förbi blod–hjärnbarriären från blodet.</p>
      <p>Målet sitter i ryggmärgen. Innanför barriären.</p>`
  },
  exenatid: {
    val: `<p>Du är läkare och forskare på ett veteransjukhus i Bronx, och du studerar hormoner som styr insulinfrisättningen.</p>

      <p>Det betyder att det finns ämnen i djurgifter som träffar just det organ du arbetar med. Och gifter är finslipade av evolutionen för att göra sin sak snabbt, i små mängder, mot ett bestämt mål.</p>
      <p>Så du börjar gå igenom gifter. Ett av dem kommer från gilaödlan — en stor, långsam ödla i Arizonaöknen som kan gå månader mellan måltiderna, och sedan äta enormt på en gång.</p>`,
    extraktion: `<p>Giftet mjölkas ur ödlans körtlar och är redan en klar vattenlösning. Det finns inget material att lösa ut något ur.</p>

    kromatografi: `<p>Du har en blandning som spänner över hela storleksskalan: stora enzymer i ena änden, små peptider i den andra.</p>
