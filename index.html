<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Farmakognosi – läkemedel från mikrober och djur</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<!-- RDKit draws the chemical structures (same pinned version as the plant module and the biosynthesis trainer) -->
<script src="https://unpkg.com/@rdkit/rdkit@2026.9.2/dist/RDKit_minimal.js"></script>
<style>
/* Same look as medplants/index.html (Tailwind slate + emerald colours, plain CSS, no build step). */
:root {
  --bg: #0f172a; --panel: #1e293b; --panel2: #334155; --line: #475569;
  --text: #f1f5f9; --muted: #94a3b8; --soft: #cbd5e1;
  --acc: #10b981; --acc-hi: #6ee7b7; --acc-bg: rgba(16,185,129,.14);
  --bad: #f43f5e; --bad-bg: rgba(244,63,94,.16); --amber: #fbbf24;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font-family: 'Atkinson Hyperlegible', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
  font-size: 17px; line-height: 1.5;
  /* keeps the last buttons clear of the Android/iOS navigation bar (Pixel 7) */
  padding-bottom: calc(2rem + env(safe-area-inset-bottom));
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; }
button:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible, summary:focus-visible { outline: 3px solid #34d399; outline-offset: 2px; }
i, em { font-style: italic; }

header.top {
  position: sticky; top: 0; z-index: 20; background: var(--panel); border-bottom: 1px solid var(--panel2);
  padding: calc(.55rem + env(safe-area-inset-top)) 1rem .55rem; box-shadow: 0 2px 10px rgba(0,0,0,.3);
}
.top-inner { max-width: 960px; margin: 0 auto; }
h1 { margin: 0 0 .5rem; font-size: 1.7rem; color: #34d399; line-height: 1.2; }
nav.tabs { display: flex; gap: .4rem; overflow-x: auto; scrollbar-width: none; margin: 0 -1rem; padding: 0 1rem .1rem; }
nav.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: none; border: 2px solid var(--line); background: var(--bg); border-radius: 9999px;
  padding: .35rem .85rem; font-weight: 700; font-size: .95rem; color: var(--soft); white-space: nowrap;
}
.tab:hover { background: var(--panel2); }
.home-btn { display: none; }
/* phones: no menu and no fixed bar; a single "Start" button leads back to the start page */
@media (max-width: 640px) {
  header.top { position: static; box-shadow: none; }
  .top-inner { display: flex; align-items: center; justify-content: space-between; gap: .6rem; }
  h1 { font-size: 1.3rem; margin: 0; }
  nav.tabs { display: none; }
  .home-btn { display: inline-flex; flex: none; padding: .4rem .9rem; font-size: .95rem; }
  body[data-view="hem"] .home-btn { display: none; }
}
.tab.is-on { background: var(--acc); border-color: var(--acc); color: #052e22; }

main { max-width: 960px; margin: 0 auto; padding: 1rem; }
.card { background: var(--panel); border: 1px solid var(--panel2); border-radius: 1rem; padding: 1rem; }
.muted { color: var(--muted); }
.small { font-size: .9rem; }
h2 { font-size: 1.35rem; margin: 0 0 .4rem; }
h3 { font-size: 1.1rem; margin: 0 0 .3rem; }
p { margin: .3rem 0 .7rem; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: .45rem;
  border: 2px solid var(--line); background: var(--bg); border-radius: .9rem; padding: .7rem 1.1rem;
  font-weight: 700; min-height: 48px; transition: background-color .15s;
}
.btn:hover { background: var(--panel2); }
.btn:disabled { opacity: .5; cursor: default; }
.btn-main { background: #059669; border-color: #059669; color: #fff; }
.btn-main:hover { background: var(--acc); }
.btn-row { display: flex; flex-wrap: wrap; gap: .6rem; margin-top: 1rem; }
.btn-row .btn { flex: 1 1 10rem; }

/* home tiles */
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: .8rem; margin-top: 1rem; }
.tile { text-align: left; background: var(--panel); border: 2px solid var(--panel2); border-radius: 1rem; padding: 1rem; display: flex; gap: .9rem; align-items: flex-start; }
.tile:hover { border-color: var(--acc); background: #22324a; }
.tile .ico { font-size: 1.9rem; line-height: 1; }
.tile b { display: block; font-size: 1.12rem; color: #fff; }
.tile span.d { color: var(--soft); font-size: .95rem; }

/* choice chips (quiz theme, matching type) */
.chips { display: flex; flex-wrap: wrap; gap: .45rem; margin: .4rem 0 .2rem; }
.chip { border: 2px solid var(--line); background: var(--bg); border-radius: 9999px; padding: .4rem .9rem; font-weight: 700; font-size: .95rem; color: var(--soft); }
.chip.is-on { border-color: var(--acc); background: var(--acc-bg); color: #d1fae5; }

/* facts */
.facts dt { font-size: .78rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--acc-hi); margin-top: .8rem; }
.facts dd { margin: .15rem 0 0; color: var(--text); }
.facts ul { margin: .2rem 0; padding-left: 1.2rem; }
.facts li { margin: .15rem 0; }
.latin { font-style: italic; }
.plant-title { font-size: 1.3rem; font-weight: 700; color: #fff; }
.plant-title .sv { display: block; font-size: 1rem; font-weight: 400; color: var(--soft); font-style: normal; }
.maste { border: 1px solid var(--line); background: rgba(15, 23, 42, .55); border-radius: .9rem; padding: .8rem 1rem; margin-bottom: 1rem; }
.maste-h { font-weight: 700; color: var(--soft); margin-bottom: .3rem; }
.maste dl { margin: 0; }
.maste .mrow { display: grid; grid-template-columns: 9.5rem minmax(0, 1fr); gap: .6rem; padding: .25rem 0; border-top: 1px solid var(--panel2); }
.maste .mrow:first-child { border-top: 0; }
.maste dt { font-size: .8rem; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--acc-hi); padding-top: .15rem; }
.maste dd { margin: 0; }
@media (max-width: 480px) { .maste .mrow { grid-template-columns: 1fr; gap: 0; } }
.mol-cap .bio { display: block; font-size: .78rem; color: var(--muted); margin-top: .1rem; }
/* organism photos: shown on the fact pages only, never in the quiz */
.photo { width: 100%; max-height: 46vh; object-fit: contain; background: #020617; border-radius: .75rem; display: block; }
.credit { font-size: .75rem; color: var(--muted); margin-top: .3rem; }
.credit a { color: var(--muted); }
.credit .ptext { display: block; color: var(--soft); font-size: .92rem; margin-bottom: .15rem; }
.credit .slakte { display: block; color: var(--amber); font-size: .88rem; margin-bottom: .15rem; }
details.plant .photo, .modal .photo { margin-bottom: .2rem; }
.facts p.kontrast { margin: 0 0 .5rem; }
.svaga { margin-top: .8rem; padding-top: .8rem; border-top: 1px solid var(--panel2); }
.gruppmark { display: inline-block; font-size: .78rem; font-weight: 700; border-radius: 9999px; padding: .05rem .55rem; background: var(--panel2); color: var(--soft); margin-left: .35rem; vertical-align: middle; font-style: normal; }

/* teacher review page (#granskning) */
.gplant { margin-top: 1rem; }
.gtab { width: 100%; border-collapse: collapse; font-size: .95rem; }
.gtab th { text-align: left; vertical-align: top; width: 14rem; padding: .45rem .8rem .45rem 0; color: var(--acc-hi); font-weight: 700; font-size: .85rem; }
.gtab td { padding: .45rem 0; vertical-align: top; }
.gtab tr + tr { border-top: 1px solid var(--panel2); }
.gtab ul, .gplant ol { margin: .1rem 0; padding-left: 1.2rem; }
.gtab li, .gplant ol li { margin-bottom: .35rem; }
.gmark { display: inline-block; font-size: .85rem; color: var(--amber); }
.gkolla { border: 1px solid var(--amber); background: rgba(251,191,36,.08); border-radius: .7rem; padding: .5rem .8rem; margin: .5rem 0; }
@media (max-width: 640px) { .gtab th { display: block; width: auto; padding-bottom: 0; } .gtab td { display: block; } }
@media print {
  header.top, .granskning-intro .btn-row { display: none !important; }
  body, main, .card { background: #fff !important; color: #000 !important; }
  .card { border: 1px solid #999; break-inside: auto; }
  .gplant { break-before: page; }
  .gtab th, .gmark, .muted { color: #333 !important; }
}
.card a { color: var(--acc-hi); }

details.plant { background: var(--panel); border: 1px solid var(--panel2); border-radius: 1rem; margin-bottom: .6rem; }
details.plant > summary { list-style: none; padding: .8rem 1rem; cursor: pointer; display: flex; align-items: center; gap: .8rem; }
details.plant > summary::-webkit-details-marker { display: none; }
details.plant > summary::after { content: '▾'; margin-left: auto; color: var(--muted); transition: transform .15s; }
details.plant[open] > summary::after { transform: rotate(180deg); }
details.plant .body { padding: 0 1rem 1rem; }
.thumb { width: 2.6rem; height: 2.6rem; border-radius: .5rem; flex: none; background: #020617; display: flex; align-items: center; justify-content: center; font-size: 1.4rem; }
.search { width: 100%; padding: .75rem 1rem; border-radius: .9rem; border: 2px solid var(--line); background: var(--bg); color: var(--text); font: inherit; margin-bottom: .8rem; }
.list-h { font-size: .8rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: .8rem .2rem .35rem; }

/* flashcards */
.flash { min-height: 52vh; display: flex; flex-direction: column; }
.flash .front { text-align: center; }
.flash .front .plant-title { font-size: 1.6rem; margin-top: .7rem; }
.progress { height: .5rem; border-radius: 9999px; background: var(--panel2); overflow: hidden; margin: .4rem 0 .9rem; }
.progress > div { height: 100%; background: var(--acc); transition: width .3s; }

/* quiz */
.q-text { font-size: 1.2rem; font-weight: 700; margin: .2rem 0 .9rem; }
.opts { display: grid; gap: .55rem; }
.opt { text-align: left; border: 2px solid var(--line); background: var(--bg); border-radius: .9rem; padding: .75rem 1rem; min-height: 52px; }
.opt:hover:not(:disabled) { background: var(--panel2); }
.opt:disabled { cursor: default; }
.opt.ok { border-color: var(--acc); background: var(--acc-bg); color: #d1fae5; }
.opt.bad { border-color: var(--bad); background: var(--bad-bg); color: #ffe4e6; }
.feedback { margin-top: .9rem; padding: .8rem 1rem; border-radius: .9rem; font-weight: 700; }
.feedback.ok { background: var(--acc-bg); border: 1px solid var(--acc); color: #d1fae5; }
.feedback.bad { background: var(--bad-bg); border: 1px solid var(--bad); color: #ffe4e6; }
.feedback .more { font-weight: 400; margin-top: .3rem; }
.linkbtn { background: none; border: 0; padding: 0; color: var(--acc-hi); text-decoration: underline; font-weight: 700; text-align: left; }
.score { font-size: 2.4rem; font-weight: 700; color: #34d399; }

/* matching */
.match { display: grid; grid-template-columns: 1fr 1fr; gap: .5rem; }
.match .col { display: grid; gap: .5rem; align-content: start; }
.m-item { text-align: left; border: 2px solid var(--line); background: var(--bg); border-radius: .8rem; padding: .6rem .7rem; min-height: 56px; font-size: .95rem; line-height: 1.3; transition: background-color .15s, border-color .15s, opacity .2s; }
.m-item:hover:not(:disabled) { background: var(--panel2); }
.m-item.sel { border-color: var(--amber); background: rgba(251,191,36,.14); }
.m-item.done { border-color: var(--acc); background: var(--acc-bg); color: #d1fae5; opacity: .6; cursor: default; }
.m-item.wrong { border-color: var(--bad); background: var(--bad-bg); }
@media (max-width: 420px) { .m-item { font-size: .88rem; padding: .5rem .55rem; } }

/* chemical structures: drawn on white, like the plant module */
.mol { background: #fff; border-radius: .75rem; aspect-ratio: 4 / 3; display: flex; align-items: center; justify-content: center; overflow: hidden; cursor: zoom-in; }
.mol svg { width: 100%; height: 100%; display: block; }
.mol.wait::after { content: 'Ritar struktur …'; color: #64748b; font-size: .85rem; }
.mol .mol-err { color: #64748b; font-size: .85rem; padding: 1rem; text-align: center; }
.mol-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: .7rem; margin-top: .35rem; }
.mol-cap { font-size: .92rem; text-align: center; margin-top: .25rem; color: var(--soft); }
.mol-big { max-width: 560px; margin: 0 auto .6rem; }
.opts.opts-mol { grid-template-columns: 1fr 1fr; }
.opt.opt-mol { padding: .3rem; }
.opt.opt-mol .mol { cursor: pointer; }
.opt.opt-mol.ok, .opt.opt-mol.bad { border-width: 4px; }
.m-item.m-mol { padding: .25rem; }
.m-item .mol { cursor: pointer; }
.match-mol .m-item { min-height: 80px; display: flex; flex-direction: column; justify-content: center; }
.match-mol .m-item .mol { aspect-ratio: auto; height: 72px; width: 100%; }
.match-mol .m-item br { display: none; }

/* peptides: amino-acid sequence as one-letter beads */
.pep { background: #020617; border: 1px solid var(--panel2); border-radius: .75rem; padding: .7rem; }
.pep-name { font-weight: 700; margin-bottom: .45rem; color: var(--soft); font-size: .95rem; }
.beads { display: flex; flex-wrap: wrap; gap: .28rem; align-items: center; }
.bead { position: relative; min-width: 1.95rem; height: 1.95rem; padding: 0 .3rem; border-radius: 9999px; display: inline-flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: .85rem; color: #0f172a; line-height: 1; font-family: ui-monospace, 'Cascadia Mono', Consolas, monospace; }
.bead.hyd { background: #cbd5e1; } .bead.pol { background: #7dd3fc; } .bead.sur { background: #fda4af; }
.bead.bas { background: #c4b5fd; } .bead.gp { background: #e2e8f0; } .bead.cys { background: #fde047; }
.bead.ovr { background: #fdba74; border-radius: .6rem; }
.bead .nr { position: absolute; top: -.95rem; left: 50%; transform: translateX(-50%); font-size: .62rem; color: var(--muted); font-weight: 400; }
.beads.numrerad { padding-top: .9rem; }
.bead-end { color: var(--muted); font-size: .85rem; font-weight: 700; margin: 0 .15rem; }
.pep-not { font-size: .88rem; color: var(--soft); margin-top: .5rem; }
.legend { display: flex; flex-wrap: wrap; gap: .3rem .8rem; font-size: .78rem; color: var(--muted); margin-top: .55rem; }
.legend span { display: inline-flex; align-items: center; gap: .3rem; }
.legend .bead { min-width: 1rem; height: 1rem; font-size: .6rem; padding: 0; }
.opt .pep { padding: .45rem; }
.opt .bead { min-width: 1.5rem; height: 1.5rem; font-size: .72rem; }

/* upptäcktsresan */
.scenario { border-left: 4px solid var(--acc); background: rgba(16,185,129,.07); border-radius: .3rem .9rem .9rem .3rem; padding: .8rem 1rem; margin-bottom: 1rem; }
/* the observation the whole run hangs on: large at the start, collapsible afterwards */
.observation { border: 2px solid var(--acc); background: rgba(16,185,129,.09); border-radius: 1rem; padding: 1rem 1.2rem; margin-bottom: 1.1rem; }
.obs-h { font-size: .78rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--acc); }
.obs-plats { font-size: .9rem; color: var(--soft); font-weight: 700; margin-top: .15rem; }
.obs-text { font-size: 1.15rem; line-height: 1.5; color: #fff; margin: .5rem 0 0; }
.observation.obs-liten { padding: .5rem .9rem; margin-bottom: .9rem; border-width: 1px; }
.obs-liten summary { cursor: pointer; display: flex; flex-wrap: wrap; gap: .5rem; align-items: baseline; }
.obs-liten .obs-plats { margin-top: 0; font-weight: 400; }
.obs-liten .obs-text { font-size: 1rem; color: var(--text); }
.btn-bak { flex: 0 0 auto !important; min-width: 7rem; }
.fas-knapp { background: none; border: 0; padding: 0; color: inherit; font: inherit; text-decoration: underline dotted; }
.fas-knapp:hover { color: var(--acc-hi); }
.faskort .nr { grid-column: 1; grid-row: 1 / 3; align-self: stretch; display: flex; align-items: center; justify-content: center;
  min-width: 2.3rem; padding: 0 .35rem; border-radius: .5rem; background: var(--acc-bg); color: var(--acc);
  font-size: 1.6rem; font-weight: 700; line-height: 1; }
.ledtrad { border: 1px dashed var(--line); background: rgba(15,23,42,.5); border-radius: .9rem; padding: .7rem .9rem; margin: 0 0 .9rem; color: var(--soft); }
.ledtrad-h { display: block; font-size: .78rem; letter-spacing: .06em; text-transform: uppercase; color: var(--acc-hi); margin-bottom: .2rem; }
/* the scene: what you are doing and seeing, right before the decision */
.berattelse { border-left: 4px solid var(--acc); background: rgba(16,185,129,.06); border-radius: .3rem .9rem .9rem .3rem;
  padding: .9rem 1.1rem; margin: 0 0 1rem; font-size: 1.08rem; line-height: 1.6; }
.berattelse p { margin: 0 0 .7rem; }
.berattelse p:last-child { margin-bottom: 0; }
.berattelse b { color: #fff; }
/* diagrams: inline SVG that follows the page colours and scales to phone width */
.fig { width: 100%; height: auto; display: block; margin: .3rem 0; overflow: visible; }
.fig text { font-family: inherit; fill: var(--soft); }
.fig .f-h { font-size: 17px; font-weight: 700; fill: var(--acc-hi); }
.fig .f-l { font-size: 15px; fill: var(--text); }
.fig .f-s { font-size: 13px; fill: var(--muted); }
.fig .f-ok { font-size: 14px; font-weight: 700; fill: var(--acc); }
.fig .f-no { font-size: 14px; fill: var(--muted); }
.fig .f-arrow { stroke: var(--line); stroke-width: 2.5; fill: none; marker-end: url(#pil); }
.fig-liten { margin-bottom: .8rem; }
.organismfoto { margin-bottom: .8rem; }
/* a custom illustration for a stage, if Luke has put one in img/ */
.stegbild { width: 100%; height: auto; border-radius: .75rem; display: block; margin-bottom: .9rem; }
.organismfoto .photo { max-height: 220px; }
.larom-fig .fig + .fig { margin-top: 1.2rem; padding-top: 1.2rem; border-top: 1px solid var(--panel2); }
/* related substances in the same class, on the back of a structure card */
.syskon { border-top: 1px solid var(--panel2); margin-top: 1rem; padding-top: .8rem; }
.syskon-h { font-size: .78rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--acc-hi); margin-bottom: .5rem; }
.syskon-rad { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: .9rem; }
.syskon-ruta { border: 1px solid var(--panel2); border-radius: .8rem; padding: .6rem; background: var(--bg); }
.syskon-namn { font-weight: 700; color: #fff; text-align: center; margin-top: .35rem; }
.syskon-diff { font-size: .88rem; color: var(--soft); margin-top: .35rem; line-height: 1.45; }
.belon { margin-top: .9rem; border: 1px solid var(--line); border-radius: .9rem; padding: .7rem .9rem; background: rgba(15,23,42,.5); }
.belon .mol-big { max-width: 420px; margin: .3rem auto 0; }
/* the teaching panel shown before each question */
.larom { background: rgba(15,23,42,.55); border: 1px solid var(--line); border-radius: .9rem; padding: .9rem 1.1rem; }
.larom-split .larom-fig { margin-top: .6rem; }
/* a stage with no diagram: one centred column at a comfortable reading width */
/* The teaching box fills its card — no max-width of its own. On a wide screen the TEXT is
   what gets split into two columns (see the desktop block), which keeps the line length
   readable while still using the width. Narrowing the box instead just leaves a gutter. */
.larom-ensam { padding: 1.1rem 1.4rem; }
.larom-ensam .larom-text { max-width: none; }
/* the solvent list on the extraction stage */
.losningsmedel { margin: .6rem 0 1rem; }
.losningsmedel dt { font-weight: 700; color: var(--acc-hi); margin-top: .7rem; }
.losningsmedel dt span { font-weight: 400; color: var(--muted); font-size: .9em; }
.losningsmedel dd { margin: .1rem 0 0; padding-left: 0; }
.losningsmedel dd b { color: #fff; }
/* the title of the journey, at the top of every stage */
.resa-topp { margin-bottom: .5rem; }
.resa-steg { display: block; font-size: .82rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--acc); }
.resa-titel { font-size: 1.75rem; line-height: 1.2; margin: .15rem 0 0; color: #fff; }
@media (max-width: 640px) { .resa-titel { font-size: 1.35rem; } }
.larom p { margin: .4rem 0 .7rem; }
.larom p:last-child, .larom ul:last-child { margin-bottom: 0; }
.larom ul { margin: .3rem 0 .7rem; padding-left: 1.2rem; }
.larom li { margin: .25rem 0; }
.repetera { margin-bottom: .8rem; }
.repetera summary { cursor: pointer; color: var(--acc-hi); font-weight: 700; font-size: .9rem; padding: .3rem 0; }
.repetera .larom { margin-top: .4rem; font-size: .93rem; }
/* the six stages, shown as a map on the start page and as a strip during a run */
.faskarta { display: grid; grid-template-columns: repeat(auto-fit, minmax(13rem, 1fr)); gap: .5rem; margin-top: 1rem; align-items: stretch; }
/* the number is a full-height block down the left edge, with the two lines of text beside it */
.faskort { border: 1px solid var(--panel2); border-radius: .7rem; padding: .7rem .85rem; background: var(--bg);
  display: grid; grid-template-columns: auto minmax(0, 1fr); column-gap: .75rem; row-gap: .15rem; align-items: center; }
.faskort b { grid-column: 2; align-self: end; font-size: .95rem; color: #fff; line-height: 1.25; }
.faskort > span:not(.nr) { grid-column: 2; align-self: start; font-size: .85rem; color: var(--muted); line-height: 1.3; }

  /* the run: the evidence on the left, the decision on the right, the journal under it */
  .resa-split { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 2rem; align-items: start;

/* ---------- the reveal page at the end of a run ---------- */

.slut-bild .mol-big { max-width: 440px; margin: 0 auto; }
.slut-fakta .facts { margin: 0; }
.slut-lank { margin-top: .9rem; }
.slut-logg { margin-top: 1.2rem; }
.slut-logg .maste { margin-bottom: 0; }
/* the numbered step in the sidebar journal during a run */
.logg-nr { display: inline-flex; align-items: center; justify-content: center; width: 1.25rem; height: 1.25rem;
  border-radius: 9999px; background: var(--acc-bg); color: var(--acc); font-size: .75rem; margin-right: .4rem; vertical-align: -.2rem; }
/* the end-of-run chain: numbered steps with an arrow between each pair */
.kedja { list-style: none; margin: .6rem 0 0; padding: 0; display: grid; gap: .9rem; }
.kedja-steg { position: relative; border: 1px solid var(--panel2); border-radius: .8rem; padding: .7rem .85rem .75rem; background: var(--bg); }
.kedja-nr { display: inline-flex; align-items: center; justify-content: center; width: 1.5rem; height: 1.5rem;
  border-radius: 9999px; background: var(--acc-bg); color: var(--acc); font-weight: 700; font-size: .85rem; margin-bottom: .35rem; }
.kedja-rubrik { display: block; font-size: .78rem; font-weight: 700; letter-spacing: .04em; text-transform: uppercase;
  color: var(--acc-hi); margin-bottom: .25rem; }
.kedja-text { display: block; font-size: .93rem; }
/* the arrow sits in the gap between two steps; the last step has none */
.kedja-steg::after { content: '↓'; position: absolute; left: 50%; bottom: -1rem; transform: translateX(-50%);
  color: var(--acc); font-size: 1.3rem; line-height: 1; font-weight: 700; }
.kedja-steg:last-child::after { content: none; }
/* ---------- The teaching text in columns ----------
   The point is to use the width WITHOUT letting the line length run to 100+ characters: two
   columns of ~60 characters read far better than one very wide one, and the page becomes about
   half as tall, so there is no scroll-back-up problem. `columns: 30rem` rather than
   `column-count: 2` — the browser takes a second column only when each would still be 30rem
   wide, so it falls back to one column on its own and needs no breakpoint of its own. */
@media (min-width: 1024px) {
  .larom-ensam .larom-text { columns: 30rem; column-gap: 2.75rem; column-rule: 1px solid var(--panel2); }
  /* keep a heading with what follows it, and never split a solvent off its description */
  .larom-ensam .larom-text > h4, .larom-ensam .larom-text > p > b:only-child { break-after: avoid; }
  .larom-ensam .larom-text li, .larom-ensam .larom-text dd { break-inside: avoid; }
  .larom-ensam .larom-text dt { break-after: avoid; break-inside: avoid; }
  .larom-ensam .larom-text dd { break-before: avoid; }
  /* a whole list stays in one column — a solvent table split across the gap reads as two
     separate lists, and the reader loses that it is one scale from nonpolar to polar */
  .larom-ensam .larom-text dl, .larom-ensam .larom-text ul, .larom-ensam .larom-text ol { break-inside: avoid; }
  .larom-ensam .larom-text > *:first-child { margin-top: 0; }
}
/* Wide enough for all five steps side by side (~230 px each at the 13" baseline): the chain
   then runs left to right and the arrows turn with it. Narrower, it stays a vertical chain. */
@media (min-width: 1150px) {
  .kedja { grid-template-columns: repeat(5, minmax(0, 1fr)); column-gap: 1.7rem; }
  .kedja-steg::after { content: '→'; left: auto; right: -1.2rem; bottom: auto; top: 50%; transform: translateY(-50%); }
}
/* ---------- WIDE DESKTOP (1200 px and wider — a 13" laptop is the smallest we design for) ---------- */
@media (min-width: 1200px) {
  /* the five stages and the five tiles fit on one row instead of wrapping 4 + 1 */
  .faskarta { grid-template-columns: repeat(5, minmax(0, 1fr)); }
  .home-grid .tiles { grid-template-columns: repeat(5, minmax(0, 1fr)); }

/* On a 13" laptop the heading plus six tabs is just too wide for one row; trimming both a

@media (min-width: 1024px) and (max-width: 1599px) {
  h1 { font-size: 1.3rem; }
  .tab { padding: .3rem .65rem; font-size: .88rem; border-width: 1px; }
  nav.tabs { gap: .3rem; }
}

<script>
/* =====================================================================

/* Shared cores used by `karna` to draw the members of a substance class the same way,

/* ---------- SVAMPAR ---------- */
{

  framst: 'naturlig', framstText: 'Fenylättiksyra tillsätts odlingen som byggsten till sidokedjan.',

const FASER = [
  { key: 'val', rubrik: 'Val av organism', kort: 'Varför leta just här?',
    larom: `<p>Det finns miljontals arter. Det första verkliga beslutet i farmakognosin är <b>var man ens ska leta</b> — och det avgör mer om utfallet än något annat steg.</p>
      <p>I den här modulen kommer läkemedlen från <b>bakterier, svampar och djur</b>, och de två grupperna hittas på nästan motsatta sätt:</p>
      <ul>
      <li><b>Mikrober hittas nästan alltid genom screening.</b> En jordbakterie ser ut som vilken annan som helst, och ingen kan på förhand säga vilken som bildar något användbart. Alltså odlar man fram tusentals isolat och testar vart och ett. Det bygger på ett enkelt ekologiskt resonemang: ett gram jord innehåller miljarder mikrober som konkurrerar om samma utrymme och näring, och de försvarar sig kemiskt. Därifrån kommer de flesta antibiotika. Undantaget är de första fynden, som gjordes av ren slump — och sådan slump går bara att utnyttja om man lägger märke till den.</li>
      <li><b>Djur hittas nästan alltid genom en observation.</b> Ett gift gör något dramatiskt och lätt att se: ett byte förlamas på sekunder, en ormbiten människas blodtryck rasar. Man behöver inte screena tusen ormar — observationen pekar direkt på vilket djur som är intressant <i>och</i> ungefär vad ämnet gör. Gifter är dessutom tacksamma att leta i, eftersom evolutionen har finslipat dem för att träffa bestämda mål snabbt och i små mängder.</li></ul>
      <p>Det finns en tredje väg som är viktig i farmakognosin i stort — <b>traditionell användning</b>, att ett folkligt läkemedel undersöks vetenskapligt. Den vägen har gett många växtläkemedel, men nästan inga av läkemedlen i den här modulen: mögelsvampar och jordbakterier har ingen tradition att utgå från, och djurgifter har sällan använts som läkemedel. Mjöldrygan är det närmaste man kommer, där barnmorskor använde svampen långt innan kemin fanns.</p>
      <p>Oavsett hur du hittade organismen är första åtgärden densamma: <b>odla fram den i renkultur och upprepa observationen.</b> En förorenad platta kan innehålla flera arter, och då vet man inte vilken som gör vad. Går fyndet inte att upprepa finns inget projekt.</p>
      <p>Du behöver också <b>ett bioassay du kan köra om och om igen</b>, eftersom varje fraktion i varje reningssteg ska testas. Testet måste matcha det du söker: hämningszoner på en agarplatta för ett antibiotikum, blodtryck i djurmodell för ett ormgift. Och kom ihåg att <b>du bara kan hitta det du testar för</b> — ett extrakt som faller igenom ett test kan vara höggradigt aktivt i ett annat.</p>` },
  { key: 'extraktion', rubrik: 'Extraktion', kort: 'Få ämnet i lösning',
    larom: `<p>Du har odlat upp organismen. Nu ska ämnet <b>ut ur materialet och in i en lösning</b>. Det görs med ett lösningsmedel, och valet styrs av tumregeln <i>lika löser lika</i>: ett opolärt ämne följer med ett opolärt lösningsmedel, ett polärt med ett polärt.</p>
      <p>De här är de vanliga, från opolärt till polärt:</p>
      <dl class="losningsmedel">
        <dt>Hexan <span>(och petroleumeter)</span></dt>
        <dd><b>Opolärt.</b> Tar med sig fetter, oljor, vaxer och terpener. Används ofta först, just för att <i>tvätta bort</i> fett innan man går vidare.</dd>
        <dt>Diklormetan</dt>
        <dd><b>Svagt polärt.</b> Bra för alkaloider och andra medelpolära ämnen. Tungt, flyktigt och lätt att avdunsta bort.</dd>
        <dt>Etylacetat</dt>
        <dd><b>Medelpolärt.</b> Arbetshästen. De flesta läkemedelsstora molekyler följer med hit, och det blandar sig inte med vatten — alltså perfekt för skiljetratt.</dd>
        <dt>Metanol <span>(och etanol)</span></dt>
        <dd><b>Polärt.</b> Löser nästan allt, inklusive glykosider och fenoler. Priset är att det också tar med sig mycket skräp: socker, salter, pigment.</dd>
        <dt>Vatten <span>(ofta buffrat)</span></dt>
        <dd><b>Mycket polärt.</b> Enda alternativet för peptider, proteiner och laddade ämnen. Gift och kroppsvätskor är redan vattenlösningar och behöver inget extraktionssteg alls.</dd>
      </dl>
      <p>Vet man inte vad man har, extraherar man <b>stegvis</b> med allt polärare lösningsmedel och testar varje extrakt i bioassayen. Då ger extraktionen också ett första besked om vad ämnet är för sorts molekyl.</p>
      <p>För <b>syror och baser</b> hänger valet dessutom på pH. En syra är <b>oladdad</b> i surt och <b>laddad</b> i basiskt; en bas tvärtom. Den oladdade formen är fettlöslig och följer med ett organiskt lösningsmedel, den laddade stannar i vattnet. Genom att ställa in pH bestämmer man alltså var ämnet helst vill vara. Hur långt det går beror på hur stark gruppen är: en vanlig amin är oladdad redan vid pH 9, medan en guanidingrupp är laddad i allt vatten man kan arbeta i. pH kan också ändra själva molekylen — en lakton öppnas av bas genom hydrolys till en fri syra.</p>
      <p>Och är ämnet så polärt eller så laddat att inget lösningsmedel vill ta det, får man byta princip: binda ämnet till en <b>adsorptionsresin</b> och sedan <b>eluera</b> det därifrån.</p>
      <p>Och en sak till: <b>ämnet ska överleva</b>. Värme, syre, ljus och extrema pH-värden bryter ner många naturprodukter, proteiner denaturerar av organiska lösningsmedel, och material som bukspottkörtel innehåller egna enzymer som bryter ner ämnet medan man arbetar. Ofta väljs metoden lika mycket för att skona ämnet som för att lösa ut det.</p>` },
  { key: 'kromatografi', rubrik: 'Separation', kort: 'Skilja ämnet från allt annat',
    larom: `<p>Extraktet innehåller fortfarande hundratals ämnen. Nu ska de separeras.</p>
      <p>Den enklaste separationsmetoden är <b>vätske–vätskeextraktion</b>. Två lösningsmedel som inte blandar sig — oftast vatten och ett organiskt — skakas ihop i en skiljetratt. Varje ämne fördelar sig mellan skikten efter var det löser sig bäst, skikten tappas av var för sig, och man upprepar. Ingen kolonn, ingen utrustning att tala om, och ändå blir man av med en stor del av orenheterna.</p>
      <p>För syror och baser blir metoden ännu starkare med <b>pH</b>. En syra går över i det organiska skiktet vid lågt pH, där den är oladdad, och tillbaka till vattnet vid högt pH, där den är laddad. Genom att växla pH kan man flytta ämnet fram och tillbaka mellan faserna och lämna orenheter kvar vid varje byte — rening och uppkoncentrering i ett.</p>
      <p>Men metoden har en gräns: är ämnet så polärt eller så laddat att det <i>aldrig</i> föredrar det organiska skiktet finns ingen fördelning att utnyttja. Då binder man i stället ämnet till en <b>adsorptionsresin</b> och eluerar det därifrån.</p>
      <p>För finare separation krävs <b>kromatografi</b>, och metoden väljs efter ämnets egenskaper. Fyra typer räcker långt:</p>
      <ul>
      <li><b>Normalfas</b> (kiselgel). Stationärfasen är <i>polär</i>, mobilfasen opolär (t.ex. hexan/etylacetat). Polära ämnen binder hårdast och sitter kvar längst — <b>opolära ämnen kommer ut först</b>. Man eluerar genom att göra mobilfasen allt polärare.</li>
      <li><b>Omvänd fas</b> (C18). Tvärtom: stationärfasen är <i>opolär</i> (C18-kedjor på kiselgel), mobilfasen polär (vatten med metanol eller acetonitril). Opolära ämnen binder hårdast — <b>polära ämnen kommer ut först</b>. Man eluerar genom att öka andelen organiskt lösningsmedel. Det här är arbetshästen och grunden i de flesta HPLC-system.</li>
      <li><b>Jonbyte</b>. Stationärfasen bär fasta laddningar och binder ämnen med motsatt laddning: en <b>katjonbytare</b> är negativ och binder positiva ämnen, en <b>anjonbytare</b> är positiv och binder negativa. Oladdade ämnen passerar rakt igenom. Man eluerar genom att höja salthalten eller ändra pH så att ämnet tappar sin laddning. Rätt val för aminer, syror och andra laddade ämnen.</li>
      <li><b>Storleksexklusion</b> (gelfiltration). Kornen är porösa. Små molekyler kommer in i porerna och får en lång väg genom kolonnen; stora molekyler ryms inte och går rakt förbi. Därför kommer <b>stora molekyler ut först</b> och små sist — tvärtemot vad många gissar. Metoden är skonsam och används för peptider och proteiner.</li></ul>
      <p>Och det avgörande: <b>bioassay efter varje steg.</b> Det är det som gör fraktioneringen <i>aktivitetsstyrd</i> — aktiviteten pekar ut vilken fraktion du ska gå vidare med. Utan testning har du tjugo rör och ingen aning om vilket som innehåller ämnet.</p>
      <p>Varje runda ger renare material. Till slut återstår ett ämne, och renheten kontrolleras med analytisk HPLC eller TLC.</p>` },
  { key: 'struktur', rubrik: 'Strukturbestämning', kort: 'Vad är det för molekyl?',
    larom: `<p>Du har nu några milligram av ett rent ämne och vet ingenting om det. Strukturbestämning sker i en bestämd ordning, där varje metod svarar på sin fråga.</p>
      <p><b>1. Vilka atomer, och hur många?</b> Högupplösande masspektrometri ger massan med så många decimaler att bara en summaformel passar. Ur formeln räknar man också ut <i>dubbelbindningsekvivalenter</i>: hur många ringar och dubbelbindningar molekylen måste innehålla. Redan där vet man om det är en platt aromatisk molekyl eller ett mättat skelett.</p>
      <p><b>2. Vilka funktionella grupper?</b> UV-spektrum avslöjar konjugerade system och aromatiska ringar. IR visar OH, NH, karbonyler. Billigt och snabbt, och styr tolkningen vidare.</p>
      <p><b>3. Hur sitter atomerna ihop?</b> Det är <b>NMR</b> som ger molekylens skelett, och det är huvuddelen av arbetet. ¹H-NMR visar hur många väten molekylen har och i vilka kemiska miljöer de sitter; ¹³C-NMR gör samma sak för kolatomerna. Ur signalernas lägen och hur de påverkar varandra byggs strukturen ihop bit för bit.</p>
      <p><b>4. Vad är den byggd av?</b> Hydrolys bryter isär molekylen i sina byggstenar, som identifieras var för sig: aminosyror, sockerarter, fettsyror. För aminosyror används dessutom kiral analys för att avgöra D- eller L-form.</p>
      <p><b>5. Hur ser den ut i tre dimensioner?</b> Stereokemin är svårast. Röntgenkristallografi ger hela strukturen på en gång, inklusive vilken spegelbildsform molekylen har — men kräver att ämnet går att kristallisera, vilket inte alla gör.</p>
      <p>För <b>peptider</b> ser arbetet annorlunda ut: de sekvenseras, en aminosyra i taget från änden (Edmannedbrytning) eller med masspektrometri. Byggstenarna är redan kända — det är ordningen som är strukturen.</p>
      <p>Byggstenarna avslöjar dessutom <b>hur organismen byggde ämnet</b>, vilket är en bra genväg till ämnesklassen: lika enheter om två kol → polyketid (PKS); aminosyror med D-former eller metylerade kväven → icke-ribosomal peptid (NRPS), eftersom ribosomen inte kan göra sådana; bara de 20 vanliga L-aminosyrorna → ribosomal peptid; enheter om fem kol → terpen.</p>` },
  { key: 'utveckling', rubrik: 'Från naturprodukt till läkemedel', kort: 'Det sista, svåraste steget',
    larom: `<p>Här faller de allra flesta naturprodukter ifrån. Ett ämne som verkar i en skål är ännu inget läkemedel. Det måste också klara fyra prov:</p>
      <ul><li><b>Komma dit det ska.</b> Tas det upp från tarmen? Når det rätt vävnad? Överlever det magsyran och levern?</li>
      <li><b>Hålla sig.</b> Bryts det ner i lösning, i värme, i ljus? Går det att lagra?</li>
      <li><b>Vara tillräckligt ofarligt.</b> Skillnaden mellan verksam dos och skadlig dos — det terapeutiska fönstret — måste vara tillräckligt stor.</li>
      <li><b>Gå att tillverka i mängd.</b> Några milligram räcker till forskning, inte till en marknad.</li></ul>
      <p>Naturprodukten är därför oftast en <b>ledstruktur</b>: en utgångspunkt som visar att något <i>kan</i> göras, inte en färdig produkt. Fyra vägar framåt:</p>
      <ul><li><b>Använd den som den är</b>, renad ur odlingen. Kräver att den redan klarar alla fyra proven. Då blir utmaningen i stället produktionen: man letar efter högproducerande stammar, muterar dem och trimmar odlingsbetingelserna. Penicillinutbytet höjdes så flera tusen gånger under 1940-talet.</li>
      <li><b>Semisyntes</b>: odla fram naturprodukten och ändra den kemiskt. Ofta behåller man den komplicerade kärnan — den som vore dyr att bygga — och byter ut en sidokedja. Det är så cefalosporinerna, rifampicin och simvastatin har kommit till.</li>
      <li><b>Helsyntes efter förebild</b>: behåll idén, kasta molekylen. Man tar reda på vilken del som gör jobbet och bygger en enklare molekyl kring den. Resultatet kan sakna varje atom från originalet.</li>
      <li><b>Rekombinant tillverkning</b>: flytta generna till en organism som är lätt att odla, eller låt celler tillverka peptiden direkt. Nödvändigt för stora peptider och proteiner, som varken går att odla fram i mängd eller syntetisera billigt.</li></ul>
      <p>Och ibland ändrar man inte molekylen alls, utan <b>beredningen</b>: kapslar in den i liposomer, byter salt eller ger den på ett annat sätt. Amfotericin B blev användbart genom en ny beredning, inte en ny struktur.</p>
      <p>Ett återkommande mönster är värt att lägga märke till: <b>den egenskap som ställde till problem i labbet dyker ofta upp igen som en egenskap hos läkemedlet.</b> Ett ämne som var besvärligt att extrahera för att det är för polärt är ofta också ett ämne som inte tas upp från tarmen.</p>` }
];

const FALL = [
{
  id: 'penG', titel: 'Mögelfläcken på plattan', ar: 1928, plats: 'Ett sjukhuslaboratorium i London',
  ingress: 'Du kommer tillbaka från semestern och hittar en bakterieodling som blivit stående på bänken. En mögelsvamp har förorenat plattan. Runt mögelfläcken, och bara där, har stafylokockerna lösts upp.',
  steg: {
    val: { data: ['Stafylokockerna täcker hela agarytan som en matta — utom i en ring runt mögelfläcken, där agarn är blank och tom.', 'Ringen är flera millimeter bred, alltså tydligt bredare än själva mögelfläcken.', 'Närmast möglet syns kolonier som ser upplösta ut, som om de börjat smälta bort.', 'Plattan har stått i rumstemperatur i flera veckor medan du varit bortrest.'],
      fraga: 'Du har en observation. Vad gör du först?',
      val: ['Odlar upp mögelsvampen i renkultur och försöker upprepa effekten', 'Skickar plattan på kemisk analys', 'Antar att mögelsvampen äter bakterierna och går vidare', 'Sparar plattan och går vidare med annat — en enstaka platta säger ingenting'], ratt: 0,
      varforFel: [null,
        'Det finns ingenting att analysera ännu. Plattan innehåller agar, näringssalter, bakterier, mögel och möjligen några milligram av något okänt — en kemisk analys av alltihop ger en lista på allt utom det du är ute efter. Analys kommer långt senare, när du har renat fram ämnet. 1928 fanns dessutom varken masspektrometri eller NMR.',
        'Det är en rimlig gissning, men observationen talar emot den. Hade svampen ätit upp bakterierna skulle den tomma ytan sluta där svampen slutar. Ringen är flera millimeter bredare än mögelfläcken, vilket betyder att något har spridit sig ut i agarn på egen hand — och det som sprider sig går att samla upp.',
        'Att vara skeptisk mot en enstaka observation är helt rätt — men slutsatsen blir fel. Det är just därför man gör om försöket. Hade Fleming kastat plattan hade spåret dött där; i stället odlade han upp svampen och kunde visa att effekten kom tillbaka varje gång.'],
      varfor: 'En observation som inte går att upprepa är ingenting. Renkultur först, sedan upprepa — och att zonen är bredare än mögelfläcken betyder dessutom att något har <i>diffunderat ut</i> i agarn. Det är ett utsöndrat ämne, inte svampen själv, och det går alltså att extrahera.' },
    extraktion: { data: ['Du odlar upp svampen, extraherar materialet och får ett aktivt vattenextrakt.', 'Ämnet visar sig vara en <b>syra</b>.', 'Du vill flytta över det till etylacetat för att bli av med salter och polära orenheter.'],
      fraga: 'Vid vilket pH går syran över i det organiska skiktet?',
      val: ['Vid lågt pH, när syran är oladdad', 'Vid högt pH, när syran är laddad', 'pH spelar ingen roll vid extraktion', 'Vid neutralt pH, där syran är som mest stabil'], ratt: 0,
      varforFel: [null,
        'Tvärtom. Vid högt pH har syran avgett sin proton och bär en negativ laddning. En laddad molekyl omger sig med vattenmolekyler och stannar kvar i vattenfasen — det är precis så man tvättar bort syror ur ett organiskt skikt.',
        'pH är tvärtom ett av de starkaste greppen man har, just för syror och baser. Det avgör om molekylen är laddad eller oladdad, och därmed vilken fas den föredrar. Utan det hade penicillinet varit betydligt svårare att rena.',
        'Frestande, eftersom ämnet mycket riktigt är känsligast i surt — men vid neutralt pH är syran fortfarande till stor del laddad och stannar i vattnet. Lösningen blev i stället att surgöra <i>kallt och snabbt</i>: man tar risken under kort tid för att få över ämnet, och neutraliserar direkt efteråt.'],
      varfor: 'En syra är oladdad i sur miljö och laddad i basisk. Den oladdade formen är mer fettlöslig och följer med det organiska skiktet; den laddade stannar i vattnet. Så: surgör och skaka över i etylacetat, höj sedan pH och skaka tillbaka till rent vatten — ämnet följer med, orenheterna lämnas kvar. Just den här molekylen bryts dessutom ner av syra, så allt måste ske kallt och snabbt. Det var precis där Fleming misslyckades; först 1940 löste Florey och Chain reningen.' },
    kromatografi: { data: ['Året är 1940. Kiselgelkolonner är ovanliga, jonbytarresiner nya, och HPLC ligger trettio år fram i tiden.', 'Det du har är skiljetratt, lösningsmedel, is och en pH-mätare.', 'Ämnet är en <b>syra</b>: oladdat i surt, laddat i basiskt.', 'Och det bryts ner i surt vatten, så varje steg måste gå fort och kallt.'],
      fraga: 'Hur renar du ämnet med den utrustning som finns?',
      val: ['Upprepad vätske–vätskeextraktion där du växlar pH fram och tillbaka',
            'Omvänd fas (C18) med vatten och acetonitril som mobilfas',
            'Jonbyte på en katjonbytare',
            'Gelfiltration, som skiljer på storlek'], ratt: 0,
      varforFel: [null,
        'C18-kolonner och HPLC utvecklades först på 1970-talet. År 1940 fanns varken bundna stationärfaser eller pumpar som klarar trycket — i dag hade det varit förstahandsvalet för just den här molekylen, men inte då.',
        'Jonbyte binder ämnen med <i>motsatt</i> laddning, och en katjonbytare binder positiva ämnen. Ditt ämne är en syra, alltså negativt laddad i sin laddade form, så en katjonbytare griper inte tag i den alls. Dessutom var jonbytarresiner nya och knappast tillgängliga för det här arbetet 1940.',
        'Gelfiltration skiljer på storlek, och ditt ämne är litet (334). Orenheterna i odlingsvätskan är av alla möjliga storlekar, så storlek skiljer inte ut just din molekyl. Sephadex, som gjorde metoden praktisk, kom först 1959.'],
      varfor: 'Lösningen låg i att ämnet är en syra. Surgör du blir det oladdat och går över i det organiska skiktet; höjer du pH blir det laddat och går tillbaka till vattnet — renare för varje växling, eftersom orenheter som inte beter sig likadant lämnas kvar. Upprepat många gånger kallas det motströmsfördelning, och det var så Florey och Chains grupp fick fram det första användbara penicillinet. Det sista steget var frystorkning, eftersom ämnet inte tålde värme. <b>I dag</b> skulle samma rening göras på en C18-kolonn på en eftermiddag.' },
    struktur: { data: ['Summaformel C₁₆H₁₈N₂O₄S — molekylvikt 334.', 'Hydrolys ger tre aminosyror: cystein, valin och α-aminoadipinsyra.', 'NMR visar att byggstenarna inte sitter i en rak kedja utan är slutna till ringar.', 'En av ringarna är fyrledad och mycket spänd — så ovanlig att kemister till en början inte trodde på den.', 'Ämnet kristalliserar.'],
      fraga: 'Strukturen är så ovanlig att den ifrågasätts. Vilken metod avgör frågan definitivt?',
      val: ['Röntgenkristallografi', 'Ytterligare NMR', 'Mer hydrolys', 'Masspektrometri med högre upplösning'], ratt: 0,
      varforFel: [null,
        'NMR fanns inte. De första NMR-spektrometrarna för kemiskt bruk kom först på 1950-talet, och rutinmässig strukturbestämning med NMR är ännu senare. I dag vore NMR det självklara verktyget — 1945 var det inte uppfunnet.',
        'Hydrolys bryter isär molekylen och talar om vad den är <i>byggd av</i>. Det hade man redan gjort: tre aminosyror. Men hydrolys kan aldrig visa hur bitarna satt ihop, eftersom man förstör just de bindningar man vill veta något om. Mer av samma metod ger inget nytt svar.',
        'Massan var redan känd och gav summaformeln. Men summaformeln säger bara vilka atomer som ingår, inte hur de sitter ihop — och det var just uppställningen, den fyrledade ringen, som var omstridd. Högre upplösning hade gett samma formel med fler decimaler.'],
      varfor: 'Dorothy Hodgkin löste strukturen med röntgenkristallografi 1945 och bevisade att den fyrledade β-laktamringen verkligen fanns. Hon fick Nobelpriset 1964. Byggstenarna — tre aminosyror, varav en inte ens ingår i proteiner, slutna till ringar — visar samtidigt att ett NRPS-enzym byggde molekylen, inte ribosomen.' },
    utveckling: { data: ['Ämnet är ogiftigt för människa i höga doser.', 'Det finns i mycket små mängder i odlingen.', 'Det förstörs av magsyra, så det kan inte tas som tablett.', 'Molekylen är för komplicerad för att syntetiseras lönsamt.'],
      fraga: 'Vad gör du för att få ett användbart läkemedel?',
      val: ['Odlar i stor skala och renar fram naturprodukten — och ger den som injektion', 'Bygger en helt syntetisk kopia', 'Låter genmodifierad jäst tillverka ämnet', 'Ändrar molekylen kemiskt så att den tål magsyra'], ratt: 0,
      varforFel: [null,
        'Det försökte man, i åratal och med stora resurser. Molekylen har en fyrledad β-laktamring som ingen visste hur man byggde, och flera stereocentrum som måste bli rätt. Totalsyntesen lyckades först 1957 — och är än i dag alldeles för dyr för att användas industriellt. Jäsning vann, och har fortsatt vinna.',
        'Rekombinant teknik fanns inte ens som idé 1941; den kom på 1970-talet. Och den hade inte hjälpt här: penicillin är ingen peptid som en gen kan koda för, utan byggs av en hel rad enzym. Att flytta det maskineriet till jäst är svårt än i dag.',
        'Det kom senare, men inte på det sättet. Själva β-laktamringen <i>måste</i> vara spänd för att verka, så den går inte att stabilisera utan att förstöra effekten. Lösningen blev i stället att byta sidokedja: matar man odlingen med fenoxiättiksyra får man penicillin V, som tål magsyra. Men det låg flera år fram, och löste inte 1941 års problem — som var mängd.'],
      varfor: 'Jäsningen går att skala upp enormt, och att ämnet förstörs av magsyra löser man genom att injicera i stället. Senare hittades en elegant genväg: matar man odlingen med fenoxiättiksyra i stället för fenylättiksyra byter sidokedjan karaktär, och man får penicillin V — som tål magsyra och kan tas som tablett. Samma svamp, annan råvara i grytan.' }

{
  id: 'vankomycin', titel: 'Jordprovet från Borneo', ar: 1953, plats: 'Ett läkemedelsföretag i Indiana',
  ingress: 'Allt fler stafylokocker bildar enzymet β-laktamas, som bryter ner penicillinet. Patienter dör av infektioner som nyss gick att behandla. Ditt företag ber missionärer och resenärer världen över att skicka hem jordprover.',
  steg: {
    val: { data: ['På avdelningen dör patienter av infektioner som för fem år sedan gick att behandla på en vecka.', 'Odlingarna visar samma sak varje gång: stafylokocker som växer obehindrat även i hög penicillinhalt.', 'Ni har ingen lycklig observation att utgå från — bara ett problem som måste lösas.', 'Posten kommer in med små påsar jord från hela världen. Ett gram av den innehåller miljarder mikroorganismer som lever tätt ihop och konkurrerar om samma näring.'],
      fraga: 'Vad är det ekologiska skälet att leta just i jord?',
      val: ['Organismer som lever trångt måste försvara sig kemiskt, och bildar ämnen som hämmar andra', 'Jord är billigt att samla in', 'Jordbakterier är lättare att odla än andra', 'Jordbakterier är närmast släkt med de sjukdomsbakterier man vill döda'], ratt: 0,
      varforFel: [null,
        'Billigt är det, och det är ett verkligt skäl till att man orkar sålla tiotusentals prov. Men billigt förklarar inte varför man <i>hittar</i> något: man skulle kunna samla in havsvatten eller sand lika billigt. Det som gör jord speciell är trängseln — ett gram innehåller miljarder celler som konkurrerar om samma näring, och i den konkurrensen lönar det sig att kunna slå ut grannen kemiskt.',
        'De flesta jordbakterier är tvärtom notoriskt svåra att odla; än i dag kan man bara få fram en liten del av dem på ett labbmedium. Att <i>Streptomyces</i> går att odla är en lycklig omständighet som gjorde programmen möjliga, men det är inte skälet till att man letar där — det är trängseln och konkurrensen.',
        'De är snarare långt ifrån släkt, och det spelar ingen roll. Det man utnyttjar är inte släktskap utan fiendskap: jordorganismen bildar ämnet för att hämma sina grannar, och några av de grannarna råkar likna de bakterier som gör oss sjuka.'],
      varfor: 'Det är hela tankegången bakom Waksmans screeningprogram, och skälet till att de flesta antibiotika kommer från jordbakterier — särskilt <i>Streptomyces</i>. Men den avgörande detaljen i just det här fallet är vad ni testar <i>mot</i>. Ni odlar varje isolat och droppar odlingsvätskan på en platta med en <b>β-laktamasbildande</b> stafylokock — alltså just den stam som inte längre går att behandla — i stället för den känsliga standardstam som annars används. Det låter som en obetydlig ändring, men den avgör hela utfallet: mot en känslig stam hade hundratals penicillinliknande fynd lyst upp och dränkt det ni letade efter. Bioassayen bestämmer vad ni kan hitta, så den väljs efter problemet. Provet som till slut gav napp kom med posten från en missionär i Borneos djungel.' },
    extraktion: { data: ['Du har ett aktivt vattenextrakt från odlingen.', 'Du skakar det med hexan, med etylacetat och med butanol. Aktiviteten stannar i vattenfasen varje gång.', 'Att ändra pH hjälper inte heller: molekylen bär både sura och basiska grupper och är laddad i hela pH-intervallet.'],
      fraga: 'Inget lösningsmedel vill ta ämnet ur vattnet. Vad gör du i stället?',
      val: ['Binder ämnet till en adsorptionsresin och eluerar det därifrån', 'Provar ännu opolärare lösningsmedel', 'Kokar bort vattnet', 'Tillsätter mer salt så att ämnet tvingas över i det organiska skiktet'], ratt: 0,
      varforFel: [null,
        'Du går åt fel håll. Hexan är redan mycket opolärt, och det var det som gick sämst av allt. Ett laddat ämne löser sig i det som kan omge laddningen med något polärt — och ju opolärare lösningsmedlet är, desto mindre vill det ha med saken att göra. Hade ämnet varit lite för polärt för etylacetat kunde butanol ha räddat försöket; att även butanol misslyckas betyder att problemet är principiellt, inte en fråga om att finjustera.',
        'Då sitter du med allt kvar: ämnet, salterna, sockret och resten av näringslösningen, som ett intorkat brunt skikt i botten av kolven. Indunstning koncentrerar, den renar inte. Och värme är dessutom det sista man utsätter ett okänt naturämne för innan man vet om det tål det.',
        'Att salta ut är en riktig metod och tanken är inte dum — hög salthalt gör vattenfasen mindre gästvänlig och kan knuffa över gränsfall i det organiska skiktet. Men ditt ämne är inte ett gränsfall: det bär laddningar vid varje pH, och den laddningen försvinner inte för att du tillsätter salt. Du får en mättad saltlösning med ämnet kvar i sig.'],
      varfor: 'Vätske–vätskeextraktion bygger på att ämnet <i>föredrar</i> det ena skiktet. Ett ämne som är laddat vid alla pH — det bär både en aminogrupp och sura grupper, alltså en zwitterjon — kommer alltid att trivas bäst i vattnet, och då finns inget organiskt lösningsmedel som räddar situationen. Lösningen är att byta princip helt: i stället för att locka över ämnet till en annan fas låter du det fastna på ett fast material, sköljer bort allt som inte fastnade, och eluerar sedan loss det med något som bryter bindningen. På Lilly gjordes det på ett svagt surt katjonbytarresin, och det färdiga pulvret var brungrått av allt som följde med — personalen kallade det "Mississippi mud". Lägg märke till att misslyckandet i sig är information: att ämnet vägrar lämna vattnet säger dig redan nu att det är stort och polärt, och den upplysningen kommer tillbaka i sista steget, när du ska bestämma hur läkemedlet kan ges.' },
    kromatografi: { data: ['Ämnet är mycket polärt och bär både en aminogrupp och sura grupper — det är alltså laddat.', 'På kiselgel binder det så hårt att det knappt kommer ut igen.'],
      fraga: 'Vilken separationstyp utnyttjar laddningen som princip?',
      val: ['Jonbyte', 'Normalfas', 'Storleksexklusion', 'Vätske–vätskeextraktion med butanol'], ratt: 0,
      varforFel: [null,
        'Normalfas <i>är</i> kiselgel — polär stationärfas, opolär mobilfas. Det är precis den kolonn som nyss misslyckades, och av ett begripligt skäl: kiselgelens ytliga silanolgrupper är själva svagt sura, så en molekyl med en positivt laddad amin binder till dem jonbindande och vägrar släppa. Att köra samma kolonn en gång till löser inget; du måste byta princip.',
        'Storleksexklusion skiljer på storlek, inte på laddning, och molekylen är visserligen stor (1449). Men odlingsvätskan är full av stora molekyler — proteiner, polysackarider, cellrester — så storlek ensam plockar inte ut just din. Metoden är utmärkt som sista putsning, när det mesta annat redan är borta.',
        'Butanol är det mest vattentåliga av de vanliga organiska lösningsmedlen och exakt det man tar till för besvärligt polära ämnen. Men det provade du i förra steget, och aktiviteten stannade i vattenfasen. Att upprepa ett försök som redan svarat nej ger samma svar.'],
      varfor: 'Jonbytaren bär fasta laddningar och binder ämnen med motsatt laddning, medan oladdade ämnen sköljs rakt igenom. Just den egenskap som gjorde ämnet omöjligt att extrahera — att det alltid är laddat — blir här det som gör separationen möjlig. Eftersom molekylen är positivt laddad vid lågt pH fastnar den på en <b>katjonbytare</b>, och du eluerar den genom att höja salthalten (saltjonerna konkurrerar om platserna) eller genom att ändra pH så att laddningen försvinner. Det mönstret är värt att ta med sig: ett ämnes mest besvärliga egenskap är nästan alltid också det bästa greppet man har om det. <b>I dag</b> skulle man följa upp jonbytet med en omvänd fas-kolonn för att få bort de sista färgade orenheterna — de brunfärgade tidiga satserna var en del av förklaringen till läkemedlets dåliga rykte.' },
    struktur: { data: ['Molekylvikt 1449. Summaformeln innehåller två kloratomer.', 'Hydrolys ger sju aminosyror, varav flera ovanliga aromatiska byggstenar som inte finns i proteiner.', 'Sidokedjorna är tvärbundna till varandra, så molekylen bildar en styv skål.', 'Två sockerenheter sitter på skålen.'],
      fraga: 'Vilken ämnesklass, och hur byggde bakterien den?',
      val: ['En glykopeptid, byggd av ett NRPS-enzym', 'En polyketid, byggd av ett PKS-enzym', 'En ribosomal peptid, alltså genkodad', 'En aminoglykosid, byggd av sockerenheter'], ratt: 0,
      varforFel: [null,
        'En polyketid byggs av acetatenheter och syns som en kedja av kol med syre varannan eller var tredje position — laktonringar, kinoner, långa omättade kedjor. Hydrolysen hade då inte gett aminosyror alls. Att du får ut sju aminosyror är ett direkt bevis för att kedjan hålls ihop av amidbindningar, inte av en polyketidkedja.',
        'Nästan rätt, och det är den viktigaste av de felaktiga svaren att förstå. Peptid: ja. Men ribosomen kan bara använda de aminosyror som den genetiska koden har kodon för. Flera av dina byggstenar är klorerade aromater som inte finns i något protein, och de kan därför inte ha satts in av en ribosom. Dessutom är sidokedjorna tvärbundna till varandra — en efterbearbetning som inget ribosomalt maskineri gör på egen hand.',
        'Aminoglykosider är uppbyggda av sockerenheter med aminogrupper, hopkopplade med glykosidbindningar — streptomycin är exemplet. Din molekyl har mycket riktigt två socker på sig, men de sitter som <i>utsmyckning</i> på en kärna av aminosyror. Det är kärnan som bestämmer klassen, inte sockret.'],
      varfor: 'Aminosyror → peptid. Men ovanliga aromatiska byggstenar som inte finns i proteiner betyder att ribosomen inte kan ha gjort den: det måste vara ett NRPS-enzym, som kan plocka in vad som helst som sin kassett råkar vara byggd för. Sockerenheterna gör den till en glyko-peptid. Den styva skålformen är inte en detalj utan hela poängen: skålen passar exakt runt ändan <b>D-Ala-D-Ala</b> på de byggstenar som bakterien använder när den bygger sin cellvägg. Vankomycin hämmar alltså inte ett enzym, utan sätter sig på <i>substratet</i> och gör det oanvändbart — en helt annan angreppspunkt än penicillinets, och därför fungerar det på bakterier som bildar β-laktamas. Strukturen var så komplicerad att den inte var helt löst förrän på 1980-talet, med röntgenkristallografi och NMR — nästan trettio år efter att läkemedlet börjat användas.' },
    utveckling: { data: ['Molekylvikt 1449, nio OH-grupper och tre fria NH — mycket polärt.', 'Tumregel: ämnen som tas upp från tarmen ligger oftast under 500 och har en fettlöslig yta.', 'Ämnet skadar njurarna i höga doser.'],
      fraga: 'Hur ger du ämnet till en patient med en infektion i blodet?',
      val: ['Som infusion — det tas inte upp från tarmen', 'Som tablett', 'Som salva', 'Som tablett tillsammans med något som ökar upptaget'], ratt: 0,
      varforFel: [null,
        'Tabletten skulle vara bekväm, men ämnet skulle aldrig nå blodet. Molekylvikt 1449, nio OH-grupper och tre fria NH — det är långt bortom allt som passerar tarmväggen. Patienten har en infektion i <i>blodet</i>, och ett läkemedel som stannar i tarmen hjälper då inte alls. (Att ge det som tablett är däremot exakt rätt vid en helt annan sjukdom — se nedan.)',
        'En salva når bara huden, och där sitter inte infektionen. Molekylen är dessutom för stor och för polär för att ta sig genom hornlagret, som släpper igenom ungefär samma sorts molekyler som tarmväggen gör. Vid en infektion i blodet måste läkemedlet in i blodet.',
        'Absorptionsförstärkare finns och används, men de flyttar gränsen med någon tiopotens i bästa fall — de gör inte en molekyl på 1449 Da med laddningar i båda ändar tarmupptagbar. Och när patienten är svårt sjuk behöver du en förutsägbar koncentration i blodet genast, inte ett osäkert upptag. Det är precis därför infusionen aldrig har ersatts.'],
      varfor: 'För stort och för polärt för att passera tarmväggen — samma egenskap som gjorde extraktionen besvärlig styr alltså också hur läkemedlet måste ges. Eftersom halten i blodet då går att styra exakt, men ämnet samtidigt skadar njurarna i hög dos, mäter man koncentrationen i patientens blod och doserar efter den: vankomycin är ett av de få läkemedel där det görs rutinmässigt. Att de första årens preparat tolererades så illa berodde delvis på något helt annat än molekylen — satserna var bara omkring 70 % rena, och en god del av biverkningarna kom från det som följde med. Och begränsningen har en baksida som är en fördel: <i>som tablett</i> stannar allt kvar i tarmen i hög koncentration, och då botar det tarminfektion med <i>Clostridioides difficile</i>. Samma molekyl, samma egenskap — fel väg för den ena sjukdomen, precis rätt för den andra.' }
  },
  slutsats: 'Du har just följt upptäckten av <b>vankomycin</b> ur <i>Amycolatopsis orientalis</i>.',
  sub: 'vankomycin'
},
{
  id: 'ciklosporin', titel: 'Svampen som inte dödade svamp', ar: 1970, plats: 'Ett läkemedelsföretag i Basel',
  ingress: 'Företaget låter alla anställda ta med jordprover hem från sina semesterresor. Ur ett av proven växer en långsamväxande mögelsvamp fram. Ni testar den som alla andra: mot svamp.',
  steg: {
    val: { data: ['Plattorna med svamp ser likadana ut med och utan extrakt — knappt en antydan till hämning på ett par arter.', 'I protokollet står ett streck i kolumnen för aktivitet. Isolatet ska enligt reglerna kastas.', 'Odlingen är dessutom långsam och besvärlig: svampen tar veckor på sig där andra tar dagar.', 'I korridoren sitter ett annat program som letar efter ämnen som dämpar immunförsvaret, och de tar gärna emot extrakt att testa.'],
      fraga: 'Extraktet föll igenom testet det gjordes för. Vad säger det om extraktets övriga innehåll?',
      val: ['Ingenting alls — ett negativt resultat gäller bara just den bioassayen', 'Att extraktet är verkningslöst i allmänhet', 'Att svampen inte bildar några sekundärmetaboliter', 'Att extraktet behöver koncentreras innan det testas igen'], ratt: 0,
      varforFel: [null,
        'Det är den slutsats som slarvigt dras varje dag, och den är logiskt ohållbar. Testet frågade en enda sak: "dödar det här svamp?" Svaret nej säger ingenting om huruvida extraktet påverkar blodtryck, tumörceller eller vita blodkroppar — de frågorna ställdes aldrig. Ett extrakt innehåller dessutom hundratals ämnen; att inget av dem råkade vara svampdödande är ingen upplysning om de andra.',
        'Extraktet innehåller med säkerhet sekundärmetaboliter — det är därför det är intressant. Vad plattan visar är bara att inget av det som finns där råkar hämma just de svampar du testade mot. Att en organism saknar aktivitet i en bioassay betyder inte att den saknar kemi; det betyder att du inte ställt rätt fråga ännu.',
        'Koncentrering är en rimlig åtgärd när man ser en svag antydan till effekt och vill veta om den är verklig. Men den tar dig bara längs samma axel: du får veta mer exakt hur dålig svampdödaren är. Det som räddade det här isolatet var att någon ställde en <i>annan</i> fråga, inte att man ställde samma fråga högre.'],
      varfor: 'Bioassayen avgör vad du kan hitta — åt båda hållen. Den säger vad du hittar när den svarar ja, och den döljer allt annat när den svarar nej. I korridorens andra program hade man byggt upp en test där man mätte hur vita blodkroppar svarade på stimulering, och i den hämmade samma extrakt T-cellernas aktivering kraftigt — men utan att slå ut benmärgen, vilket var precis det som gjorde dåtidens immunhämmare så farliga. De var cellgifter som dödade allt som delade sig; det här ämnet gjorde något selektivt. Isolatet var redan avskrivet enligt protokollet och räddades av att det testades i något det aldrig var avsett för. Jorden det kom ur hade en anställd tagit med sig hem från en semesterresa till Hardangervidda i Norge.' },
    extraktion: { data: ['Du odlar upp svampen och extraherar materialet.', 'Du skakar extraktet med etylacetat och vatten i en skiljetratt.', 'Nästan all aktivitet följer med det organiska skiktet.', 'Ämnet är oladdat: det ändrar sig inte med pH.'],
      fraga: 'Vad säger det om molekylen?',
      val: ['Att den är fettlöslig — opolär nog att föredra det organiska skiktet', 'Att den är mycket polär', 'Att den är en syra', 'Att den är en bas'], ratt: 0,
      varforFel: [null,
        'Då hade den stannat i vattnet. Det är just det som är poängen med att skaka i en skiljetratt: molekylen röstar med fötterna. Ett mycket polärt ämne — som vankomycin i den andra berättelsen — går inte över i etylacetat hur mycket du än skakar. Din molekyl gjorde det, och nästan fullständigt.',
        'En syra skulle byta skikt när du ändrar pH: oladdad och fettlöslig i surt, laddad och vattenlöslig i basiskt. Det var precis så penicillinet renades. Ditt ämne beter sig likadant vid alla pH, vilket utesluter att det har en titrerbar sur grupp som betyder något för lösligheten.',
        'En bas beter sig som en syra fast tvärtom: laddad i surt, oladdad i basiskt — och skulle alltså också flytta sig när du ändrar pH. Att ingenting händer med pH är den avgörande upplysningen här, och den utesluter både syra och bas.'],
      varfor: 'Fördelningen mellan faserna är i sig en mätning av polaritet: ett ämne hamnar där det löser sig bäst. Att det går över i etylacetat och inte bryr sig om pH betyder fettlösligt och oladdat. Det är en användbar upplysning på två sätt. Dels styr den nästa steg — ett oladdat, fettlösligt ämne hör hemma på en kiselgelkolonn, inte på en jonbytare. Dels är den en första glimt av varför molekylen till slut blev användbar: fettlöslighet i skiljetratten och fettlöslighet i tarmväggen är samma egenskap mätt på två olika sätt. Lägg den på minnet; den återkommer i sista steget, där den visar sig vara det enda skälet till att en molekyl på 1202 Da över huvud taget går att ge i kapsel.' },
    kromatografi: { data: ['Ämnet är fettlösligt och oladdat.', 'Det är stabilt och tål vanliga organiska lösningsmedel.'],
      fraga: 'Vilken separationstyp passar bäst — och vad kommer ut först?',
      val: ['Normalfas på kiselgel; de opolära ämnena kommer ut först', 'Normalfas på kiselgel; de polära ämnena kommer ut först', 'Jonbyte; de laddade ämnena kommer ut först', 'Gelfiltration; de små molekylerna kommer ut först'], ratt: 0,
      varforFel: [null,
        'Rätt kolonn, fel ordning — och det är värt att reda ut, för det är den vanligaste förväxlingen i hela kromatografin. Kiselgel är en <i>polär</i> stationärfas. Polära ämnen fastnar hårdast på den och släpper sist. Det är omvänd fas (C18) som har det motsatta beteendet, eftersom stationärfasen där är opolär. Minnesregeln: det som liknar stationärfasen stannar kvar.',
        'Jonbyte kräver att ditt ämne är laddat, och du har just visat att det inte är det — det följde med etylacetatet och struntade i pH. På en jonbytare skulle molekylen rinna rakt igenom utan att hejdas, tillsammans med allt annat oladdat i extraktet. Ingen separation alls.',
        'Här är ordningen också fel: i gelfiltration vandrar <i>stora</i> molekyler fortast, eftersom de inte får plats inne i gelkornens porer och därför tar den korta vägen förbi. Små molekyler letar sig in i porerna och fördröjs. Metoden skiljer dessutom bara på storlek, vilket inte hjälper när orenheterna är av alla storlekar.'],
      varfor: 'På kiselgel är stationärfasen polär, så polära ämnen binder hårdast och sitter kvar längst — opolära spolas ut först. Man eluerar genom att successivt göra mobilfasen polärare, till exempel gå från ren hexan mot mer och mer etylacetat, och låter på så sätt ämnena lämna kolonnen i tur och ordning efter polaritet. Varje fraktion samlas upp och testas i bioassayen, för det är fortfarande aktiviteten som säger vilket rör som är intressant — man renar inte fram "ämnet", man följer effekten tills bara ett ämne är kvar. Att ett helt oladdat ämne hör hemma på kiselgel och inte på en jonbytare är samma slutsats som i förra steget, dragen en gång till: molekylens egenskaper bestämmer metoden, aldrig tvärtom. <b>I dag</b> skulle en omvänd fas-kolonn göra samma jobb snabbare, men principen — att välja fas efter polaritet — är densamma.' },
    struktur: { data: ['Molekylvikt 1202.', 'Hydrolys ger elva aminosyror.', 'En av dem är en D-aminosyra. Sju av de elva amidkvävena bär en metylgrupp i stället för ett väte.', 'Kedjan har varken fri aminoände eller fri karboxyände.', 'En byggsten är en aminosyra som inte finns någon annanstans i naturen.'],
      fraga: 'Vad säger D-aminosyran och de metylerade kvävena om hur ämnet byggdes?',
      val: ['Att ribosomen inte kan ha gjort det — det måste vara ett NRPS-enzym', 'Att det är genkodat som vanliga proteiner', 'Att det är en polyketid', 'Att aminosyrorna har ändrats kemiskt efter att ribosomen byggt kedjan'], ratt: 0,
      varforFel: [null,
        'Vore det genkodat på vanligt sätt skulle varje byggsten ha ett kodon, och den genetiska koden har kodon bara för de 20 vanliga L-aminosyrorna. Din molekyl innehåller en D-aminosyra och en byggsten som inte finns någon annanstans i naturen — för dem finns inget kodon att läsa. Redan en enda sådan byggsten räcker för att utesluta ribosomen.',
        'En polyketid byggs av acetatenheter, och hydrolys av en sådan ger inte aminosyror. Du fick elva. Amidbindningarna mellan dem är det avgörande beviset: det här är en peptid, frågan är bara vem som satte ihop den.',
        'Det är det klurigaste alternativet, för efterbearbetning av ribosomala peptider förekommer verkligen — det finns en hel klass som kallas RiPP, där ribosomen gör en vanlig kedja som enzym sedan bygger om. Men en sådan ombyggnad lämnar spår av den ursprungliga sekvensen, och framför allt: den byggsten som inte finns någon annanstans i naturen skulle behöva tillverkas <i>på plats i kedjan</i>, vilket ingen känd efterbearbetning gör. Enklaste förklaringen är att ett NRPS-enzym plockade in färdiga, ovanliga byggstenar från början.'],
      varfor: 'Ribosomen kan bara foga ihop de 20 vanliga L-aminosyrorna, i den ordning kodonen säger. D-former, N-metylerade amidkväven och helt egna byggstenar är fingeravtryck från icke-ribosomal syntes: ett NRPS-enzym är en löpande band där varje modul har sin egen aminosyra och kan metylera eller vända den som den vill. Att kedjan saknar både fri aminoände och fri karboxyände betyder dessutom att den är sluten till en ring — sista modulen knöt ihop den. Två av fynden är värda att lägga på minnet, för de återkommer: de sju metylerade kvävena är sju NH-grupper som <i>inte</i> finns, alltså sju ställen som inte kan binda vatten, och ringen gör molekylen styv. Tillsammans ger de en stor molekyl med påfallande fettlöslig utsida. Hur den verkar visade sig först långt senare: ciklosporin binder ett protein som heter cyklofilin, och det paret blockerar i sin tur enzymet kalcineurin, varpå T-cellen inte kan sätta igång sin signal. Alltså ingen cellgiftsverkan alls, utan en avstängd signalväg — förklaringen till att benmärgen klarar sig.' },
    utveckling: { data: ['Molekylvikt 1202 — långt över gränsen för ämnen som tas upp från tarmen.', 'Men ämnet löser sig lätt i olja, och de sju metylerade kvävena kan inte binda vatten.', 'I försök tas det faktiskt upp från tarmen.'],
      fraga: 'Varför tas den här stora molekylen upp, när vankomycin med nästan samma storlek inte gör det?',
      val: ['Den har få polära grupper på ytan och kan vika sig med en fettlöslig utsida', 'Den är mindre än vankomycin', 'Den bryts ner till aminosyror som tas upp var för sig', 'Ringformen gör att den kan passera tarmväggen i en egen transportör'], ratt: 0,
      varforFel: [null,
        'Skillnaden i storlek är försumbar: 1202 mot 1449. Båda ligger långt över den tumregel på omkring 500 som brukar anges, så om molekylvikten vore det som avgjorde skulle ingen av dem tas upp. Att den ena gör det och den andra inte visar just att vikten inte är hela sanningen — det är ytan som räknas.',
        'Då skulle läkemedlet inte fungera, för det är den hela, hopvikta ringen som binder cyklofilin. Elva lösa aminosyror är bara näring. Dessutom är ringen svår att bryta ner: den har ingen ände för tarmens peptidaser att börja i, och de N-metylerade amidbindningarna känner de knappt igen. Att molekylen överlever magsäcken är en del av förklaringen till att den fungerar i kapsel.',
        'Det finns transportörer i tarmväggen som tar upp småpeptider, men de hanterar di- och tripeptider — inte en ring med elva byggstenar. Upptaget här är passivt: molekylen löser sig helt enkelt i cellmembranets fettfas och tar sig igenom. Därför är upptaget också känsligt för hur den är formulerad.'],
      varfor: 'Det är den polära ytan, inte molekylvikten i sig, som avgör upptaget — exakt samma egenskap som avgjorde vilket skikt ämnet hamnade i vid extraktionen. De sju N-metylerade kvävena tar bort NH-grupper som annars skulle binda vatten, och ringen kan dessutom vika sig så att de kvarvarande polära grupperna vänds inåt och fettet utåt. Molekylen bär bokstavligen sin egen regnrock. Därför kunde ämnet användas som naturprodukt, utan en enda kemisk ändring — men inte utan arbete: de första åren gavs det löst i olivolja med etanol, och upptaget varierade kraftigt mellan patienter och med vad de ätit. Det var ett verkligt problem när skillnaden mellan för lite (avstötning) och för mycket (njurskada) är liten, och löstes först på 1990-talet med en mikroemulsion som gav jämnare upptag. Att projektet över huvud taget nådde dit var länge osäkert — det var nära att läggas ned när bolaget tvivlade på att en så stor molekyl kunde tas upp alls. Resultatet blev att organtransplantation gick från experiment till rutin.' }
  },
  slutsats: 'Du har just följt upptäckten av <b>ciklosporin</b> ur <i>Tolypocladium inflatum</i>.',
  sub: 'ciklosporin'
},
{
  id: 'captopril', titel: 'Arbetarna som föll ihop', ar: 1965, plats: 'Plantager i sydöstra Brasilien',
  ingress: 'Arbetare som blir bitna av en viss groporm faller ihop av kraftigt blodtrycksfall — långt kraftigare än blodförlusten kan förklara.',
  steg: {
    val: { data: ['Sjuksköterskorna beskriver samma sak varje gång: patienten kommer in blek och kallsvettig, pulsen rusar, blodtrycket sjunker inom minuter.', 'Bettsåret är litet och blöder måttligt — blodförlusten räcker inte alls för att förklara trycket.', 'Det händer alla bitna, oavsett ålder och kondition, och det går alltid åt samma håll.', 'Ormen är lätt att känna igen, lever nära plantagerna och går att mjölka på gift om och om igen.'],
      fraga: 'Vad gör den här observationen till en bra utgångspunkt?',
      val: ['Den är tydlig, återkommande och pekar mot ett bestämt fysiologiskt system', 'Att ormen är giftig', 'Att det rör sig om ett djur och inte en växt', 'Att giftet verkar snabbt och därför måste vara en liten molekyl'], ratt: 0,
      varforFel: [null,
        'Att något är giftigt betyder bara att det gör skada, och det gör tusentals ämnen utan att något av dem blir läkemedel. Det som är intressant här är inte att giftet skadar, utan att det skadar på ett <i>bestämt och förutsägbart sätt</i> — alltid blodtrycket, alltid åt samma håll, alltid lika snabbt. Ospecifik giftighet pekar ingenstans; specifik giftighet pekar mot ett system.',
        'Varifrån ämnet kommer spelar ingen roll för om observationen duger. En lika tydlig och upprepbar effekt hos en växt, en svamp eller en bakterie vore precis lika användbar. Det som gör ormgift till ett tacksamt material är något annat och mer praktiskt: giftet är redan koncentrerat, och samma orm kan mjölkas om och om igen.',
        'Snabbhet säger faktiskt något — ämnet måste nå sitt mål utan att först behöva tas upp och omvandlas — men den säger ingenting om storleken. Stora proteiner kan verka på sekunder när de kommer direkt ut i blodet. Och här blev slutsatsen tvärtom: det verksamma visade sig vara en peptid, alltså inte en liten molekyl i vanlig mening.'],
      varfor: 'En klinisk observation som upprepar sig hos alla drabbade är nästan lika bra som ett färdigt bioassay: den säger både att det finns något aktivt och ungefär vad det gör. Tre saker gör den användbar. Den är <b>återkommande</b>, så den går att lita på. Den är <b>specifik</b> — det är blodtrycket som faller, inte allmänt elände — så du vet vilket system du ska titta på. Och den är <b>mätbar</b>: blodtryck går att mäta i djurförsök, vilket betyder att du kan bygga en modell i labbet att testa varje fraktion i. Utan den sista punkten står du still, hur spännande observationen än är. Det var den brasilianske forskaren Sérgio Ferreira som tog observationen på allvar, visade att giftet förstärker verkan av kroppens egna blodtryckssänkande ämnen, och tog med sig ett extrakt till ett laboratorium i London — där det visade sig hämma ett enzym som ingen dittills haft något grepp om.' },
    extraktion: { data: ['Giftet är redan en vattenlösning av peptider och proteiner.', 'Du provar ändå att skaka det med etylacetat.', 'Ingenting av aktiviteten följer med det organiska skiktet.', 'Organiska lösningsmedel och värme får dessutom peptider att denaturera.'],
      fraga: 'Varför följer ingenting med det organiska skiktet?',
      val: ['Peptider är polära och laddade och föredrar alltid vattenfasen', 'Etylacetat är för polärt', 'Giftet är för utspätt', 'Peptiderna är för små för att fördela sig mellan två faser'], ratt: 0,
      varforFel: [null,
        'Etylacetat ligger mitt på skalan och är ett av de mest användbara extraktionsmedlen just därför — det tar både ganska opolära och måttligt polära ämnen. Vore det för polärt skulle ett ännu opolärare lösningsmedel som hexan fungera bättre, och det gör det inte alls här. Problemet sitter i molekylen, inte i lösningsmedlet.',
        'Utspädning påverkar hur mycket du får ut, men inte <i>åt vilket håll</i> ämnet fördelar sig. Fördelningen mellan två faser är en kvot som är densamma vid hög och låg koncentration. Dessutom är ormgift raka motsatsen till utspätt: det är ett av de mest koncentrerade biologiska material man kan få tag i.',
        'Storleken hindrar inte fördelning — små molekyler fördelar sig utmärkt mellan faser, det är hela grunden för metoden. Det som avgör är löslighet, inte storlek. Här är sidokedjornas laddningar och alla vätebindande amidgrupper skälet till att peptiderna stannar där vattnet är.'],
      varfor: 'Peptider bär laddade sidokedjor och många vätebindande grupper — de löser sig i vatten, inte i organiska lösningsmedel, och det gäller oavsett vilket lösningsmedel du provar. Men lägg märke till att frågan egentligen är felställd i det här fallet, och det är poängen med steget: <b>här finns inget extraktionsproblem att lösa.</b> Ämnena är redan i vattenlösning, färdiga att arbeta med. Hela den verktygslåda som penicillinberättelsen handlade om — pH-växlingar, skiljetrattar, val av organiskt lösningsmedel — är oanvändbar och onödig. Problemet är ett helt annat: att <i>inte förstöra</i> det du har. Organiska lösningsmedel, värme och ytterlighets-pH får proteiner att vecklas ut och tappa sin funktion, och tarmens och vävnadens egna enzym börjar klyva peptider så fort de får chansen. Därför sker allt kallt, i buffert, med proteashämmare i lösningen — och separationen, inte extraktionen, får göra hela jobbet. Det här är den återkommande skillnaden mellan djurspåret och mikrobspåret i modulen.' },
