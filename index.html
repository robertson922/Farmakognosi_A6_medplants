      <p>Det gör arbetsordningen självklar — först bli av med allt som har helt fel storlek, sedan finsortera bland det som är kvar.</p>`,
    struktur: `<p>Den aktiva peptiden är 39 aminosyror lång, och alla är vanliga L-aminosyror. Inga D-former, inga metylerade kväven — det här är ribosomalt byggt, genkodat i ödlan.</p>
      <p>Du gör något du inte kunnat göra med de andra ämnena: du jämför sekvensen med kända mänskliga hormoner.</p>
      <p>Och träffen är slående. Ungefär hälften av positionerna är <b>identiska</b> med människans tarmhormon GLP-1 — ett hormon som också frisätter insulin.</p>
      <p>Men en position sticker ut. I position 2 sitter glycin, där människans GLP-1 har alanin. Och du vet att enzymet DPP-4 klipper människans GLP-1 just där, inom ett par minuter.</p>`,
    utveckling: `<p>Du har en peptid som gör samma sak som ett av kroppens egna hormoner, men som står emot enzymet som annars bryter ner det på minuter.</p>
      <p>Problemet är mängden. Det finns försvinnande lite av den i ödlans saliv, och att hålla ödlor i industriell skala är inte en plan.</p>
      <p>Men peptiden har en egenskap som de flesta av kursens molekyler saknar: den är en rak kedja av helt vanliga aminosyror, utan ringar och utan ovanliga byggstenar.</p>`
  },
  lovastatin: {
    val: `<p>Du är Akira Endo, och du har läst om Fleming.</p>
      <p>Det som fastnat hos dig är själva tanken: mögelsvampar tillverkar ämnen för att slå ut sina konkurrenter. Om de kan slå ut bakteriers cellväggsbygge — varför inte något annat livsviktigt?</p>
      <p>Du arbetar med kolesterol. Du vet att kroppen bygger det i ett tjugotal steg, och att ett enda enzym styr takten: HMG-CoA-reduktas. Du vet också att många svampar själva behöver steroler.</p>
      <p>Alltså borde det finnas mögelsvampar som tillverkar hämmare av just det enzymet, för att skada konkurrenter som behöver steroler.</p>

    extraktion: `<p>Du odlar upp svampen och extraherar materialet.</p>

    kromatografi: `<p>Efter kolonnen har du ett extrakt som är aktivt och nästan rent — men bara nästan. Analysen visar spår av närbesläktade ämnen från odlingen.</p>

    struktur: `<p>Massan är 404, och molekylen innehåller inget kväve alls.</p>
      <p>NMR visar två hopsmälta sexringar med metylgrupper på, en kort esterkedja, och laktonringen du redan känner till. Kolkedjan är byggd av enheter om två kol.</p>
      <p>Och så ser du något som får dig att stanna upp. En del av molekylen liknar påfallande HMG-CoA — enzymets eget substrat.</p>

    utveckling: `<p>Ämnet sänker kolesterolet kraftigt, tolereras väl, och går att odla fram i stor skala.</p>
      <p>Men ni vill längre. Ju mer potent ämnet är, desto lägre dos — och desto mindre risk för biverkningar.</p>

      <p>Resten av molekylen — det fyrringade skelettet med alla sina stereocentrum — är det ingen som vill försöka bygga från grunden.</p>`

  sirolimus: {
    val: `<p>En expedition har varit på Påskön mitt i Stilla havet, för att dokumentera öns natur innan en ny flygplats anläggs. Med hem kommer jordprover.</p>
      <p>Ur ett av dem odlar ni fram en trådformig jordbakterie, och testar den i ert program för nya svampmedel. Den hämmar candidasvamp kraftigt. Ett lyckat fynd.</p>
      <p>Men i djurförsöken visar det sig att ämnet också dämpar immunförsvaret. För ett svampmedel är det en allvarlig biverkning, och entusiasmen svalnar.</p>

    utveckling: `<p>Ämnet plockas upp ur frysen över tio år senare, nu som immunhämmare, och visar sig förhindra avstötning efter transplantation.</p>
      <p>Men det har också en annan egenskap: det bromsar celldelning i kärlväggar.</p>
      <p>Och det finns ett problem i sjukvården som handlar om precis det. Kranskärl som vidgats med ballong växer ofta igen inifrån, och patienten är tillbaka på samma bord efter några månader.</p>
      <p>Ämnet tas upp dåligt och ojämnt från tarmen. Men det går att binda till ytan på det lilla metallnät som placeras i kärlet.</p>`

  amfotericinB: {
    val: `<p>På sjukhusavdelningarna dör patienter med nedsatt immunförsvar av svampinfektioner i blod och inre organ.</p>
      <p>Mot bakterier finns nu penicillin och streptomycin. Mot invasiv svampinfektion finns ingenting alls.</p>
      <p>Och du förstår varför det är så svårt. En bakterie är en helt annan sorts cell än våra: den har cellvägg, en annan sorts ribosom, ett annat RNA-polymeras. Där finns gott om skillnader att utnyttja.</p>
      <p>En svampcell är däremot en eukaryot cell, precis som våra egna, med cellkärna och i stort sett samma maskineri. Det mesta som dödar en svampcell dödar också en mänsklig.</p>

      <p>Först i metanol, och sedan i dimetylsulfoxid, får du ämnet ordentligt i lösning.</p>
      <p>Ett ämne som varken trivs i vatten eller i organiskt lösningsmedel är ovanligt. Det säger något om hur molekylen måste se ut.</p>`,
    kromatografi: `<p>Att ämnet knappt löser sig i något begränsar vilka system du kan köra, och det tål dessutom varken ljus eller syre särskilt väl.</p>
      <p>Innan du sätter igång mäter du UV-spektrum — en snabb mätning som brukar ge något.</p>
      <p>Och den här gången ger den mycket. Du får inte en bred, slät kurva, utan en serie <b>mycket skarpa toppar</b> tätt intill varandra.</p>`,
    struktur: `<p>Massan är 924. Molekylen innehåller en kväveatom.</p>
      <p>NMR bekräftar vad UV-spektrumet antydde: sju konjugerade dubbelbindningar i rad, på ena sidan av molekylen.</p>

    utveckling: `<p>Ämnet botar livshotande svampinfektioner. Det finns inget alternativ, så det används.</p>

      <p>Du försöker tänka ut en kemisk förbättring, och kör fast. Skillnaden mellan ergosterol och kolesterol är liten, och molekylen behöver sin exakta form — den opolära sidan mot membranets fettsvansar, OH-grupperna inåt — för att fungera alls.</p>
      <p>Men det visar sig att ämnet går att kapsla in i små fettblåsor.</p>`

  doxorubicin: {

  insulin: {
    val: `<p>Du står på en barnavdelning i Toronto. I sängarna ligger barn med diabetes, flera av dem i koma.</p>

      <p>Hormonet du letar efter visar sig tåla den behandlingen bättre än enzymerna gör. Och alkoholen fäller dessutom ut en stor del av de övriga proteinerna.</p>`,
    kromatografi: `<p>Det är 1921. Kolonnkromatografi som vi känner den finns inte ännu — ingen kiselgel, ingen C18, inga jonbytare att köpa.</p>
      <p>Men du vet något om proteiner. De bär laddning, och laddningen varierar med pH, eftersom sidokedjorna kan ta upp och avge protoner.</p>

      <p>Och det är laddningen som håller proteinmolekylerna isär i lösningen.</p>`,
    struktur: `<p>Hormonet är ett protein, men ett ovanligt litet: 51 aminosyror.</p>
      <p>Det består av <b>två</b> kedjor, en kort med 21 aminosyror och en längre med 30, som hålls ihop av svavelbryggor mellan cysteiner.</p>

    utveckling: `<p>Insulinet räddar liv från första året. Men varje dos kommer ur slaktade djur: det krävs omkring två ton bukspottkörtel för ett kilo insulin.</p>
      <p>Antalet diabetiker ökar, och tillgången hänger på slakterierna.</p>
      <p>Dessutom är grisens och nötkreaturets insulin inte riktigt vårt. Det skiljer sig på någon enstaka aminosyra, och en del patienter bildar antikroppar mot det.</p>
      <p>I slutet av 1970-talet kommer något nytt: det går nu att föra in en mänsklig gen i en bakterie och låta bakterien tillverka proteinet åt oss.</p>`
  }

const molDiv = (sid, cls = '') => `<div class="mol wait ${cls}" data-sid="${sid}" role="img" aria-label="Kemisk struktur"></div>`;
function molSVG(sid) {
  if (svgCache[sid]) return svgCache[sid];
  const mol = RDK.get_mol(STRUKT[sid].smiles);
  if (!mol) return '<span class="mol-err">Strukturen kunde inte ritas.</span>';
  /* `justera` lays this molecule out like another one, so that two närbesläktade strukturer
     kan jämföras direkt — skillnaden syns i stället för att drunkna i olika ritsätt.
     Both the template and the aligned molecule must get their coordinates from CoordGen
     here (set_new_coords): if the template is left to the drawer's own layout it comes out
     rotated, and then the "aligned" molecule does not match it. */
  const mall = STRUKT[sid].justera && STRUKT[STRUKT[sid].justera];
  const karna = STRUKT[sid].karna;
  const arMall = Object.values(STRUKT).some(x => x.justera === sid);
  if (mall || karna || arMall) try { mol.set_new_coords(true); } catch (e) {}
  if (mall || karna) {
    let ref = null;
    try {
      // `karna` is a shared core (SMILES read as a query, so H counts are ignored and both
      // members of the class match it); `justera` is another structure used whole as template.
      ref = karna ? RDK.get_qmol(karna) : RDK.get_mol(mall.smiles);
      ref.set_new_coords(true);
      mol.generate_aligned_coords(ref, JSON.stringify({ useCoordGen: true, acceptFailure: true, alignOnly: false }));
    } catch (e) { /* alignment is a nicety: fall back to the normal layout */ }
    if (ref) ref.delete();
  }
  const big = mol.get_num_atoms() > 45;
  const svg = mol.get_svg_with_highlights(JSON.stringify({
    width: big ? 1000 : 600, height: big ? 750 : 450,
    bondLineWidth: 4.5, scaleBondWidth: true, multipleBondOffset: 0.18, additionalAtomLabelPadding: 0.066,
    baseFontSize: 0.6, maxFontSize: 200, addChiralHs: false,
    atomColourPalette: { "-1": [0,0,0], "1": [0,0,0], "6": [0,0,0], "7": [0,0,0], "8": [0,0,0], "16": [0,0,0], "17": [0,0,0] }
  }));
  mol.delete();
  return (svgCache[sid] = svg);
}
function fillMols() {
  if (!RDK && !rdkFailed) return;
  document.querySelectorAll('.mol.wait').forEach(d => {
    d.classList.remove('wait');
    d.innerHTML = RDK ? molSVG(d.dataset.sid) : '<span class="mol-err">Strukturen kunde inte ritas. Kontrollera internetanslutningen och ladda om sidan.</span>';
  });
}
new MutationObserver(fillMols).observe(document.body, { childList: true, subtree: true });
function startRDKit() {
  if (typeof window.initRDKitModule === 'undefined') { rdkFailed = true; fillMols(); return; }
  window.initRDKitModule().then(r => { RDK = r; try { r.prefer_coordgen(true); } catch (e) {} fillMols(); })
    .catch(err => { console.error(err); rdkFailed = true; fillMols(); });
}

  L: 'leucin', K: 'lysin', M: 'metionin', F: 'fenylalanin', P: 'prolin', S: 'serin', T: 'treonin', W: 'tryptofan', Y: 'tyrosin', V: 'valin' };
const beadTyp = r => r.length > 1 ? 'ovr' : r === 'C' ? 'cys' : 'DE'.includes(r) ? 'sur' : 'KRH'.includes(r) ? 'bas' : 'STNQY'.includes(r) ? 'pol' : 'GP'.includes(r) ? 'gp' : 'hyd';
const beadTitel = (r, s) => (s.sekvens.forkl && s.sekvens.forkl[r]) || AA_NAMN[r] || r;
const LEGEND = `<div class="legend"><span><span class="bead hyd"></span>opolär</span><span><span class="bead pol"></span>polär</span><span><span class="bead sur"></span>sur (−)</span>
  <span><span class="bead bas"></span>basisk (+)</span><span><span class="bead cys"></span>cystein (kan bilda S–S-brygga)</span><span><span class="bead gp"></span>glycin, prolin</span><span><span class="bead ovr"></span>ovanlig byggsten</span></div>`;
const pepName = s => s.sekvens.namn || s.namn;
// visa = show the name, notes and legend (not in quiz questions, where the name is the answer)
function seqHTML(s, visa = true) {
  const q = s.sekvens, r = q.rester, many = r.length > 12;

    ${visa && q.not ? `<div class="pep-not">${q.not}</div>` : ''}${visa ? LEGEND : ''}</div>`;
}

/* ---------- typed Latin names: must be exact ---------- */
function checkLatin(raw, s) {
  const typed = raw.trim().replace(/\s+/g, ' ');
  const accepted = [s.latin, ...(s.latinAlt || [])];
  if (accepted.includes(typed)) return { ok: true, typed };
  let hint = '';
  const [g, a] = s.latin.split(' '), parts = typed.split(' ');
  if (!typed) hint = 'Du skrev inget.';
  else if (accepted.some(x => x.toLowerCase() === typed.toLowerCase())) hint = 'Rätt stavat, men kontrollera stora och små bokstäver: släktnamnet börjar med stor bokstav, artnamnet skrivs helt med små bokstäver.';
  else if (parts.length < 2) hint = 'Skriv både släktnamn och artnamn.';
  else if (parts[0] === g) hint = 'Släktnamnet är rätt, men artnamnet stämmer inte.';
  else if (parts[1] === a) hint = 'Artnamnet är rätt, men släktnamnet stämmer inte.';
  return { ok: false, typed, hint };
}
const typeFormHTML = () => `<p class="rule">Skriv det latinska namnet exakt: släktnamn med stor bokstav, artnamn med små bokstäver, rätt stavat.</p>
  <form class="typeform" id="tform" autocomplete="off">
    <input class="answer-input" id="tinput" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="done" placeholder="Släktnamn artnamn" aria-label="Latinskt namn">
    <button class="btn btn-main" type="submit">Svara</button>
  </form>`;
function wireTypeForm(onAnswer) {
  const input = $('#tinput');
  if (matchMedia('(pointer: fine)').matches) input.focus({ preventScroll: true });   // desktop only: on phones the keyboard would hide the question
  $('#tform').addEventListener('submit', e => {
    e.preventDefault();
    if (input.readOnly) return;
    if (!input.value.trim()) { input.focus(); return; }
    input.readOnly = true; $('#tform button').disabled = true;
    onAnswer(input);
  });
}
// a wrong typed name that is another organism in the course: say what comes from it
function otherOrgInfo(typed, s) {
  const t = typed.toLowerCase();
  const o = ORGS().find(v => v.latin !== s.latin && [v.latin, ...(v.latinAlt || [])].some(n => n.toLowerCase() === t));
  return o ? `<br><i>${o.latin}</i> finns också i kursen: den är källan till ${subsFromOrg(o.latin).map(x => x.namn).join(', ')}.` : '';
}
function typedFeedbackHTML(res, s) {
  return res.ok
    ? `<div class="feedback ok">✅ Rätt! ${res.typed !== s.latin ? `<i>${esc(res.typed)}</i> godkänns som synonym till <i>${s.latin}</i>.` : `<i>${s.latin}</i>`}
         <div class="more">Läs mer: ${subLink(s)}</div></div>`
    : `<div class="feedback bad">❌ Inte riktigt. Rätt svar: <i>${s.latin}</i> (${s.sv})
         <div class="more">Du skrev: <i>${esc(res.typed)}</i>${res.hint ? '<br>' + res.hint : ''}${otherOrgInfo(res.typed, s)}</div>
         <div class="more">Läs mer: ${subLink(s)}</div></div>`;
}

/* ---------- organism photos (fact pages only, never in the quiz) ----------
   BILDER is keyed by the organism's Latin name and defined at the bottom of the page.
   slakte: true marks a photo of another species in the same genus (the exact species has no
   free photo); the caption then says so, so no one takes it for the species itself. */
const bildOf = s => (typeof BILDER !== 'undefined' && BILDER[s.latin]) || null;
const creditHTML = b => `${b.text ? `<span class="ptext">${b.text}</span>` : ''}${b.slakte ? `<span class="slakte">⚠ Bilden visar ${b.slakte}, en annan art i samma släkte: av den här arten finns ingen fri bild. Använd den för att se hur släktet ser ut, inte som bild på arten.</span>` : ''}Foto: ${b.foto}, <a href="${b.kalla}" target="_blank" rel="noopener">${b.licens}</a>, via ${b.kallaNamn || 'Wikimedia Commons'}`;
function photoHTML(s) {
  const b = bildOf(s);
  if (!b) return '';
  // a photo kept as a separate file (see BILDER at the bottom) simply disappears if the file isn't there,
  // so the page looks right whether or not the img/ folder has been filled in
  // No loading="lazy": the pictures are embedded in this file, so lazy loading saves nothing and
  // only risks leaving a blank space. A picture kept as a separate file instead disappears if it is missing.
  const fil = !b.src.startsWith('data:');
  return `<div class="fotoblock"><img class="photo" src="${b.src}" alt="Foto av ${b.slakte || s.latin}"${fil ? ` onerror="this.closest('.fotoblock').remove()"` : ''}><div class="credit">${creditHTML(b)}</div></div>`;
}

/* One deck: structure and sequence cards. The cards are ordered by substance class, so
   besläktade ämnen (penicillinerna, ergotalkaloiderna, statinerna …) kommer direkt efter
   varandra — och på baksidan visas syskonen bredvid varandra att jämföra med. */
const famSyskon = s => s.fam ? SUBSTANSER.filter(o => o.fam === s.fam && o.id !== s.id) : [];
const subAvKort = k => { const [typ, id] = k.split(':'); return typ === 's' ? byId(STRUKT[id].sub) : byId(id); };
const bildKort = () => {
  const alla = [...STRUKTURER.map(x => 's:' + x.id), ...SUBSTANSER.filter(s => s.sekvens).map(s => 'p:' + s.id)];
  // sort by class, then by substance, so related structures sit next to each other
  const famOrdning = [...new Set(SUBSTANSER.map(s => s.fam || s.id))];
  const subOrdning = SUBSTANSER.map(s => s.id);
  return alla.sort((a, b) => {
    const sa = subAvKort(a), sb = subAvKort(b);
    return famOrdning.indexOf(sa.fam || sa.id) - famOrdning.indexOf(sb.fam || sb.id)
        || subOrdning.indexOf(sa.id) - subOrdning.indexOf(sb.id);
  });
};
const KORTLEKAR = {
  bild: { key: 'knownB', ids: bildKort, enhet: 'kort' }
};
let kort = { mode: 'bild', deck: [], i: 0, flipped: false };
/* Shuffle the CLASSES, not the cards: the order is new every time, but the members of a
   substance class still come one after another, which is what makes them comparable. */
function blandaKlassvis(ids) {
  const grupper = new Map();
  ids.forEach(id => {
    const s = subAvKort(id), nyckel = s.fam || s.id;
    if (!grupper.has(nyckel)) grupper.set(nyckel, []);
    grupper.get(nyckel).push(id);
  });
  return shuffle([...grupper.keys()]).flatMap(k => grupper.get(k));
}
function startKort(onlyUnknown, mode = kort.mode) {
  const L = KORTLEKAR[mode], known = store.get(L.key, []);
  let ids = L.ids();
  if (onlyUnknown) ids = ids.filter(id => !known.includes(id));
  kort = { mode, deck: blandaKlassvis(ids), i: 0, flipped: false };
  renderKort();
}
function viewKort() {
  const deckCard = (mode, titel, text) => {
    const L = KORTLEKAR[mode], known = store.get(L.key, []).filter(id => L.ids().includes(id)), n = L.ids().length;
    return `<div class="card" style="margin-bottom:.8rem">
      <h2>${titel}</h2><p>${text}</p>
      <div class="progress"><div style="width:${n ? known.length / n * 100 : 0}%"></div></div>
      <p class="small muted">Du kan ${known.length} av ${n} ${L.enhet}.</p>
      <div class="btn-row">
        <button class="btn btn-main" onclick="startKort(true,'${mode}')" ${known.length === n ? 'disabled' : ''}>▶ Öva på dem jag inte kan (${n - known.length})</button>
        <button class="btn" onclick="startKort(false,'${mode}')">🔀 Alla ${n} kort</button>
        ${known.length ? `<button class="btn" onclick="if(confirm('Nollställa de här korten?')){store.set('${L.key}',[]);viewKort()}">↺ Börja om från noll</button>` : ''}
      </div></div>`;
  };
  app.innerHTML =
    deckCard('bild', '⌬ Struktur- och sekvenskort', 'Du ser en kemisk struktur eller en aminosyrasekvens. Vad heter substansen, och vilken organism kommer den från? Vänd sedan kortet och var ärlig: kunde du det?') +
    `<p class="small muted">Korten kommer klassvis: penicillinerna efter varandra, ergotalkaloiderna efter varandra, och så vidare. På baksidan ser du de besläktade ämnena bredvid varandra, så att du kan jämföra dem.</p>`;
}
function renderKort() {
  const L = KORTLEKAR[kort.mode];
  if (kort.i >= kort.deck.length) {
    const known = store.get(L.key, []).filter(id => L.ids().includes(id)), n = L.ids().length;
    app.innerHTML = `<div class="card" style="text-align:center"><h2>Klart! 🎉</h2><p>Du har gått igenom alla kort i högen.</p><p class="score">${known.length} / ${n}</p><p class="muted">${L.enhet} som du kan</p>
      <div class="btn-row"><button class="btn btn-main" onclick="startKort(true)" ${known.length === n ? 'disabled' : ''}>▶ Öva på dem jag inte kan</button><button class="btn" onclick="viewKort()">Tillbaka</button></div></div>`;
    return;
  }
  const head = `<p class="small muted">Kort ${kort.i + 1} av ${kort.deck.length}</p><div class="progress"><div style="width:${kort.i / kort.deck.length * 100}%"></div></div>`;
  const svar = `<div class="btn-row"><button class="btn" onclick="markKort(false)">🔁 Öva mer</button><button class="btn btn-main" onclick="markKort(true)">😊 Jag kunde det</button></div>`;
  const vand = `<div class="btn-row" style="margin-top:auto"><button class="btn btn-main" onclick="kort.flipped=true;renderKort()">🔄 Vänd kortet</button></div>`;
  if (kort.mode === 'bild') {
    const [typ, id] = kort.deck[kort.i].split(':');
    const s = typ === 's' ? byId(STRUKT[id].sub) : byId(id);
    const bild = typ === 's' ? molDiv(id, 'mol-big') : seqHTML(s, false);
    const namn = typ === 's' ? STRUKT[id].namn : pepName(s);
    app.innerHTML = !kort.flipped
      ? `<div class="card flash">${head}<div class="flash-front">${bild}</div>
          <p class="muted" style="text-align:center;margin-top:.8rem">Vad heter substansen, och vilken organism kommer den från?</p>${vand}</div>`
      : `<div class="card flash wide">${head}${typ === 's' ? bild : seqHTML(s)}
          <div class="plant-title" style="text-align:center;margin-top:.6rem">${namn}<span class="sv">ur ${orgHTML(s)}</span></div>
          <p class="small" style="text-align:center;color:var(--soft)">${s.klass} · ${BIONAMN[s.bio]}</p>
          ${syskonHTML(s, typ === 's' ? id : null)}
          <p style="text-align:center"><button class="linkbtn" onclick="openSub('${s.id}')">Visa fakta om ${s.namn}</button></p>${svar}</div>`;
    window.scrollTo(0, 0);
    return;
  }
}
/* The back of a card: the related substances in the same class, side by side, with the
   difference spelled out. Det är jämförelsen som sitter kvar — inte en struktur i taget. */
function syskonHTML(s, visadStruktur) {
  const syskon = famSyskon(s);
  if (!syskon.length) return '';
  const rutor = syskon.map(o => {
    const st = structsOf(o)[0];
    const bild = st ? molDiv(st.id) : o.sekvens ? seqHTML(o, false) : '';
    const diff = skillnad(s.id, o.id);
    return `<div class="syskon-ruta">${bild}<div class="syskon-namn">${o.namn}</div>
      ${diff ? `<div class="syskon-diff">${diff}</div>` : ''}</div>`;
  }).join('');
  return `<div class="syskon"><div class="syskon-h">Jämför med ${syskon.length > 1 ? 'de besläktade ämnena' : 'det besläktade ämnet'} i samma klass</div>
    <div class="syskon-rad">${rutor}</div></div>`;
}
function markKort(ok) {
  const id = kort.deck[kort.i], key = KORTLEKAR[kort.mode].key;
  let known = store.get(key, []).filter(k => k !== id);
  if (ok) known.push(id);
  store.set(key, known);
  kort.i++; kort.flipped = false; renderKort();
}

const subOpt = s => ({ key: s.id, html: s.namn });
const orgOpt = s => ({ key: s.latin, html: `<i>${s.latin}</i> <span class="muted">(${s.sv})</span>` });

const andra = (s, n, f = () => true) => shuffle(SUBSTANSER.filter(o => o.id !== s.id && f(o))).slice(0, n);
const andraOrg = (s, n) => shuffle(ORGS().filter(o => o.latin !== s.latin)).slice(0, n);
const structOK = () => !rdkFailed;
const structQ = s => structOK() ? pick(structsOf(s)) || null : null;
const kallaInfo = s => `${s.namn} kommer från ${orgHTML(s)}, en ${GRUPP[s.grupp].namn}.`;
const structInfo = x => { const s = byId(x.sub); return `Strukturen är <b>${x.namn}</b> (${s.klass}) ur <i>${s.latin}</i>.`; };
/* Each question type returns {q, opts:[{key,html}], right, info} or null if the substance can't make one. */
const QTYPES = {

  grupp(s) {

  biv(s) {

  },
  sekvensKalla(s) {

  sekvensVal(s) {
    if (!s.sekvens) return null;

      opts: [s, ...others].map(o => ({ key: o.id, html: seqHTML(o, false) })) };
  },
  /* typed */
  skrivKalla(s) {
    return { skriv: true, q: `Skriv det latinska namnet på organismen som <b>${s.namn}</b> ursprungligen kommer från.`, info: kallaInfo(s) };
  },
  skrivAnv(s) {
    if (!(s.nycklar || []).length) return null;

  },
  kontrast() {
    const alla = SUBSTANSER.flatMap(s => (s.kontraster || []).map(k => ({ ...k, sub: s.id })));
    if (!alla.length) return null;

let quiz = { temas: ['blandat'], antal: 10, qs: [], i: 0, score: 0, missed: [], answered: false };
const ANTAL_VAL = [5, 10, 15, 20];
/* Spaced repetition: wrong → weight × 2, right → × 0.5 (between 1/8 and 8). */
const VIKT_MIN = 0.125, VIKT_MAX = 8;
function uppdateraVikt(key, ok) {
  if (!key) return;
  const v = store.get('qvikt', {});
  v[key] = Math.min(VIKT_MAX, Math.max(VIKT_MIN, (v[key] || 1) * (ok ? 0.5 : 2)));
  store.set('qvikt', v);
}
function makeQuestions(tema, n, pool = SUBSTANSER, typer = TEMAN[tema].typer) {
  // 1. draw many different candidate questions…
  const cand = [], seen = new Set();
  for (let tries = 0; cand.length < n * 6 && tries < 3000; tries++) {
    const s = pick(pool), t = pick(typer), q = QTYPES[t](s);
    if (!q) continue;
    if (q.fig || q.seq) q.q2 = (q.fig || q.seq) + '|' + q.q;
    const id = q.q2 || q.q + '|' + (q.right || '');
    if (seen.has(id)) continue;
    seen.add(id);
    if (q.opts && (q.opts.length < 4 || new Set(q.opts.map(o => o.key)).size < q.opts.length)) continue;   // too few or duplicate options
    q.key = id;
    if (q.plant === undefined) q.plant = s.id;
    q.typ = t; if (q.opts) q.opts = shuffle(q.opts); cand.push(q);
  }
  // 2. …then pick n, each with a chance proportional to its weight, at most a fair share per substance
  const vikter = store.get('qvikt', {}), out = [], per = {};
  const tak = Math.ceil(n / new Set(pool.map(s => s.id)).size);
  for (const medTak of [true, false]) {
    while (out.length < n) {
      const ok = cand.filter(q => !medTak || !q.plant || (per[q.plant] || 0) < tak);
      if (!ok.length) break;
      const tot = ok.reduce((t, q) => t + (vikter[q.key] || 1), 0);
      let r = Math.random() * tot, i = 0;
      for (; i < ok.length - 1; i++) { r -= vikter[ok[i].key] || 1; if (r <= 0) break; }
      const q = ok[i];
      cand.splice(cand.indexOf(q), 1); out.push(q);
      if (q.plant) per[q.plant] = (per[q.plant] || 0) + 1;
    }

}
/* Same substance (and same kind of question) as far apart as possible in the round. Look-alike families count together,

function sprid(qs) {
  const kvar = [...qs], ut = [], senast = {}, antal = {};
  const vkey = (q, i) => { const s = q.plant && byId(q.plant); return s ? (s.fam || s.id) : 'x' + i; };
  kvar.forEach((q, i) => { q._v = vkey(q, i); antal[q._v] = (antal[q._v] || 0) + 1; });
  const steg = {};
  for (const v in antal) steg[v] = Math.max(1, Math.floor(qs.length / antal[v]));
  while (kvar.length) {
    const pos = ut.length, forra = ut[pos - 1];
    let bast = null, bastPoang = -1;
    for (const q of kvar) {
      const redo = senast[q._v] === undefined ? 1 : Math.min(1, (pos - senast[q._v]) / steg[q._v]);
      const poang = redo * 1000 + antal[q._v] * 20 + (forra && forra.typ === q.typ ? 0 : 5) + Math.random();
      if (poang > bastPoang) { bastPoang = poang; bast = q; }
    }
    kvar.splice(kvar.indexOf(bast), 1); ut.push(bast);
    senast[bast._v] = pos; antal[bast._v]--;
  }
  ut.forEach(q => delete q._v);

}

function logResult(id, ok) {

const SVAGA_MIN_TOTALT = 40, SVAGA_MIN_PER = 4, SVAGA_MIN_ANDEL_FEL = 0.4;
const antalSvar = () => Math.max(store.get('antalSvar', 0), Object.values(store.get('stats', {})).reduce((t, [r, w]) => t + r + w, 0));

/* Written answers can't be skipped: themes marked skrivkrav get at least 2 in 10 free-text questions,

const FRITEXT_ANDEL = 0.2, LATIN_ANDEL = 0.2;
function blandaIn(qs, pool, typer, andel, skydda = []) {
  const quota = Math.max(1, Math.round(qs.length * andel));
  const har = qs.filter(q => typer.includes(q.typ)).length;
  if (har >= quota) return qs;
  const finns = new Set(qs.map(q => q.key));
  const platser = shuffle(qs.map((q, i) => i).filter(i => !typer.includes(qs[i].typ) && !skydda.includes(qs[i].typ)));
  const ersatts = new Set(platser.slice(0, quota - har));
  const iRundan = new Set(qs.filter((q, i) => !ersatts.has(i)).map(q => q.plant));
  const nya = makeQuestions(null, quota * 4, pool, typer).filter(q => !finns.has(q.key))
    .sort((a, b) => iRundan.has(a.plant) - iRundan.has(b.plant)).slice(0, quota - har);
  nya.forEach((q, j) => { if (platser[j] !== undefined) qs[platser[j]] = q; });

/* ---------- free-text answers ("Vad används X till?"), judged by the student ---------- */
const normText = t => ' ' + t.toLowerCase().replace(/[^a-zåäöéü0-9 ]+/g, ' ').replace(/\s+/g, ' ').trim() + ' ';
function lev(a, b) {
  const d = Array.from({ length: a.length + 1 }, (_, i) => [i]);
  for (let j = 1; j <= b.length; j++) d[0][j] = j;
  for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++)
    d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
  return d[a.length][b.length];
}
function harStam(text, words, stem) {
  if (stem.includes(' ')) return text.includes(' ' + stem);
  if (stem.length < 3) return words.some(w => w.startsWith(stem));
  if (words.some(w => w.includes(stem))) return true;
  const tol = stem.length >= 10 ? 2 : stem.length >= 6 ? 1 : 0;
  if (!tol) return false;
  return words.some(w => [stem.length - 1, stem.length, stem.length + 1].some(L => w.length >= L - 1 && lev(stem, w.slice(0, L)) <= tol));
}

  const text = normText(svar), words = text.trim().split(' ').filter(Boolean);
  const begrepp = (s.nycklar || []).map(b => ({ ...b, hit: b.ord.some(st => harStam(text, words, st)) }));
  const krav = begrepp.filter(b => !b.valfri);
  const antal = krav.filter(b => b.hit).length;
  return { begrepp, ok: antal === krav.length, delvis: antal > 0 && antal < krav.length };
}

/* After a wrong multiple-choice answer: explain what the option the student picked actually is,

function choiceInfo(q, key) {
  const right = byId(q.plant);
  const jamfor = o => right && o.id !== right.id && (sammaFam(o, right) || o.latin === right.latin) && skillnad(o.id, right.id)
    ? `<div class="more"><b>Skillnaden mellan ${o.namn} och ${right.namn}:</b> ${skillnad(o.id, right.id)}</div>` : '';
  const x = STRUKT[key];
  if (x && (q.typ === 'strukturNamn' || q.typ === 'strukturVal')) {
    const o = byId(x.sub);
    return `Du valde <b>${x.namn}</b> (${o.klass}) ur <i>${o.latin}</i>.${jamfor(o)}` +
      (q.typ === 'strukturNamn' ? `<div style="max-width:280px;margin-top:.5rem">${molDiv(x.id)}</div><span class="small">Så här ser ${x.namn} ut. Jämför med strukturen i frågan.</span>` : '');
  }
  const o = byId(key);
  if (o) {
    const what = {
      substansUr: `kommer från ${orgHTML(o)}`, mekIVal: `verkar genom: ${o.mekKort}`, anv: `används vid: ${o.anvKort.join('; ')}`,
      biv: o.bivKort.length ? `förknippas med: ${o.bivKort.join('; ')}` : '', preparat: (o.preparat || []).length ? `finns i ${o.preparat.join(', ')}` : 'inte har något preparat i kursen',
      sekvensNamn: `har ${o.sekvens ? o.sekvens.rester.length : '?'} byggstenar och kommer från ${orgHTML(o)}`,
      sekvensVal: `kommer från ${orgHTML(o)}`
    }[q.typ];
    return `Du valde ${subLink(o)}${what ? `, som ${what}` : ''}.${jamfor(o)}`;
  }
  if (ORGS().some(v => v.latin === key)) {
    const subs = subsFromOrg(key), v = subs[0];
    return `Du valde <i>${key}</i> (${v.sv}), som är källan till ${subs.map(subLink).join(', ')}.`;
  }
  if (q.typ === 'grupp' || q.typ === 'framst') return '';
  // a text option: say which substance(s) it belongs to
  const falt = { mek: o => [o.mekKort], anvIVal: o => o.anvKort, bivIVal: o => o.bivKort, klass: o => [o.klass], bioVag: o => [BIONAMN[o.bio]] }[q.typ];
  if (!falt) return '';
  const owners = SUBSTANSER.filter(o => falt(o).includes(key));
  if (!owners.length) return '';

}

/* ============================ para ihop ============================ */
const PARTYPER = {
  kalla: { namn: 'Organism', val: s => `<i>${s.latin}</i>`, ok: () => true, krock: (a, b) => a.latin === b.latin },
  anv: { namn: 'Användning', val: s => pick(s.anvKort), ok: () => true, krock: delarTema }
};
let para = { typ: 'kalla', left: [], right: [], sel: null, fel: 0, kvar: 0 };
function choosePairs(typ, n) {
  const T = PARTYPER[typ], chosen = [];
  for (const s of shuffle(SUBSTANSER.filter(T.ok))) {
    if (chosen.length >= n) break;
    if (chosen.some(c => T.krock(c, s))) continue;   // two substances can't share an answer
    chosen.push(s);
  }
  return chosen.map(s => ({ id: s.id, val: T.val(s) }));
}
function viewPara() {
  app.innerHTML = `<div class="card"><h2>🔗 Para ihop</h2><p>Tryck på en substans och sedan på det som hör ihop med den. Para ihop substanser med:</p>
    <div class="chips">${Object.entries(PARTYPER).map(([k, t]) => `<button class="chip ${para.typ === k ? 'is-on' : ''}" onclick="byttPara('${k}')">${t.namn}</button>`).join('')}</div></div>
    <div id="parea" style="margin-top:.8rem"></div>`;

}
function byttPara(k) {

}
function startPara() {
  const T = PARTYPER[para.typ], pairs = choosePairs(para.typ, 5);
  para.left = shuffle(pairs); para.right = shuffle(pairs); para.sel = null; para.fel = 0; para.kvar = pairs.length;
  $('#parea').innerHTML = `<div class="match ${T.mol ? 'match-mol' : ''}">

    </div><p id="pstat" class="muted small" style="margin-top:.7rem">Fel hittills: 0</p><div id="pdone"></div>`;

  if (b.classList.contains('done')) return;

  if (!prev || prev.dataset.side === b.dataset.side) {

      <h3 class="resa-rubrik">Steg ${resa.i + 1} · ${fas.rubrik}</h3>
      ${(() => { const d = figurDelar(fas.key);
        // with diagrams: text on the left, pictures on the right. Without: one centred column,
        // so the text is not squeezed into half a page for nothing.
        return d.ritade
          ? `<div class="larom larom-split"><div class="larom-text">${fas.larom}</div><div class="larom-fig">${d.egen}${d.ritade}</div></div>`
          : `<div class="larom larom-ensam">${d.egen}<div class="larom-text">${fas.larom}</div></div>`; })()}
      <div class="btn-row">${tillbaka}<button class="btn btn-main" id="rgo">Tillämpa på ditt fall ➜</button></div></div>`;
    $('#rgo').addEventListener('click', () => { resa.vy = 'fraga'; renderResa(); });
    $('#rgo').focus({ preventScroll: true });
    window.scrollTo(0, 0);
    return;
  }

  if (!resa.steg[resa.i]) resa.steg[resa.i] = { val: shuffle(st.val.map((t, k) => ({ key: k, html: t }))), vald: null };
  const mitt = resa.steg[resa.i];
  app.innerHTML = `<div class="card wide">${huvud}
    <h3 class="resa-rubrik">Steg ${resa.i + 1} · ${fas.rubrik}</h3>
    <!-- Left = what you are looking at (scene, findings, picture), right = the decision
         (question, options, feedback). Both columns then carry weight on a wide screen,
         and in one column on a phone the order still reads scene → findings → question. -->
    <div class="resa-split">
      <!-- The journal comes first in the source so that on a phone it sits right under the
           observation, where what you have established so far is worth having before you read
           on. On desktop grid-areas put it back under the question in the right column. -->
      <div class="resa-logg">${loggHTML()}</div>
      <div class="resa-lasa">
        ${(BERATTELSER[resa.id] || {})[fas.key] ? `<div class="berattelse">${BERATTELSER[resa.id][fas.key]}</div>` : ''}
        <div class="ledtrad"><b class="ledtrad-h">Det du har att gå på</b><ul>${st.data.map(d => `<li>${d}</li>`).join('')}</ul></div>
        ${fas.key === 'val' && byId(uOf().sub) && bildOf(byId(uOf().sub)) ? `<div class="organismfoto">${photoHTML(byId(uOf().sub))}</div>` : ''}
        <div class="fig-liten">${figurFor(fas.key)}</div>
      </div>
      <div class="resa-sida">
        <div class="q-text">${st.fraga}</div>
        <div class="opts">${mitt.val.map((o, k) => `<button class="opt" data-k="${k}">${o.html}</button>`).join('')}</div>
        <div id="rfb"></div>
        <details class="repetera"><summary>↺ Läs om hur steget går till</summary><div class="larom">${fas.larom}</div></details>
      </div>
    </div>
    <div class="btn-row" id="rbakwrap">${tillbaka}</div></div>`;
  if (mitt.vald !== null) visaSvar();
  else app.querySelectorAll('.opt').forEach((b, k) => b.addEventListener('click', () => svaraResa(k)));
  window.scrollTo(0, 0);
}
function svaraResa(k) {
  if (resa.steg[resa.i].vald !== null) return;
  resa.steg[resa.i].vald = k;
  visaSvar();
}
// draws the answered state; used both when answering and when coming back to a stage
function visaSvar() {
  const fas = FASER[resa.i], st = stegData(), mitt = resa.steg[resa.i];
  const r = st.ratt, ok = mitt.val[mitt.vald].key === r;
  app.querySelectorAll('.opt').forEach((b, j) => {
    b.disabled = true;
    if (mitt.val[j].key === r) b.classList.add('ok'); else if (j === mitt.vald) b.classList.add('bad');
  });
  const s0 = byId(uOf().sub);
  const belon = fas.key === 'struktur' && s0 && (structsOf(s0).length || s0.sekvens)
    ? `<div class="belon"><b class="ledtrad-h">Så här ser molekylen ut</b>${structsOf(s0).length ? molDiv(structsOf(s0)[0].id, 'mol-big') : seqHTML(s0, false)}</div>` : '';
  // why the option the student picked was wrong — often because it did not exist yet
  const felText = !ok && st.varforFel && st.varforFel[mitt.val[mitt.vald].key];
  $('#rfb').innerHTML = `<div class="feedback ${ok ? 'ok' : 'bad'}">${ok ? '✅ Just det.' : '❌ Inte riktigt — rätt svar är markerat.'}
    ${felText ? `<div class="more"><b>Du valde:</b> ${st.val[mitt.val[mitt.vald].key]}<br>${felText}</div>` : ''}
    <div class="more">${felText ? '<b>Rätt svar:</b> ' : ''}${st.varfor}</div></div>${belon}
    <div class="btn-row"><button class="btn btn-bak" onclick="bakat()">← Tillbaka</button>
      <button class="btn btn-main" id="rnext">${resa.i + 1 < FASER.length ? 'Nästa steg ➜' : 'Se vad du hittade ➜'}</button></div>`;
  const bakwrap = $('#rbakwrap');          // the lone back button is replaced by the row below
  if (bakwrap) bakwrap.remove();
  // only the journal is redrawn — it has just gained this stage's finding. Everything else on
  // the page must stay put, the question and the options above all.
  const logg = app.querySelector('.resa-logg');
  if (logg) logg.innerHTML = loggHTML();
  $('#rnext').addEventListener('click', () => { resa.i++; resa.vy = svarat(resa.i) ? 'fraga' : 'larom'; renderResa(); });
  $('#rnext').focus({ preventScroll: true });
  $('#rnext').scrollIntoView({ block: 'nearest', behavior: 'smooth' });
}
function resaKlar() {
  const f = uOf(), s = byId(f.sub), h = HISTORIA[f.id] || {};
  const klara = resaKlara();
  if (!klara.includes(resa.id)) { klara.push(resa.id); store.set('resor', klara); }
  const bild = s && structsOf(s).length ? molDiv(structsOf(s)[0].id, 'mol-big') : s && s.sekvens ? seqHTML(s, false) : '';
  /* The reveal reads top to bottom: what it was → the molecule beside what became of it →
     the whole journey summed up across the full width. The structure is kept to a column of
     its own width so it cannot tower over the text beside it. */
  app.innerHTML = `<div class="card wide slutsida">
    <div class="slut-topp">
      <span class="slut-emoji">🎉</span>
      <p class="muted">Du har följt hela vägen, från observation till läkemedel.</p>
      <h2>${f.slutsats}</h2>
    </div>
    ${observationHTML(false)}
    <div class="slut-split">
      <div class="slut-bild">${bild}</div>
      <div class="slut-fakta">
        <dl class="facts">
          ${h.efterat ? `<div class="frow"><dt>Vad hände sedan</dt><dd>${h.efterat}</dd></div>` : ''}
          ${s ? `<div class="frow"><dt>Används vid</dt><dd>${s.anvKort.join('; ')}</dd></div>` : ''}
          ${s && s.bivKort.length ? `<div class="frow"><dt>Se upp med</dt><dd>${s.bivKort.join('; ')}</dd></div>` : ''}
        </dl>
        ${s ? `<p class="slut-lank">Läs hela faktabladet: ${subLink(s)}</p>` : ''}
      </div>
    </div>
    <div class="slut-logg">${loggHTML(true)}</div>
    ${ARV[f.id] ? `<div class="arv"><b class="bygger-h">⭑ Vad den här upptäckten gjorde möjlig</b>${ARV[f.id].arv}</div>` : ''}
    ${(() => {
      // stay inside the chosen track: the next discovery in the same track, in year order.
      // When the track runs out we say so and send them back to choose — never hop tracks on our own.
      const sp = sparFor(f), spar = SPAR[sp];
      const nasta = iAr(FALL.filter(x => sparFor(x) === sp && x.ar > f.ar))[0];
      return nasta
        ? `<div class="btn-row">
            <button class="btn btn-bak" onclick="resa.i=FASER.length-1;resa.vy='fraga';renderResa()">← Tillbaka</button>
            <button class="btn btn-main" onclick="startResa('${nasta.id}')">▶ Nästa i spåret: ${nasta.ar} — ${nasta.titel}</button>
            <button class="btn" onclick="viewResa()">Byt spår</button>
          </div>
          <p class="small muted" style="margin-top:.6rem">${spar.ikon} Nästa upptäckt i spåret bygger vidare på den du just följt.</p>`
        : `<div class="spar-klart"><b>${spar.ikon} Du har följt hela spåret ”${spar.namn}”, från ${sparFall(sp)[0].ar} till ${f.ar}.</b>
             <span>Nu kan du ta det andra spåret.</span></div>
           <div class="btn-row">
            <button class="btn btn-bak" onclick="resa.i=FASER.length-1;resa.vy='fraga';renderResa()">← Tillbaka</button>
            <button class="btn btn-main" onclick="viewResa()">▶ Välj spår</button>
          </div>`; })()}
    </div>`;
  window.scrollTo(0, 0);
}

window.addEventListener('DOMContentLoaded', () => { startRDKit(); go(location.hash.slice(1)); });
</script>
